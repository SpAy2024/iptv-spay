    <style>

    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <div class="col-md-4 col-lg-3 sidebar">
                <h3 class="text-center mb-2" style="font-size:1.1em;">🎬 SpayCine</h3>
                
                <div class="nav-tabs-custom">
                    <button class="nav-tab active" data-section="tv">📺 TV</button>
                    <button class="nav-tab" data-section="peliculas">🎥 Películas</button>
                    <button class="nav-tab" data-section="series">📺 Series</button>
                </div>
                
                <input type="text" id="searchInput" placeholder="🔍 Buscar...">
                <div id="contentContainer">
                    <div id="channelsList"><div class="text-center p-3"><div class="spinner-border text-light"></div><p class="mt-2">Cargando canales...</p></div></div>
                </div>
                <div class="stats" id="stats"></div>
                <div class="custom-url-section">
                    <input type="text" id="customUrl" placeholder="🔗 URL M3U8 o ID (ej: x84eirw)">

                </div>
            </div>
            <div class="col-md-8 col-lg-9 player-area">
                <div class="player-container">
                    <video id="videoPlayer" controls preload="auto" style="display: block;"></video>
                    <iframe id="dmIframe" allow="autoplay; fullscreen"></iframe>
                    <div id="currentChannel" class="current-channel">⚡ No hay contenido seleccionado</div>
                    <div id="loadingMessage" class="loading-message">📡 Cargando...</div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        // ==================== CONFIGURACIÓN ====================
        const API_BASE = 'https://spaycine.xyz/api';
        const PROXY_URL = 'https://iptv-spay.onrender.com/proxy?url=';
        
        // ==================== VARIABLES GLOBALES ====================
        let currentHls = null;
        let canalesData = [];
        let seccionActual = 'tv';
        let timeoutBusqueda = null;
        let contenidoActual = null;
        
        // ==================== MIS CANALES DE DAILYMOTION ====================
        const misCanalesDailymotion = [
            { nombre: "RED UNO LPZ HD", pais: "Bolivia", logo: "https://i.postimg.cc/HWQ1JNbV/RED-UNO-LPZ-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/xa0fwio", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "RED UNO CBBA HD", pais: "Bolivia", logo: "https://i.postimg.cc/NM6C0WZy/RED-UNO-CBBA-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/xa0qka8", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "RED UNO SCZ HD", pais: "Bolivia", logo: "https://i.postimg.cc/6QRYHkWk/RED-UNO-SC-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/x9n2qyk", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "UNITEL BOLIVIA HD", pais: "Bolivia", logo: "https://i.ibb.co/pzVXZcg/UNITEL-BOLIVIA-VLC.jpg", url: "https://www.dailymotion.com/video/x7wzxiw", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "POV UNITEL HD", pais: "Bolivia", logo: "https://i.ibb.co/p3B7tSd/bolivia-hd-04.jpg", url: "https://www.dailymotion.com/video/x8eimg9", tipo: "dailymotion", categoria: "entretenimiento" },
            { nombre: "ATB BOLIVIA HD", pais: "Bolivia", logo: "https://i.postimg.cc/Y06y7NgW/ATB-BOLIVIA-HD.jpg", url: "https://www.dailymotion.com/video/x84eirw", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "TELESUR HD", pais: "Bolivia", logo: "https://i.postimg.cc/QxmZpWDL/T-sr-Vlc08.jpg", url: "https://www.dailymotion.com/video/x82ug5r", tipo: "dailymotion", categoria: "noticias" }
        ];

        // ==================== FUNCIONES DE API ====================
        async function obtenerPeliculas() {
            try {
                const response = await fetch(`${API_BASE}/listar_contenido.php?tipo=pelicula`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('Error cargando películas:', error);
                return [];
            }
        }

        async function obtenerSeries() {
            try {
                const response = await fetch(`${API_BASE}/listar_contenido.php?tipo=serie`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('Error cargando series:', error);
                return [];
            }
        }

        async function obtenerEpisodios(serieId, temporada) {
            try {
                const response = await fetch(`${API_BASE}/episodios.php?id=${serieId}&t=${temporada}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('Error cargando episodios:', error);
                return null;
            }
        }

        // ==================== EXTRAER M3U8 DESDE URL DEL SERVIDOR ====================
        async function extraerM3U8DesdeServidor(urlServidor) {
            try {
                console.log('🔍 Extrayendo M3U8 desde:', urlServidor);
                
                // Usar proxy para evitar CORS
                const proxyUrl = `${PROXY_URL}${encodeURIComponent(urlServidor)}`;
                const response = await fetch(proxyUrl);
                const html = await response.text();
                
                // Buscar .m3u8 en el HTML (múltiples patrones)
                const patrones = [
                    /https?:\/\/[^\s"']+\.m3u8[^\s"']*/i,
                    /"file":"([^"]+\.m3u8[^"]*)"/i,
                    /'file':'([^']+\.m3u8[^']*)'/i,
                    /src=["']([^"']+\.m3u8[^"']*)["']/i,
                    /url=["']([^"']+\.m3u8[^"']*)["']/i,
                    /source=["']([^"']+\.m3u8[^"']*)["']/i,
                    /video=["']([^"']+\.m3u8[^"']*)["']/i
                ];
                
                for (const patron of patrones) {
                    const match = html.match(patron);
                    if (match) {
                        const url = match[1] || match[0];
                        if (url && url.includes('.m3u8')) {
                            console.log('✅ M3U8 encontrado:', url);
                            return url;
                        }
                    }
                }
                
                // Buscar en el JSON dentro del HTML
                try {
                    const jsonMatch = html.match(/\{[^{]*"file"[^{]*"([^"]+\.m3u8[^"]*)"[^}]*\}/i);
                    if (jsonMatch) {
                        const jsonData = JSON.parse('{' + jsonMatch[0] + '}');
                        if (jsonData.file && jsonData.file.includes('.m3u8')) {
                            console.log('✅ M3U8 encontrado en JSON:', jsonData.file);
                            return jsonData.file;
                        }
                    }
                } catch (e) {}
                
                // Buscar en el contenido de scripts
                const scriptRegex = /<script[^>]*>([\s\S]*?)<\/script>/gi;
                let scriptMatch;
                while ((scriptMatch = scriptRegex.exec(html)) !== null) {
                    const scriptContent = scriptMatch[1];
                    const urlMatch = scriptContent.match(/https?:\/\/[^\s"']+\.m3u8[^\s"']*/i);
                    if (urlMatch) {
                        console.log('✅ M3U8 encontrado en script:', urlMatch[0]);
                        return urlMatch[0];
                    }
                }
                
                console.log('⚠️ No se encontró M3U8 en la página');
                return null;
            } catch (error) {
                console.error('Error extrayendo M3U8:', error);
                return null;
            }
        }

        // ==================== REPRODUCIR DESDE SERVIDOR ====================
        async function reproducirDesdeServidor(servidor, titulo) {
            const loadingMsg = document.getElementById('loadingMessage');
            loadingMsg.style.display = 'block';
            document.getElementById('currentChannel').innerHTML = `🎬 ${titulo}<br><small>Extrayendo stream...</small>`;
            
            const m3u8Url = await extraerM3U8DesdeServidor(servidor.url);
            
            if (m3u8Url) {
                // Reproducir el M3U8
                const video = document.getElementById('videoPlayer');
                const iframe = document.getElementById('dmIframe');
                iframe.style.display = 'none';
                video.style.display = 'block';
                
                if (currentHls) { currentHls.destroy(); currentHls = null; }
                if (video.src) { video.pause(); video.removeAttribute('src'); video.load(); }
                
                if (Hls.isSupported()) {
                    currentHls = new Hls({ debug: false, enableWorker: true });
                    currentHls.loadSource(m3u8Url);
                    currentHls.attachMedia(video);
                    currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                        loadingMsg.style.display = 'none';
                        document.getElementById('currentChannel').innerHTML = `🎬 ${titulo}<br><small>🔴 REPRODUCIENDO (${servidor.server})</small>`;
                        video.play().catch(e => console.error(e));
                    });
                    currentHls.on(Hls.Events.ERROR, () => {
                        loadingMsg.style.display = 'none';
                        document.getElementById('currentChannel').innerHTML = `🎬 ${titulo}<br><small>❌ Error de stream</small>`;
                    });
                } else {
                    video.src = m3u8Url;
                    video.addEventListener('loadedmetadata', () => {
                        loadingMsg.style.display = 'none';
                        document.getElementById('currentChannel').innerHTML = `🎬 ${titulo}<br><small>🔴 REPRODUCIENDO</small>`;
                        video.play();
                    }, { once: true });
                }
            } else {
                loadingMsg.style.display = 'none';
                document.getElementById('currentChannel').innerHTML = `🎬 ${titulo}<br><small>❌ No se pudo obtener el stream</small>`;
            }
        }

        // ==================== CARGAR LISTA M3U ====================
        async function cargarListaM3U(url, paisOrigen) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const m3uContent = await response.text();
                return parsearM3U(m3uContent, paisOrigen);
            } catch (error) {
                console.error(`Error cargando ${url}:`, error);
                return [];
            }
        }

        function parsearM3U(content, paisOrigen) {
            const lines = content.split('\n');
            const canales = [];
            let currentChannel = null;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    const lastComma = line.lastIndexOf(',');
                    const nombre = lastComma !== -1 ? line.substring(lastComma + 1).trim() : 'Canal sin nombre';
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const logo = logoMatch ? logoMatch[1] : '';
                    const idMatch = line.match(/tvg-id="([^"]*)"/);
                    const id = idMatch ? idMatch[1] : '';
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    const grupo = groupMatch ? groupMatch[1] : '';
                    
                    currentChannel = {
                        id: id,
                        nombre: nombre,
                        pais: paisOrigen,
                        logo: logo,
                        url: '',
                        tipo: 'm3u8',
                        categoria: 'entretenimiento',
                        grupo: grupo
                    };
                } else if (line && !line.startsWith('#') && currentChannel) {
                    currentChannel.url = line;
                    if (currentChannel.url.startsWith('http')) {
                        canales.push(currentChannel);
                    }
                    currentChannel = null;
                }
            }
            return canales;
        }

        // ==================== CARGAR TODOS LOS CANALES ====================
        async function cargarTodosLosCanales() {
            let todosLosCanales = [...misCanalesDailymotion];
            console.log('📡 Cargando canales desde iptv-org...');
            
            const paises = ['bo', 'ar', 'br', 'cl', 'co', 'ec', 'py', 'pe', 'uy', 've', 'cr', 'sv', 'gt', 'hn', 'ni', 'pa', 'do', 'pr', 'es', 'mx'];
            const nombres = {
                'bo': 'Bolivia', 'ar': 'Argentina', 'br': 'Brasil', 'cl': 'Chile',
                'co': 'Colombia', 'ec': 'Ecuador', 'py': 'Paraguay', 'pe': 'Perú',
                'uy': 'Uruguay', 've': 'Venezuela', 'cr': 'Costa Rica', 'sv': 'El Salvador',
                'gt': 'Guatemala', 'hn': 'Honduras', 'ni': 'Nicaragua', 'pa': 'Panamá',
                'do': 'República Dominicana', 'pr': 'Puerto Rico', 'es': 'España', 'mx': 'México'
            };
            
            for (const codigo of paises) {
                try {
                    const canales = await cargarListaM3U(`https://iptv-org.github.io/iptv/countries/${codigo}.m3u`, nombres[codigo]);
                    console.log(`✅ ${nombres[codigo]}: ${canales.length} canales`);
                    todosLosCanales = todosLosCanales.concat(canales);
                } catch (error) {
                    console.error(`Error cargando ${codigo}:`, error);
                }
            }
            
            try {
                const deportes = await cargarListaM3U('https://iptv-org.github.io/iptv/categories/sports.m3u', 'Deportes');
                console.log(`⚽ Deportes: ${deportes.length} canales`);
                todosLosCanales = todosLosCanales.concat(deportes);
            } catch (error) {
                console.error('Error cargando deportes:', error);
            }
            
            console.log(`✅ Total canales: ${todosLosCanales.length}`);
            return todosLosCanales;
        }

        // ==================== RENDERIZAR TV ====================
        function renderTV(canales) {
            const porPais = {};
            canales.forEach(canal => {
                if (!porPais[canal.pais]) porPais[canal.pais] = [];
                porPais[canal.pais].push(canal);
            });
            
            const paisesOrdenados = Object.keys(porPais).sort();
            let html = '';
            for (const pais of paisesOrdenados) {
                html += `<div class="country-group" data-pais="${pais}"><div class="country-title">${pais}</div>`;
                porPais[pais].forEach(canal => {
                    const logoHtml = canal.logo ? 
                        `<img src="${canal.logo}" alt="${canal.nombre}" onerror="this.parentElement.innerHTML='${canal.nombre.charAt(0)}'">` : 
                        `<span>${canal.nombre.charAt(0)}</span>`;
                    html += `
                        <div class="channel-item" data-nombre="${canal.nombre.toLowerCase()}" data-url="${canal.url}" data-nombre-original="${canal.nombre}" data-tipo="${canal.tipo}">
                            <div class="channel-logo">${logoHtml}</div>
                            <span class="channel-name">${canal.nombre.substring(0, 40)}</span>
                            <button class="btn-play" onclick="event.stopPropagation(); loadChannel('${canal.url.replace(/'/g, "\\'")}', '${canal.nombre.replace(/'/g, "\\'")}', '${canal.tipo}')">▶</button>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            
            document.getElementById('contentContainer').innerHTML = html;
            document.getElementById('stats').innerHTML = `📊 ${canales.length} canales | ${paisesOrdenados.length} países`;
            
            document.querySelectorAll('.channel-item').forEach(item => {
                item.addEventListener('click', () => {
                    loadChannel(item.dataset.url, item.dataset.nombreOriginal, item.dataset.tipo);
                });
            });
            
            aplicarBusquedaTV();
        }

        // ==================== RENDERIZAR PELÍCULAS ====================
        function renderPeliculas(items) {
            let html = `<div class="movie-grid">`;
            items.forEach(item => {
                const poster = item.poster_url || 'https://via.placeholder.com/200x300/667eea/ffffff?text=Sin+imagen';
                const title = item.titulo || 'Sin título';
                const year = item.year || '';
                html += `
                    <div class="movie-card" onclick="verDetallePelicula(${item.id})">
                        <img src="${poster}" alt="${title}" onerror="this.src='https://via.placeholder.com/200x300/667eea/ffffff?text=${encodeURIComponent(title)}'">
                        <div class="title">${title}</div>
                        <div class="year">${year}</div>
                    </div>
                `;
            });
            html += `</div>`;
            document.getElementById('contentContainer').innerHTML = html;
            document.getElementById('stats').innerHTML = `📊 ${items.length} películas`;
        }

        // ==================== RENDERIZAR SERIES ====================
        function renderSeries(items) {
            let html = `<div class="movie-grid">`;
            items.forEach(item => {
                const poster = item.poster_url || 'https://via.placeholder.com/200x300/667eea/ffffff?text=Sin+imagen';
                const title = item.titulo || 'Sin título';
                const temp = item.temporadas || '';
                html += `
                    <div class="movie-card" onclick="verDetalleSerie(${item.id})">
                        <img src="${poster}" alt="${title}" onerror="this.src='https://via.placeholder.com/200x300/667eea/ffffff?text=${encodeURIComponent(title)}'">
                        <div class="title">${title}</div>
                        <div class="year">${temp} temporadas</div>
                    </div>
                `;
            });
            html += `</div>`;
            document.getElementById('contentContainer').innerHTML = html;
            document.getElementById('stats').innerHTML = `📊 ${items.length} series`;
        }

        // ==================== DETALLE DE PELÍCULA ====================
        async function verDetallePelicula(id) {
            const peliculas = await obtenerPeliculas();
            const pelicula = peliculas.find(p => p.id === id);
            if (!pelicula) return;
            
            contenidoActual = pelicula;
            let html = `
                <div class="detalle-contenido">
                    <button onclick="cargarSeccion('peliculas')" class="btn btn-sm btn-secondary mb-2">← Volver</button>
                    <h4>${pelicula.titulo} (${pelicula.year || ''})</h4>
                    <div class="servidores-lista">
                        <span class="text-muted">Servidores:</span>
            `;
            
            if (pelicula.servidores && pelicula.servidores.length > 0) {
                pelicula.servidores.forEach((serv, index) => {
                    html += `<button class="servidor-btn" onclick="reproducirDesdeServidor({server:'${serv.server}', url:'${serv.url}'}, '${pelicula.titulo}')">▶ ${serv.server}</button>`;
                });
            } else {
                html += `<span class="text-muted">Sin servidores disponibles</span>`;
            }
            
            html += `</div></div>`;
            document.getElementById('contentContainer').innerHTML = html;
            document.getElementById('stats').innerHTML = `🎬 Detalle de película`;
        }

        // ==================== DETALLE DE SERIE ====================
        async function verDetalleSerie(id) {
            const series = await obtenerSeries();
            const serie = series.find(s => s.id === id);
            if (!serie) return;
            
            contenidoActual = serie;
            let html = `
                <div class="detalle-contenido">
                    <button onclick="cargarSeccion('series')" class="btn btn-sm btn-secondary mb-2">← Volver</button>
                    <h4>${serie.titulo}</h4>
                    <p class="small">${serie.temporadas || 0} temporadas | ${serie.total_episodios || 0} episodios</p>
                    <div class="servidores-lista">
                        <span class="text-muted">Temporadas:</span>
            `;
            
            // Generar botones para temporadas disponibles (1 a temporadas)
            const numTemp = serie.temporadas || 1;
            for (let t = 1; t <= numTemp; t++) {
                html += `<button class="servidor-btn" onclick="verEpisodios(${serie.id}, ${t})">T${t}</button>`;
            }
            
            html += `</div><div id="episodiosContainer"></div></div>`;
            document.getElementById('contentContainer').innerHTML = html;
            document.getElementById('stats').innerHTML = `📺 Detalle de serie`;
        }

        // ==================== VER EPISODIOS ====================
        async function verEpisodios(serieId, temporada) {
            const data = await obtenerEpisodios(serieId, temporada);
            if (!data || !data.episodios) return;
            
            let html = `<div class="mt-3"><h6>${data.titulo} - Temporada ${temporada}</h6>`;
            data.episodios.forEach(ep => {
                let servidoresHtml = '';
                if (ep.servidores && ep.servidores.length > 0) {
                    ep.servidores.forEach(serv => {
                        servidoresHtml += `<button class="servidor-btn" onclick="reproducirDesdeServidor({server:'${serv.server}', url:'${serv.url}'}, '${data.titulo} - T${temporada}E${ep.numero}')">${serv.server}</button>`;
                    });
                } else {
                    servidoresHtml = `<span class="text-muted">Sin servidores</span>`;
                }
                
                html += `
                    <div class="episodio-item">
                        <span class="num">${ep.numero}</span>
                        <span style="flex:1;">${ep.titulo || 'Episodio '+ep.numero}</span>
                        <span class="servidores-lista" style="flex-wrap:wrap;">${servidoresHtml}</span>
                    </div>
                `;
            });
            html += `</div>`;
            
            document.getElementById('episodiosContainer').innerHTML = html;
        }

        // ==================== CARGAR SECCIÓN ====================
        async function cargarSeccion(seccion) {
            seccionActual = seccion;
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.section === seccion);
            });
            
            const searchInput = document.getElementById('searchInput');
            searchInput.placeholder = seccion === 'tv' ? '🔍 Buscar canal...' : '🔍 Buscar...';
            searchInput.value = '';
            
            if (seccion === 'tv') {
                renderTV(canalesData);
                return;
            }
            
            document.getElementById('contentContainer').innerHTML = `<div class="text-center p-3"><div class="spinner-border text-light"></div><p class="mt-2">Cargando ${seccion}...</p></div>`;
            
            if (seccion === 'peliculas') {
                const peliculas = await obtenerPeliculas();
                renderPeliculas(peliculas);
            } else if (seccion === 'series') {
                const series = await obtenerSeries();
                renderSeries(series);
            }
        }

        // ==================== BUSCAR ====================
        function aplicarBusquedaTV() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.channel-item').forEach(item => {
                const nombre = item.dataset.nombre;
                item.classList.toggle('hidden', !nombre.includes(searchTerm));
            });
            
            document.querySelectorAll('.country-group').forEach(group => {
                const visible = group.querySelectorAll('.channel-item:not(.hidden)').length > 0;
                group.style.display = visible ? '' : 'none';
            });
            
            const total = document.querySelectorAll('.channel-item:not(.hidden)').length;
            document.getElementById('stats').innerHTML = `📊 ${total} canales visibles`;
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', function() {
                clearTimeout(timeoutBusqueda);
                timeoutBusqueda = setTimeout(() => {
                    if (seccionActual === 'tv') {
                        aplicarBusquedaTV();
                    }
                }, 300);
            });
        }

        // ==================== REPRODUCIR CANAL TV ====================
        async function loadChannel(url, channelName, tipo = 'm3u8') {
            const loadingMsg = document.getElementById('loadingMessage');
            const video = document.getElementById('videoPlayer');
            const iframe = document.getElementById('dmIframe');
            
            if (currentHls) { currentHls.destroy(); currentHls = null; }
            if (video.src) { video.pause(); video.removeAttribute('src'); video.load(); }
            if (iframe) { iframe.src = ''; iframe.style.display = 'none'; }
            
            video.style.display = 'block';
            loadingMsg.style.display = 'block';
            document.getElementById('currentChannel').innerHTML = `📺 ${channelName}<br><small>Cargando...</small>`;
            
            document.querySelectorAll('.channel-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.nombreOriginal === channelName) item.classList.add('active');
            });
            
            const dailymotionId = url.match(/\/video\/([a-z0-9]+)/i);
            if (dailymotionId || tipo === 'dailymotion') {
                const videoId = dailymotionId ? dailymotionId[1] : null;
                if (videoId) {
                    iframe.style.display = 'block';
                    video.style.display = 'none';
                    iframe.src = `https://geo.dailymotion.com/player.html?video=${videoId}&autoplay=1`;
                    loadingMsg.style.display = 'none';
                    document.getElementById('currentChannel').innerHTML = `📺 ${channelName}<br><small>🔴 REPRODUCIENDO (Dailymotion)</small>`;
                    return;
                }
            }
            
            if (url.includes('.m3u8')) {
                reproducirStream(url, channelName, loadingMsg);
            } else if (url.startsWith('http')) {
                loadingMsg.style.display = 'none';
                document.getElementById('currentChannel').innerHTML = `
                    📺 ${channelName}<br>
                    <small>⚠️ No es un stream directo.<br>
                    <a href="${url}" target="_blank" style="color: #ffd700;">▶ Abrir en nueva pestaña</a></small>
                `;
            } else {
                loadingMsg.style.display = 'none';
                document.getElementById('currentChannel').innerHTML = `📺 ${channelName}<br><small>❌ Formato no soportado</small>`;
            }
        }

        function reproducirStream(streamUrl, channelName, loadingMsg) {
            const video = document.getElementById('videoPlayer');
            if (currentHls) { currentHls.destroy(); currentHls = null; }
            if (video.src) { video.pause(); video.removeAttribute('src'); video.load(); }
            
            if (Hls.isSupported()) {
                currentHls = new Hls({ debug: false, enableWorker: true });
                currentHls.loadSource(streamUrl);
                currentHls.attachMedia(video);
                currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                    loadingMsg.style.display = 'none';
                    document.getElementById('currentChannel').innerHTML = `📺 ${channelName}<br><small>🔴 EN VIVO</small>`;
                    video.play().catch(e => console.error(e));
                });
                currentHls.on(Hls.Events.ERROR, () => {
                    loadingMsg.style.display = 'none';
                    document.getElementById('currentChannel').innerHTML = `📺 ${channelName}<br><small>❌ Error de stream</small>`;
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => {
                    loadingMsg.style.display = 'none';
                    document.getElementById('currentChannel').innerHTML = `📺 ${channelName}<br><small>🔴 EN VIVO</small>`;
                    video.play();
                }, { once: true });
            } else {
                loadingMsg.style.display = 'none';
                document.getElementById('currentChannel').innerHTML = `📺 ${channelName}<br><small>❌ No se puede reproducir</small>`;
            }
        }

        // ==================== URL PERSONALIZADA ====================
        function setupCustomUrl() {
            const customUrl = document.getElementById('customUrl');
            const playCustom = document.getElementById('playCustom');
            
            playCustom.onclick = () => {
                const input = customUrl.value.trim();
                if (!input) return;
                if (input.match(/^x[a-z0-9]+$/i)) {
                    loadChannel(`https://www.dailymotion.com/video/${input}`, "URL Personalizada", "dailymotion");
                } else {
                    loadChannel(input, "URL Personalizada", "m3u8");
                }
            };
        }

        // ==================== NAVEGACIÓN ====================
        function setupNavigation() {
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    cargarSeccion(this.dataset.section);
                });
            });
        }

        // ==================== INICIALIZAR ====================
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Iniciando SpayCine...');
            
            canalesData = await cargarTodosLosCanales();
            renderTV(canalesData);
            
            setupNavigation();
            setupSearch();
            setupCustomUrl();
        });
    </script>
</body>
</html>
