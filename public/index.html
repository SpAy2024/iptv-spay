<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SpayCine TV - Canales en vivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET Y BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0e27;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        
        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

        /* ===== LAYOUT PRINCIPAL ===== */
        .app-container {
            display: flex;
            height: 100vh;
            background: #0f1328;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 320px;
            min-width: 320px;
            height: 100vh;
            background: #0f1328;
            overflow-y: auto;
            padding: 28px 20px;
            border-right: 1px solid rgba(255,255,255,0.04);
            display: flex;
            flex-direction: column;
        }

        /* ===== LOGO ===== */
        .logo {
            font-size: 1.6em;
            font-weight: 900;
            letter-spacing: -0.8px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo span { color: #e50914; }
        .logo i { font-size: 1.2em; color: #e50914; }

        /* ===== BÚSQUEDA ===== */
        #searchInput {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 30px;
            padding: 12px 20px;
            font-size: 0.85em;
            width: 100%;
            color: #fff;
            transition: all 0.3s ease;
            margin-bottom: 18px;
        }
        #searchInput::placeholder { color: rgba(255,255,255,0.25); font-weight: 300; }
        #searchInput:focus { 
            outline: none; 
            border-color: #e50914;
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 0 4px rgba(229, 9, 20, 0.08);
        }

        /* ===== FILTROS ===== */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 18px;
        }
        .filter-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.4);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.75em;
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: 500;
        }
        .filter-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .filter-btn.active { 
            background: #e50914; 
            color: #fff; 
            border-color: #e50914;
        }

        /* ===== PAÍSES ===== */
        .country-section {
            margin-bottom: 16px;
        }
        .country-section .country-title {
            font-size: 0.75em;
            font-weight: 700;
            color: rgba(255,255,255,0.4);
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .country-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .country-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85em;
            color: rgba(255,255,255,0.5);
            border: 1px solid transparent;
        }
        .country-item:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }
        .country-item.active {
            background: rgba(229, 9, 20, 0.08);
            color: #fff;
            border-color: rgba(229, 9, 20, 0.1);
        }
        .country-item .channels-count {
            font-size: 0.6em;
            color: rgba(255,255,255,0.15);
            margin-left: auto;
        }

        /* ===== CONTENIDO PRINCIPAL ===== */
        .main-content {
            flex: 1;
            padding: 28px 32px;
            overflow-y: auto;
            height: 100vh;
        }

        /* ===== ENCABEZADO ===== */
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .main-header h1 {
            font-size: 1.4em;
            font-weight: 700;
            color: #fff;
        }
        .main-header .live-badge {
            background: rgba(229, 9, 20, 0.12);
            color: #e50914;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7em;
            font-weight: 600;
        }

        /* ===== GRID DE CANALES ===== */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }

        .channel-card {
            background: rgba(255,255,255,0.02);
            border-radius: 14px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.03);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .channel-card:hover {
            background: rgba(255,255,255,0.05);
            transform: translateY(-4px);
            border-color: rgba(255,255,255,0.08);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .channel-card .logo {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .channel-card .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .channel-card .logo .fallback {
            font-size: 16px;
            font-weight: 700;
            color: rgba(255,255,255,0.2);
        }
        .channel-card .info {
            flex: 1;
            min-width: 0;
        }
        .channel-card .info .name {
            font-size: 0.85em;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-card .info .category {
            font-size: 0.65em;
            color: rgba(255,255,255,0.25);
            margin-top: 2px;
        }
        .channel-card .play-btn {
            background: rgba(255,255,255,0.04);
            border: none;
            color: rgba(255,255,255,0.3);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1em;
        }
        .channel-card .play-btn:hover {
            background: #e50914;
            color: #fff;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.2);
        }
        .channel-card.hidden { display: none; }

        /* ===== FOCUS PARA TV ===== */
        .focus-active {
            outline: 3px solid #e50914 !important;
            outline-offset: 4px !important;
            box-shadow: 0 0 40px rgba(229, 9, 20, 0.3) !important;
            transform: scale(1.04) !important;
            z-index: 10 !important;
            transition: all 0.15s ease !important;
        }
        .channel-card.focus-active {
            background: rgba(229, 9, 20, 0.12) !important;
            border-color: #e50914 !important;
        }
        .filter-btn.focus-active {
            background: #e50914 !important;
            color: #fff !important;
            transform: scale(1.1) !important;
        }
        .country-item.focus-active {
            background: rgba(229, 9, 20, 0.12) !important;
            border-color: rgba(229, 9, 20, 0.2) !important;
        }
        #searchInput.focus-active,
        #customUrl.focus-active {
            border-color: #e50914 !important;
            box-shadow: 0 0 0 4px rgba(229, 9, 20, 0.2) !important;
        }
        #playCustom.focus-active {
            background: #e50914 !important;
            border-color: #e50914 !important;
        }
        .modal-loading.focus-active { outline: none !important; transform: none !important; }

        /* ===== ESTADÍSTICAS ===== */
        .stats {
            text-align: center;
            margin-top: 12px;
            padding: 8px;
            font-size: 0.65em;
            color: rgba(255,255,255,0.15);
        }

        /* ================================================================
           MODAL DEL REPRODUCTOR PERSONALIZADO (ESTILO XUPER TV)
        ================================================================ */
        .player-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .player-modal-overlay.active { display: flex; }

        .player-modal {
            width: 100%;
            height: 100vh;
            max-height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
        }

        /* ===== HEADER DEL REPRODUCTOR ===== */
        .player-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(0,0,0,0.85);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            flex-shrink: 0;
            z-index: 10;
            backdrop-filter: blur(10px);
        }
        .player-modal-header .player-info {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
        }
        .player-modal-header .player-info .channel-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .player-modal-header .player-info .channel-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .player-modal-header .player-info .channel-details {
            min-width: 0;
        }
        .player-modal-header .player-info .channel-details .name {
            font-weight: 700;
            font-size: 1.1em;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .player-modal-header .player-info .channel-details .status {
            font-size: 0.75em;
            color: rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .player-modal-header .player-info .channel-details .status .live-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #e50914;
            border-radius: 50%;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .player-modal-header .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .player-modal-header .player-controls .control-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.6);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1em;
        }
        .player-modal-header .player-controls .control-btn:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }
        .player-modal-header .player-controls .control-btn.fullscreen-btn {
            background: rgba(229, 9, 20, 0.15);
            border-color: rgba(229, 9, 20, 0.2);
            color: #e50914;
        }
        .player-modal-header .player-controls .control-btn.fullscreen-btn:hover {
            background: #e50914;
            color: #fff;
            border-color: #e50914;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.2);
        }
        .player-modal-header .player-controls .control-btn.close-btn:hover {
            background: #e50914;
            transform: rotate(90deg);
            border-color: #e50914;
        }
        .player-modal-header .player-controls .control-btn.focus-active {
            outline: 2px solid #e50914;
            outline-offset: 2px;
            transform: scale(1.05);
        }

        /* ===== CUERPO DEL REPRODUCTOR ===== */
        .player-modal-body {
            flex: 1;
            background: #000;
            position: relative;
            min-height: 70vh;
            max-height: 100vh;
        }
        .player-modal-body video {
            width: 100%;
            height: 100%;
            max-height: 100vh;
            background: #000;
        }
        .player-modal-body iframe {
            width: 100%;
            height: 100%;
            max-height: 100vh;
            border: none;
            display: none;
        }

        /* ===== LOADING ===== */
        .modal-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            text-align: center;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 40px 60px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.04);
        }
        .modal-loading .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.06);
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 14px;
        }
        .modal-loading.active { display: block; }

        /* ===== OVERLAY DE INFORMACIÓN DEL CANAL (DURANTE REPRODUCCIÓN) ===== */
        .player-overlay-info {
            position: absolute;
            bottom: 40px;
            left: 30px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 12px;
            border-left: 3px solid #e50914;
            z-index: 5;
            display: none;
            max-width: 70%;
        }
        .player-overlay-info .overlay-name {
            font-weight: 700;
            font-size: 1em;
            color: #fff;
        }
        .player-overlay-info .overlay-status {
            font-size: 0.75em;
            color: rgba(255,255,255,0.4);
        }
        .player-overlay-info.active { display: block; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .sidebar { width: 280px; min-width: 280px; padding: 20px 16px; }
            .channels-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
        }
        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; min-width: 100%; height: 45vh; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.04); }
            .main-content { height: 55vh; padding: 16px; }
            .channels-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .country-grid { grid-template-columns: 1fr 1fr 1fr; }
            .player-modal-header { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
            .player-modal-header .player-info .channel-icon { width: 32px; height: 32px; }
            .player-modal-header .player-info .channel-details .name { font-size: 0.9em; }
            .player-modal-header .player-controls .control-btn { width: 34px; height: 34px; font-size: 0.9em; }
            .player-overlay-info { bottom: 20px; left: 16px; padding: 8px 14px; }
            .player-overlay-info .overlay-name { font-size: 0.85em; }
        }
        @media (max-width: 480px) {
            .sidebar { padding: 12px 10px; height: 40vh; }
            .main-content { height: 60vh; padding: 12px; }
            .channels-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .channel-card { padding: 12px; }
            .channel-card .logo { width: 36px; height: 36px; }
            .channel-card .info .name { font-size: 0.7em; }
            .country-grid { grid-template-columns: 1fr 1fr; }
            .player-modal-header .player-info .channel-details .name { font-size: 0.8em; }
            .player-modal-header .player-controls .control-btn { width: 30px; height: 30px; font-size: 0.8em; }
        }

        /* ===== TV: Ocultar scroll en sidebar ===== */
        @media (min-width: 769px) {
            .sidebar { scrollbar-width: thin; }
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- ===== SIDEBAR ===== -->
        <div class="sidebar" id="sidebar">
            <div class="logo">
                <i class="fas fa-play-circle"></i>
                Spay<span>Cine</span>
            </div>

            <input type="text" id="searchInput" placeholder="🔍 Buscar canal...">

            <div class="filters" id="filterContainer">
                <button class="filter-btn active" data-filter="all">🌐 Todos</button>
                <button class="filter-btn" data-filter="noticias">📰 Noticias</button>
                <button class="filter-btn" data-filter="deportes">⚽ Deportes</button>
                <button class="filter-btn" data-filter="entretenimiento">🎬 Entretenimiento</button>
                <button class="filter-btn" data-filter="musica">🎵 Música</button>
                <button class="filter-btn" data-filter="cultural">🎭 Cultural</button>
            </div>

            <div id="countriesContainer"></div>

            <div style="margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,0.04);">
                <div style="display:flex;gap:6px;">
                    <input type="text" id="customUrl" placeholder="🔗 URL o ID" style="flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:30px;padding:8px 14px;font-size:0.75em;color:#fff;">
                    <button id="playCustom" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);color:#fff;padding:6px 14px;border-radius:30px;font-size:0.7em;cursor:pointer;">▶</button>
                </div>
                <div class="stats" id="stats">📊 Cargando...</div>
            </div>
        </div>

        <!-- ===== CONTENIDO PRINCIPAL ===== -->
        <div class="main-content" id="mainContent">
            <div class="main-header">
                <h1 id="sectionTitle">🌐 Todos los canales</h1>
                <span class="live-badge">● EN VIVO</span>
            </div>
            <div id="channelsGrid" class="channels-grid">
                <div style="text-align:center;padding:40px;color:rgba(255,255,255,0.2);">
                    <div style="width:32px;height:32px;border:2px solid rgba(255,255,255,0.06);border-top-color:#e50914;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;"></div>
                    Cargando canales...
                </div>
            </div>
        </div>
    </div>

    <!-- ===== MODAL DEL REPRODUCTOR PERSONALIZADO ===== -->
    <div id="playerModal" class="player-modal-overlay">
        <div class="player-modal">
            <!-- Header con logo del canal, título y controles -->
            <div class="player-modal-header">
                <div class="player-info">
                    <div class="channel-icon" id="modalChannelIcon">
                        <i class="fas fa-tv"></i>
                    </div>
                    <div class="channel-details">
                        <div class="name" id="modalChannelName">Canal</div>
                        <div class="status">
                            <span class="live-dot"></span>
                            <span id="modalLiveStatus">EN VIVO</span>
                        </div>
                    </div>
                </div>
                <div class="player-controls">
                    <button class="control-btn fullscreen-btn" id="modalFullscreenBtn" title="Pantalla completa">
                        <i class="fas fa-expand"></i>
                    </button>
                    <button class="control-btn close-btn" id="modalCloseBtn" title="Cerrar">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- Cuerpo del reproductor -->
            <div class="player-modal-body" id="modalBody">
                <video id="modalVideo" controls preload="auto"></video>
                <iframe id="modalIframe" allow="autoplay; fullscreen"></iframe>
                
                <!-- Overlay con información del canal -->
                <div class="player-overlay-info" id="playerOverlayInfo">
                    <div class="overlay-name" id="overlayChannelName">Canal</div>
                    <div class="overlay-status">● EN VIVO</div>
                </div>

                <div class="modal-loading" id="modalLoading">
                    <div class="spinner"></div>
                    <span>Cargando stream...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        // ==================== CONFIGURACIÓN ====================
        const PROXY_URL = 'https://iptv-spay.onrender.com/proxy?url=';
        let currentHls = null;
        let canalesData = [];
        let categoriaActual = 'all';
        let paisActual = null;
        let timeoutBusqueda = null;
        let focusables = [];
        let isFullscreen = false;
        let currentChannelLogo = '';

        // ==================== CANALES DAILYMOTION ====================
        const misCanalesDailymotion = [
            { nombre: "RED UNO LPZ HD", pais: "Bolivia", logo: "https://i.postimg.cc/HWQ1JNbV/RED-UNO-LPZ-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/xa0fwio", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "RED UNO CBBA HD", pais: "Bolivia", logo: "https://i.postimg.cc/NM6C0WZy/RED-UNO-CBBA-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/xa0qka8", tipo: "dailymotion", categoria: "noticias" },

        // ==================== CARGAR LISTA M3U ====================
        async function cargarListaM3U(url, paisOrigen) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const m3uContent = await response.text();
                return parsearM3U(m3uContent, paisOrigen);
            } catch (error) {
                return [];
            }
        }

        function parsearM3U(content, paisOrigen) {
            const lines = content.split('\n');
            const canales = [];
            let currentChannel = null;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    const lastComma = line.lastIndexOf(',');
                    const nombre = lastComma !== -1 ? line.substring(lastComma + 1).trim() : 'Canal sin nombre';
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const logo = logoMatch ? logoMatch[1] : '';
                    const idMatch = line.match(/tvg-id="([^"]*)"/);
                    const id = idMatch ? idMatch[1] : '';
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    const grupo = groupMatch ? groupMatch[1] : '';
                    let categoria = detectarCategoria(nombre, grupo);
                    currentChannel = {
                        id: id,
                        nombre: nombre,
                        pais: paisOrigen,
                        logo: logo,
                        url: '',
                        tipo: 'm3u8',
                        categoria: categoria,
                        grupo: grupo
                    };
                } else if (line && !line.startsWith('#') && currentChannel) {
                    currentChannel.url = line;
                    if (currentChannel.url.startsWith('http')) {
                        canales.push(currentChannel);
                    }
                    currentChannel = null;
                }
            }
            return canales;
        }

        function detectarCategoria(nombre, grupo) {
            const texto = (nombre + ' ' + grupo).toLowerCase();
            const claves = {
                'noticias': ['noticia', 'news', 'informe', 'actualidad', 'cnn', 'bbc', 'telefe noticias', 'el trece', 'tvn', 'canal 13', 'red uno', 'unitel', 'atb', 'telesur'],
                'deportes': ['deporte', 'sport', 'fútbol', 'futbol', 'gol', 'espn', 'tyc', 'fox sports', 'goal', 'racing', 'boca', 'river', 'liga', 'champions', 'uefa', 'libertadores', 'sudamericana', 'nfl', 'nba', 'mlb', 'tennis', 'tenis', 'motogp', 'formula', 'f1'],
                'entretenimiento': ['entretenimiento', 'series', 'películas', 'pelicula', 'cine', 'telefe', 'el trece', 'entreten', 'show', 'telenovela'],
                'musica': ['música', 'musica', 'music', 'mtv', 'viva', 'radio'],
                'cultural': ['cultural', 'educativo', 'educación', 'documental', 'history', 'discovery']
            };
            for (const [categoria, palabras] of Object.entries(claves)) {
                for (const palabra of palabras) {
                    if (texto.includes(palabra)) return categoria;
                }
            }
            return 'entretenimiento';
        }

        // ==================== NAVEGACIÓN CON CONTROL REMOTO ====================
        function actualizarFocusables() {
            const selectores = [
                '.filter-btn:not(.hidden)',
                '.country-item:not(.hidden)',
                '#searchInput',
                '#customUrl',
                '#playCustom',
                '.channel-card:not(.hidden)',
                '.play-btn'
            ];
            const elementos = document.querySelectorAll(selectores.join(', '));
            focusables = Array.from(elementos).filter(el => el.offsetParent !== null);
            
            const hasFocus = focusables.some(el => el.classList.contains('focus-active'));
            if (!hasFocus && focusables.length > 0) {
                focusables[0].classList.add('focus-active');
                focusables[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
        }

        function navegar(direccion) {
            const visibles = focusables.filter(el => 
                el.offsetParent !== null && 
                !el.classList.contains('hidden') &&
                (el.id !== 'playerModal') &&
                (el.closest('#playerModal') === null)
            );
            
            if (visibles.length === 0) return;
            
            const currentIndex = visibles.findIndex(el => el.classList.contains('focus-active'));
            let newIndex = currentIndex;
            
            const cols = 2;
            let step = 1;
            
            switch(direccion) {
                case 'abajo': step = cols; break;
                case 'arriba': step = -cols; break;
                case 'derecha': step = 1; break;
                case 'izquierda': step = -1; break;
                default: return;
            }
            
            newIndex = Math.max(0, Math.min(currentIndex + step, visibles.length - 1));
            
            if (direccion === 'abajo' && newIndex === currentIndex) newIndex = 0;
            if (direccion === 'arriba' && newIndex === currentIndex) newIndex = visibles.length - 1;
            
            visibles.forEach(el => el.classList.remove('focus-active'));
            if (visibles[newIndex]) {
                visibles[newIndex].classList.add('focus-active');
                visibles[newIndex].scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
        }

        document.addEventListener('keydown', function(e) {
            const key = e.key;
            const modalActive = document.getElementById('playerModal').classList.contains('active');
            
            if (modalActive) {
                switch(key) {
                    case 'Escape':
                    case 'Backspace':
                        e.preventDefault();
                        cerrarModal();
                        return;
                    case 'ArrowUp':
                    case 'ArrowDown':
                    case 'ArrowLeft':
                    case 'ArrowRight':
                        e.preventDefault();
                        const modalFocusables = document.querySelectorAll('#modalCloseBtn, #modalFullscreenBtn, #modalVideo, .modal-loading');
                        const mVisibles = Array.from(modalFocusables).filter(el => el.offsetParent !== null);
                        if (mVisibles.length === 0) return;
                        const mCurrent = mVisibles.findIndex(el => el.classList.contains('focus-active'));
                        let mNew = mCurrent;
                        if (key === 'ArrowRight' || key === 'ArrowDown') mNew = Math.min(mCurrent + 1, mVisibles.length - 1);
                        if (key === 'ArrowLeft' || key === 'ArrowUp') mNew = Math.max(mCurrent - 1, 0);
                        mVisibles.forEach(el => el.classList.remove('focus-active'));
                        if (mVisibles[mNew]) mVisibles[mNew].classList.add('focus-active');
                        return;
                    case 'Enter':
                        const activeModal = document.querySelector('#playerModal .focus-active');
                        if (activeModal) activeModal.click();
                        return;
                }
                return;
            }
            
            switch(key) {
                case 'ArrowUp':
                case 'ArrowDown':
                case 'ArrowLeft':
                case 'ArrowRight':
                    e.preventDefault();
                    navegar(key.replace('Arrow', '').toLowerCase());
                    break;
                case 'Enter':
                    e.preventDefault();
                    const active = document.querySelector('.focus-active');
                    if (active) active.click();
                    break;
                case 'Escape':
                case 'Backspace':
                    e.preventDefault();
                    if (paisActual) {
                        paisActual = null;
                        document.querySelectorAll('.country-item').forEach(i => i.classList.remove('active'));
                        aplicarFiltrosGlobales();
                        document.getElementById('sectionTitle').textContent = '🌐 Todos los canales';
                        actualizarFocusables();
                    }
                    break;
            }
        });

        // ==================== MODAL CON CONTROLES ====================
        function abrirModal(url, channelName, tipo = 'm3u8', logo = '') {
            const modal = document.getElementById('playerModal');
            const video = document.getElementById('modalVideo');
            const iframe = document.getElementById('modalIframe');
            const loading = document.getElementById('modalLoading');
            const overlay = document.getElementById('playerOverlayInfo');
            
            if (currentHls) { currentHls.destroy(); currentHls = null; }
            if (video.src) { video.pause(); video.removeAttribute('src'); video.load(); }
            if (iframe.src) { iframe.src = ''; iframe.style.display = 'none'; }
            
            video.style.display = 'none';
            iframe.style.display = 'none';
            loading.classList.add('active');
            overlay.classList.remove('active');
            
            // Actualizar info del canal
            document.getElementById('modalChannelName').textContent = channelName;
            document.getElementById('overlayChannelName').textContent = channelName;
            document.getElementById('modalLiveStatus').textContent = 'CONECTANDO';
            currentChannelLogo = logo;

            if (logo) {
                iconContainer.innerHTML = `<img src="${logo}" alt="${channelName}" onerror="this.outerHTML='<i class=\\'fas fa-tv\\'></i>'">`;
            } else {
                iconContainer.innerHTML = `<i class="fas fa-tv"></i>`;
            }
            
            modal.classList.add('active');
            
            setTimeout(() => {

                document.querySelectorAll('.focus-active').forEach(el => el.classList.remove('focus-active'));
                closeBtn.classList.add('focus-active');
            }, 100);
            
            cargarStreamEnModal(url, channelName, tipo);

        function cerrarModal() {
            const modal = document.getElementById('playerModal');
            const video = document.getElementById('modalVideo');
            const iframe = document.getElementById('modalIframe');
            const overlay = document.getElementById('playerOverlayInfo');
            
            if (currentHls) { currentHls.destroy(); currentHls = null; }
            if (video.src) { video.pause(); video.removeAttribute('src'); video.load(); }
            if (iframe.src) { iframe.src = ''; iframe.style.display = 'none'; }
            
            // Salir de pantalla completa si está activa
            if (isFullscreen) {
                toggleFullscreen();
            }
            
            modal.classList.remove('active');
            overlay.classList.remove('active');
            setTimeout(actualizarFocusables, 100);
        }

        // ===== FUNCIÓN TOGGLE FULLSCREEN CORREGIDA =====
        function toggleFullscreen() {
            const modalBody = document.getElementById('modalBody');
            const btn = document.getElementById('modalFullscreenBtn');
            const icon = btn.querySelector('i');
            const header = document.querySelector('.player-modal-header');
            
            if (!document.fullscreenElement) {
                // Entrar en pantalla completa
                if (modalBody.requestFullscreen) {
                    modalBody.requestFullscreen().catch(err => {
                        console.error('Error al entrar en pantalla completa:', err);
                    });
                } else if (modalBody.webkitRequestFullscreen) {
                    modalBody.webkitRequestFullscreen();
                } else if (modalBody.msRequestFullscreen) {
                    modalBody.msRequestFullscreen();
                }
                // Cambiar icono
                icon.className = 'fas fa-compress';
                btn.title = 'Salir de pantalla completa';
                // Ocultar header
                if (header) header.style.display = 'none';
                isFullscreen = true;
            } else {
                // Salir de pantalla completa
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(err => {
                        console.error('Error al salir de pantalla completa:', err);
                    });
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                // Cambiar icono
                icon.className = 'fas fa-expand';
                btn.title = 'Pantalla completa';
                // Mostrar header
                if (header) header.style.display = 'flex';
                isFullscreen = false;
            }
        }

        // ===== LISTENER PARA DETECTAR CAMBIOS EN FULLSCREEN =====
        document.addEventListener('fullscreenchange', function() {
            const btn = document.getElementById('modalFullscreenBtn');
            const icon = btn?.querySelector('i');
            const header = document.querySelector('.player-modal-header');
            
            if (!document.fullscreenElement) {
                // Se salió de pantalla completa
                if (icon) {
                    icon.className = 'fas fa-expand';
                }
                if (header) {
                    header.style.display = 'flex';
                }
                isFullscreen = false;
            } else {
                // Entró en pantalla completa
                if (icon) {
                    icon.className = 'fas fa-compress';
                }
                if (header) {
                    header.style.display = 'none';
                }
                isFullscreen = true;
            }
        });

        // ===== FUNCIÓN CARGAR STREAM EN MODAL =====
        function cargarStreamEnModal(url, channelName, tipo = 'm3u8') {
            const video = document.getElementById('modalVideo');
            const iframe = document.getElementById('modalIframe');
            const loading = document.getElementById('modalLoading');
            const liveStatus = document.getElementById('modalLiveStatus');
            const overlay = document.getElementById('playerOverlayInfo');
            const overlayName = document.getElementById('overlayChannelName');
            
            const dmMatch = url.match(/\/video\/([a-z0-9]+)/i);
            if (dmMatch || tipo === 'dailymotion') {
                const videoId = dmMatch ? dmMatch[1] : null;
                if (videoId) {
                    video.style.display = 'none';
                    iframe.style.display = 'block';
                    iframe.src = `https://geo.dailymotion.com/player.html?video=${videoId}&autoplay=1`;
                    loading.classList.remove('active');
                    liveStatus.textContent = 'EN VIVO';
                    overlayName.textContent = channelName;
                    overlay.classList.add('active');
                    document.querySelector('.player-modal-header .focus-active')?.classList.remove('focus-active');
                    document.getElementById('modalCloseBtn').classList.add('focus-active');
                    return;
                }
            }
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('v=')) videoId = url.split('v=')[1].split('&')[0];
                else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].split('?')[0];
                if (videoId) {
                    video.style.display = 'none';
                    iframe.style.display = 'block';
                    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    loading.classList.remove('active');
                    liveStatus.textContent = 'REPRODUCIENDO';
                    overlayName.textContent = channelName;
                    overlay.classList.add('active');
                    document.querySelector('.player-modal-header .focus-active')?.classList.remove('focus-active');
                    document.getElementById('modalCloseBtn').classList.add('focus-active');
                    return;
                }
            }
            if (url.includes('.m3u8')) {
                video.style.display = 'block';
                iframe.style.display = 'none';
                if (Hls.isSupported()) {
                    currentHls = new Hls({ debug: false, enableWorker: true });
                    currentHls.loadSource(url);
                    currentHls.attachMedia(video);
                    currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                        loading.classList.remove('active');
                        liveStatus.textContent = 'EN VIVO';
                        overlayName.textContent = channelName;
                        overlay.classList.add('active');
                        video.play().catch(e => console.error(e));
                        document.querySelector('.player-modal-header .focus-active')?.classList.remove('focus-active');
                        document.getElementById('modalCloseBtn').classList.add('focus-active');
                    });
                    currentHls.on(Hls.Events.ERROR, () => {
                        loading.classList.remove('active');
                        liveStatus.textContent = 'ERROR';
                        overlay.classList.remove('active');
                    });
                } else {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => {
                        loading.classList.remove('active');
                        liveStatus.textContent = 'EN VIVO';
                        overlayName.textContent = channelName;
                        overlay.classList.add('active');
                        video.play();
                        document.querySelector('.player-modal-header .focus-active')?.classList.remove('focus-active');
                        document.getElementById('modalCloseBtn').classList.add('focus-active');
                    }, { once: true });
                }
            } else if (url.startsWith('http')) {
                loading.classList.remove('active');
                liveStatus.textContent = 'WEB';
                overlay.classList.remove('active');
                video.style.display = 'none';
                iframe.style.display = 'none';
                window.open(url, '_blank');
            } else {
                loading.classList.remove('active');
                liveStatus.textContent = 'ERROR';
                overlay.classList.remove('active');
                video.style.display = 'none';
                iframe.style.display = 'none';
            }
        }

        // ==================== URL PERSONALIZADA ====================
        function setupCustomUrl() {
            document.getElementById('playCustom').onclick = () => {
                const input = document.getElementById('customUrl').value.trim();
                if (!input) return;
                if (input.match(/^x[a-z0-9]+$/i)) {
                    abrirModal(`https://www.dailymotion.com/video/${input}`, "URL Personalizada", "dailymotion");
                } else {
                    abrirModal(input, "URL Personalizada", "m3u8");
                }
            };
            document.getElementById('customUrl').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    document.getElementById('playCustom').click();
                }
            });
        }

        // ==================== EVENTOS DEL MODAL ====================
        function setupModalEvents() {
            document.getElementById('modalCloseBtn').onclick = cerrarModal;
            document.getElementById('modalFullscreenBtn').onclick = toggleFullscreen;
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && document.getElementById('playerModal').classList.contains('active')) {
                    cerrarModal();
                }
            });
            document.getElementById('playerModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) cerrarModal();
            });
        }

        // ==================== INICIALIZAR ====================
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🎬 Iniciando SpayCine TV...');
            canalesData = await cargarTodosLosCanales();
            renderCountries(canalesData);
            renderChannels(canalesData);
            setupFilters();
            setupSearch();
            setupCustomUrl();
            setupModalEvents();
            document.getElementById('stats').textContent = `📊 ${canalesData.length} canales cargados`;
            console.log(`✅ ${canalesData.length} canales cargados`);
            
            setTimeout(actualizarFocusables, 300);
        });
    </script>
</body>
</html>
