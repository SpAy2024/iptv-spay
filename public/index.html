        @media (max-width: 768px) {
            .sidebar { height: 40vh; padding: 12px; }

            .channel-logo { width: 32px; height: 32px; font-size: 12px; }

        .error-message { background: rgba(220,53,69,0.9); color: white; padding: 15px; border-radius: 10px; text-align: center; }

</head>

        // ==================== CARGAR LISTA M3U DESDE URL ====================
        async function cargarListaM3U(url, paisOrigen) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const m3uContent = await response.text();
                return parsearM3U(m3uContent, paisOrigen);
            } catch (error) {
                console.error(`Error cargando ${url}:`, error);
                return [];
            }
        }

        // ==================== PARSEAR M3U ====================
        function parsearM3U(content, paisOrigen) {
            const lines = content.split('\n');
            const canales = [];
            let currentChannel = null;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    const lastComma = line.lastIndexOf(',');
                    const nombre = lastComma !== -1 ? line.substring(lastComma + 1).trim() : 'Canal sin nombre';
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const logo = logoMatch ? logoMatch[1] : '';
                    const idMatch = line.match(/tvg-id="([^"]*)"/);
                    const id = idMatch ? idMatch[1] : '';
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    const grupo = groupMatch ? groupMatch[1] : '';
                    
                    // Detectar categoría por grupo o por palabras clave
                    let categoria = detectarCategoria(nombre, grupo);
                    
                    currentChannel = {
                        id: id,
                        nombre: nombre,
                        pais: paisOrigen,
                        logo: logo,
                        url: '',
                        tipo: 'm3u8',
                        categoria: categoria,
                        grupo: grupo
                    };
                } else if (line && !line.startsWith('#') && currentChannel) {
                    currentChannel.url = line;
                    if (currentChannel.url.startsWith('http')) {
                        canales.push(currentChannel);
                    }
                    currentChannel = null;
                }
            }
            return canales;
        }

        // ==================== DETECTAR CATEGORÍA ====================
      function detectarCategoria(nombre, grupo) {
    const texto = (nombre + ' ' + grupo).toLowerCase();
    
    const palabrasClave = {
        'noticias': ['noticia', 'news', 'informe', 'actualidad', 'cnn', 'bbc', 'telefe noticias', 'el trece', 'tvn', 'canal 13', 'red uno', 'unitel', 'atb', 'telesur'],
        'deportes': [
            'deporte', 'sport', 'fútbol', 'futbol', 'gol', 'espn', 'tyc', 'fox sports', 'goal', 
            'racing', 'boca', 'river', 'liga', 'champions', 'uefa', 'libertadores', 'sudamericana',
            'nfl', 'nba', 'mlb', 'tennis', 'tenis', 'motogp', 'formula', 'f1', 'automovilismo',
            'boxeo', 'ufc', 'wwe', 'lucha', 'baseball', 'beisbol', 'basketball', 'baloncesto',
            'voleibol', 'waterpolo', 'hockey', 'rugby', 'ciclismo', 'natación', 'atletismo',
            'deportes', 'sports', 'dazn', 'goat', 'win'
        ],
        'entretenimiento': ['entretenimiento', 'series', 'películas', 'pelicula', 'cine', 'telefe', 'el trece', 'entreten', 'show', 'telenovela'],
        'musica': ['música', 'musica', 'music', 'mtv', 'viva', 'radio', 'sound'],
        'cultural': ['cultural', 'educativo', 'educación', 'documental', 'history', 'discovery', 'cultura']
    };
    
    for (const [categoria, palabras] of Object.entries(palabrasClave)) {
        for (const palabra of palabras) {
            if (texto.includes(palabra)) {
                return categoria;
            }
        }
    }
    return 'entretenimiento';
}

        // ==================== RENDERIZAR CANALES ====================
        function renderChannels(canales) {
            canalesFiltrados = canales;
            
            // Agrupar por país
            const porPais = {};
            canales.forEach(canal => {
                if (!porPais[canal.pais]) porPais[canal.pais] = [];
                porPais[canal.pais].push(canal);
            });
            
            const paisesOrdenados = Object.keys(porPais).sort();
            let html = '';
            
            for (const pais of paisesOrdenados) {
                html += `<div class="country-group" data-pais="${pais}"><div class="country-title">${pais}</div>`;
                porPais[pais].forEach(canal => {
                    const logoHtml = canal.logo ? 
                        `<img src="${canal.logo}" alt="${canal.nombre}" onerror="this.parentElement.innerHTML='${canal.nombre.charAt(0)}'">` : 
                        `<span>${canal.nombre.charAt(0)}</span>`;
                    
                    const categoriaAttr = canal.categoria || 'entretenimiento';
                    
                    html += `
                        <div class="channel-item" data-nombre="${canal.nombre.toLowerCase()}" data-url="${canal.url}" data-nombre-original="${canal.nombre}" data-tipo="${canal.tipo}" data-categoria="${categoriaAttr}">
                            <div class="channel-logo">${logoHtml}</div>
                            <span class="channel-name">${canal.nombre.substring(0, 45)}</span>
                            <button class="btn-play" onclick="event.stopPropagation(); loadChannel('${canal.url.replace(/'/g, "\\'")}', '${canal.nombre.replace(/'/g, "\\'")}', '${canal.tipo}')">▶</button>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            
            document.getElementById('channelsList').innerHTML = html;
            document.getElementById('stats').innerHTML = `📊 ${canales.length} canales | ${paisesOrdenados.length} países`;
            
            document.querySelectorAll('.channel-item').forEach(item => {
                item.addEventListener('click', () => {
                    loadChannel(item.dataset.url, item.dataset.nombreOriginal, item.dataset.tipo);
                });
            });
            
            // Aplicar filtros
            aplicarFiltros();
        }

        // ==================== FILTROS POR CATEGORÍA ====================
        function setupFilters() {
            const filters = document.querySelectorAll('.filter-btn');
            filters.forEach(btn => {
                btn.addEventListener('click', function() {
                    filters.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    categoriaActual = this.dataset.filter;
                    aplicarFiltros();
                });
            });
        }

        function aplicarFiltros() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            document.querySelectorAll('.channel-item').forEach(item => {
                const nombre = item.dataset.nombre;
                const categoria = item.dataset.categoria;
                
                const matchSearch = nombre.includes(searchTerm);
                const matchCategoria = categoriaActual === 'all' || categoria === categoriaActual;
                
                if (matchSearch && matchCategoria) {
                    item.classList.remove('hidden');
                } else {
                    item.classList.add('hidden');
                }
            });
            
            // Ocultar grupos vacíos
            document.querySelectorAll('.country-group').forEach(group => {
                const visibleItems = group.querySelectorAll('.channel-item:not(.hidden)');
                group.style.display = visibleItems.length > 0 ? '' : 'none';
            });
            
            // Actualizar contador
            const totalVisibles = document.querySelectorAll('.channel-item:not(.hidden)').length;
            document.getElementById('stats').innerHTML = `📊 ${totalVisibles} canales visibles`;
        }

        // ==================== BÚSQUEDA CON DEBOUNCE ====================
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', function() {
                clearTimeout(timeoutBusqueda);
                timeoutBusqueda = setTimeout(() => {
                    aplicarFiltros();
                }, 150); // 150ms de retraso para mejorar rendimiento
            });
        }

        function extractDailymotionId(url) {
            const match = url.match(/\/video\/([a-z0-9]+)/i);
            return match ? match[1] : null;
        }

        // ==================== REPRODUCIR STREAM ====================
      // ==================== REPRODUCIR STREAM ====================
function reproducirStream(streamUrl, channelName, loadingMsg) {
    const video = document.getElementById('videoPlayer');
    const iframe = document.getElementById('dmIframe');
    
    iframe.style.display = 'none';
    video.style.display = 'block';
    
    // Destruir HLS anterior por si acaso
    if (currentHls) {
        currentHls.destroy();
        currentHls = null;
    }
    
    if (video.src) {
        video.pause();
        video.removeAttribute('src');
        video.load();
    }
    
    if (Hls.isSupported() && streamUrl.includes('.m3u8')) {
        currentHls = new Hls({ debug: false, enableWorker: true });
        currentHls.loadSource(streamUrl);
        currentHls.attachMedia(video);
        currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
            loadingMsg.style.display = 'none';
            document.getElementById('currentChannel').innerHTML = `📺 ${channelName}<br><small>🔴 EN VIVO</small>`;
            video.play().catch(e => console.error('Error reproduciendo:', e));
        });
        currentHls.on(Hls.Events.ERROR, (event, data) => {
            console.error('Error HLS:', data);
            loadingMsg.style.display = 'none';
            if (data.fatal) {
                document.getElementById('currentChannel').innerHTML = `📺 ${channelName}<br><small>❌ Error de stream</small>`;
            }
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.addEventListener('loadedmetadata', () => {
            loadingMsg.style.display = 'none';
            document.getElementById('currentChannel').innerHTML = `📺 ${channelName}<br><small>🔴 EN VIVO</small>`;
            video.play();
        }, { once: true });
    } else {
        loadingMsg.style.display = 'none';
        document.getElementById('currentChannel').innerHTML = `📺 ${channelName}<br><small>❌ No se puede reproducir</small>`;
    }
}

        // ==================== CARGAR CANAL ====================
       // ==================== CARGAR CANAL ====================
async function loadChannel(url, channelName, tipo = 'm3u8') {
    const loadingMsg = document.getElementById('loadingMessage');
    const video = document.getElementById('videoPlayer');
    const iframe = document.getElementById('dmIframe');
    
    // ====== LIMPIAR COMPLETAMENTE EL ESTADO ANTERIOR ======
    // 1. Destruir HLS anterior
    if (currentHls) {
        console.log('🛑 Destruyendo HLS anterior...');
        currentHls.destroy();
        currentHls = null;
    }
    
    // 2. Detener y limpiar el video
    if (video.src) {
        video.pause();
        video.removeAttribute('src');
        video.load(); // Reinicia el elemento video
    }
    
    // 3. Limpiar el iframe de Dailymotion
    if (iframe) {
        iframe.src = '';
        iframe.style.display = 'none';
    }
    
    // 4. Ocultar el video y mostrar el mensaje de carga
    video.style.display = 'block';
    loadingMsg.style.display = 'block';
    document.getElementById('currentChannel').innerHTML = `📺 ${channelName}<br><small>Cargando...</small>`;
    
    // Resaltar canal activo
    document.querySelectorAll('.channel-item').forEach(item => {
        item.classList.remove('active');
        if (item.dataset.nombreOriginal === channelName) item.classList.add('active');
    });
    
    // ====== REPRODUCIR NUEVO CANAL ======
    const dailymotionId = extractDailymotionId(url);
    
    // Caso Dailymotion
    if (dailymotionId || tipo === 'dailymotion') {
        const videoId = dailymotionId || (url.includes('/video/') ? url.split('/video/')[1].split('?')[0] : null);
        if (videoId) {
            iframe.style.display = 'block';
            video.style.display = 'none';
            iframe.src = `https://geo.dailymotion.com/player.html?video=${videoId}&autoplay=1`;
            loadingMsg.style.display = 'none';
            document.getElementById('currentChannel').innerHTML = `📺 ${channelName}<br><small>🔴 REPRODUCIENDO (Dailymotion)</small>`;
            return;
        }
    }
    
    // Caso M3U8
    if (url.includes('.m3u8')) {
        reproducirStream(url, channelName, loadingMsg);
    } else {
        loadingMsg.style.display = 'none';
        document.getElementById('currentChannel').innerHTML = `📺 ${channelName}<br><small>⚠️ Formato no soportado</small>`;
    }
}



        // ==================== URL PERSONALIZADA ====================
        function setupCustomUrl() {
            const customUrl = document.getElementById('customUrl');
            const playCustom = document.getElementById('playCustom');
            
            playCustom.onclick = () => {
                const input = customUrl.value.trim();
                if (!input) return;
                if (input.match(/^x[a-z0-9]+$/i)) {
                    loadChannel(`https://www.dailymotion.com/video/${input}`, "URL Personalizada", "dailymotion");
                } else {
                    loadChannel(input, "URL Personalizada", "m3u8");
                }
            };
            
            customUrl.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const input = customUrl.value.trim();
                    if (!input) return;
                    if (input.match(/^x[a-z0-9]+$/i)) {
                        loadChannel(`https://www.dailymotion.com/video/${input}`, "URL Personalizada", "dailymotion");
                    } else {
                        loadChannel(input, "URL Personalizada", "m3u8");
                    }
                }
            });
        }

        // ==================== INICIALIZAR ====================
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Iniciando carga de canales...');
            const canales = await cargarTodosLosCanales();
            canalesData = canales;
            renderChannels(canalesData);
            setupFilters();
            setupSearch();
            setupCustomUrl();
        });
    </script>
