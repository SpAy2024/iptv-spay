<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SpayCine TV - Canales en vivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET Y BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0e27;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        
        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

        /* ===== LAYOUT PRINCIPAL ===== */
        .app-container {
            display: flex;
            height: 100vh;
            background: #0f1328;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 320px;
            min-width: 320px;
            height: 100vh;
            background: #0f1328;
            overflow-y: auto;
            padding: 28px 20px;
            border-right: 1px solid rgba(255,255,255,0.04);
            display: flex;
            flex-direction: column;
        }

        /* ===== LOGO ===== */
        .logo {
            font-size: 1.6em;
            font-weight: 900;
            letter-spacing: -0.8px;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo span { color: #e50914; }
        .logo i { font-size: 1.2em; color: #e50914; }

        /* ===== BÚSQUEDA ===== */
        #searchInput {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 30px;
            padding: 12px 20px;
            font-size: 0.85em;
            width: 100%;
            color: #fff;
            transition: all 0.3s ease;
            margin-bottom: 18px;
        }
        #searchInput::placeholder { color: rgba(255,255,255,0.25); font-weight: 300; }
        #searchInput:focus { 
            outline: none; 
            border-color: #e50914;
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 0 4px rgba(229, 9, 20, 0.08);
        }

        /* ===== FILTROS ===== */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 18px;
        }
        .filter-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.4);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7em;
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: 500;
        }
        .filter-btn:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .filter-btn.active { 
            background: #e50914; 
            color: #fff; 
            border-color: #e50914;
        }

        /* ===== PAÍSES ===== */
        .country-section {
            margin-bottom: 20px;
        }
        .country-section .country-title {
            font-size: 0.85em;
            font-weight: 700;
            color: rgba(255,255,255,0.5);
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .country-section .country-title .emoji { font-size: 1em; }

        .country-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }

        .country-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.8em;
            color: rgba(255,255,255,0.6);
            border: 1px solid transparent;
        }
        .country-item:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }
        .country-item.active {
            background: rgba(229, 9, 20, 0.08);
            color: #fff;
            border-color: rgba(229, 9, 20, 0.1);
        }
        .country-item .flag { font-size: 1em; }
        .country-item .channels-count {
            font-size: 0.6em;
            color: rgba(255,255,255,0.2);
            margin-left: auto;
        }

        /* ===== CONTENIDO PRINCIPAL ===== */
        .main-content {
            flex: 1;
            padding: 28px 32px;
            overflow-y: auto;
            height: 100vh;
        }

        /* ===== ENCABEZADO ===== */
        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .main-header h1 {
            font-size: 1.4em;
            font-weight: 700;
            color: #fff;
        }
        .main-header .live-badge {
            background: rgba(229, 9, 20, 0.12);
            color: #e50914;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7em;
            font-weight: 600;
        }

        /* ===== GRID DE CANALES ===== */
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }

        .channel-card {
            background: rgba(255,255,255,0.02);
            border-radius: 14px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.03);
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .channel-card:hover {
            background: rgba(255,255,255,0.05);
            transform: translateY(-4px);
            border-color: rgba(255,255,255,0.08);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        .channel-card .logo {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .channel-card .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .channel-card .logo .fallback {
            font-size: 16px;
            font-weight: 700;
            color: rgba(255,255,255,0.2);
        }
        .channel-card .info {
            flex: 1;
            min-width: 0;
        }
        .channel-card .info .name {
            font-size: 0.85em;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-card .info .category {
            font-size: 0.65em;
            color: rgba(255,255,255,0.25);
            margin-top: 2px;
        }
        .channel-card .play-btn {
            background: rgba(255,255,255,0.04);
            border: none;
            color: rgba(255,255,255,0.3);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .channel-card .play-btn:hover {
            background: #e50914;
            color: #fff;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.2);
        }
        .channel-card.hidden { display: none; }

        /* ===== ESTADÍSTICAS ===== */
        .stats {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            font-size: 0.7em;
            color: rgba(255,255,255,0.15);
        }

        /* ================================================================
           MODAL DEL REPRODUCTOR
        ================================================================ */
        .player-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(20px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .player-modal-overlay.active { display: flex; }

        .player-modal {
            width: 92%;
            max-width: 1100px;
            background: linear-gradient(145deg, #1a1a2e, #0f1328);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.04);
            animation: slideUp 0.4s ease;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .player-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
        }
        .player-modal-header .title {
            font-weight: 700;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
        }
        .player-modal-header .title .live {
            color: #e50914;
            font-size: 0.65em;
            background: rgba(229,9,20,0.15);
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        .player-modal-header .close-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .player-modal-header .close-btn:hover {
            background: #e50914;
            transform: rotate(90deg);
        }

        .player-modal-body {
            flex: 1;
            background: #000;
            position: relative;
            min-height: 55vh;
            max-height: 70vh;
        }
        .player-modal-body video {
            width: 100%;
            height: 100%;
            max-height: 70vh;
            background: #000;
        }
        .player-modal-body iframe {
            width: 100%;
            height: 100%;
            max-height: 70vh;
            border: none;
            display: none;
        }

        .modal-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            text-align: center;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 30px 40px;
            border-radius: 16px;
            backdrop-filter: blur(4px);
        }
        .modal-loading .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255,255,255,0.06);
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        .modal-loading.active { display: block; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .sidebar { width: 280px; min-width: 280px; padding: 20px 16px; }
            .channels-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
        }
        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .sidebar { width: 100%; min-width: 100%; height: 45vh; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.04); }
            .main-content { height: 55vh; padding: 16px; }
            .channels-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .country-grid { grid-template-columns: 1fr 1fr 1fr; }
            .player-modal { width: 98%; max-height: 95vh; border-radius: 14px; }
            .player-modal-body { min-height: 35vh; max-height: 55vh; }
        }
        @media (max-width: 480px) {
            .sidebar { padding: 12px 10px; height: 40vh; }
            .main-content { height: 60vh; padding: 12px; }
            .channels-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .channel-card { padding: 12px; }
            .channel-card .logo { width: 36px; height: 36px; }
            .channel-card .info .name { font-size: 0.7em; }
            .country-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        // ==================== CONFIGURACIÓN ====================
        const PROXY_URL = 'https://iptv-spay.onrender.com/proxy?url=';
        let currentHls = null;
        let canalesData = [];
        let categoriaActual = 'all';
        let paisActual = null;
        let timeoutBusqueda = null;

        // ==================== CANALES DAILYMOTION ====================
        const misCanalesDailymotion = [

            { nombre: "RED UNO CBBA HD", pais: "Bolivia", logo: "https://i.postimg.cc/NM6C0WZy/RED-UNO-CBBA-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/xa0qka8", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "RED UNO SCZ HD", pais: "Bolivia", logo: "https://i.postimg.cc/6QRYHkWk/RED-UNO-SC-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/x9n2qyk", tipo: "dailymotion", categoria: "noticias" },

        ];

        const PAISES = [
            { codigo: 'bo', nombre: 'Bolivia', emoji: '🇧🇴' },
            { codigo: 'ar', nombre: 'Argentina', emoji: '🇦🇷' },
            { codigo: 'br', nombre: 'Brasil', emoji: '🇧🇷' },
            { codigo: 'cl', nombre: 'Chile', emoji: '🇨🇱' },
            { codigo: 'co', nombre: 'Colombia', emoji: '🇨🇴' },
            { codigo: 'ec', nombre: 'Ecuador', emoji: '🇪🇨' },
            { codigo: 'py', nombre: 'Paraguay', emoji: '🇵🇾' },
            { codigo: 'pe', nombre: 'Perú', emoji: '🇵🇪' },
            { codigo: 'uy', nombre: 'Uruguay', emoji: '🇺🇾' },
            { codigo: 've', nombre: 'Venezuela', emoji: '🇻🇪' },
            { codigo: 'cr', nombre: 'Costa Rica', emoji: '🇨🇷' },
            { codigo: 'sv', nombre: 'El Salvador', emoji: '🇸🇻' },
            { codigo: 'gt', nombre: 'Guatemala', emoji: '🇬🇹' },
            { codigo: 'hn', nombre: 'Honduras', emoji: '🇭🇳' },
            { codigo: 'ni', nombre: 'Nicaragua', emoji: '🇳🇮' },
            { codigo: 'pa', nombre: 'Panamá', emoji: '🇵🇦' },
            { codigo: 'do', nombre: 'República Dominicana', emoji: '🇩🇴' },
            { codigo: 'pr', nombre: 'Puerto Rico', emoji: '🇵🇷' },
            { codigo: 'es', nombre: 'España', emoji: '🇪🇸' },
            { codigo: 'mx', nombre: 'México', emoji: '🇲🇽' }
        ];

        // ==================== CARGAR LISTA M3U ====================
        async function cargarListaM3U(url, paisOrigen) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const m3uContent = await response.text();
                return parsearM3U(m3uContent, paisOrigen);
            } catch (error) {
                return [];
            }
        }

        function parsearM3U(content, paisOrigen) {
            const lines = content.split('\n');
            const canales = [];
            let currentChannel = null;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    const lastComma = line.lastIndexOf(',');
                    const nombre = lastComma !== -1 ? line.substring(lastComma + 1).trim() : 'Canal sin nombre';
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const logo = logoMatch ? logoMatch[1] : '';
                    const idMatch = line.match(/tvg-id="([^"]*)"/);
                    const id = idMatch ? idMatch[1] : '';
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    const grupo = groupMatch ? groupMatch[1] : '';
                    let categoria = detectarCategoria(nombre, grupo);
                    currentChannel = {
                        id: id,
                        nombre: nombre,
                        pais: paisOrigen,
                        logo: logo,
                        url: '',
                        tipo: 'm3u8',
                        categoria: categoria,
                        grupo: grupo
                    };
                } else if (line && !line.startsWith('#') && currentChannel) {
                    currentChannel.url = line;
                    if (currentChannel.url.startsWith('http')) {
                        canales.push(currentChannel);
                    }
                    currentChannel = null;
                }
            }
            return canales;
        }

        function detectarCategoria(nombre, grupo) {
            const texto = (nombre + ' ' + grupo).toLowerCase();
            const claves = {
                'noticias': ['noticia', 'news', 'informe', 'actualidad', 'cnn', 'bbc', 'telefe noticias', 'el trece', 'tvn', 'canal 13', 'red uno', 'unitel', 'atb', 'telesur'],
                'deportes': ['deporte', 'sport', 'fútbol', 'futbol', 'gol', 'espn', 'tyc', 'fox sports', 'goal', 'racing', 'boca', 'river', 'liga', 'champions', 'uefa', 'libertadores', 'sudamericana', 'nfl', 'nba', 'mlb', 'tennis', 'tenis', 'motogp', 'formula', 'f1'],
                'entretenimiento': ['entretenimiento', 'series', 'películas', 'pelicula', 'cine', 'telefe', 'el trece', 'entreten', 'show', 'telenovela'],
                'musica': ['música', 'musica', 'music', 'mtv', 'viva', 'radio'],
                'cultural': ['cultural', 'educativo', 'educación', 'documental', 'history', 'discovery']
            };
            for (const [categoria, palabras] of Object.entries(claves)) {
                for (const palabra of palabras) {
                    if (texto.includes(palabra)) return categoria;
                }
            }
            return 'entretenimiento';
        }

        // ==================== CARGAR TODOS LOS CANALES ====================
        async function cargarTodosLosCanales() {
            let todos = [...misCanalesDailymotion];
            for (const pais of PAISES) {
                try {
                    const canales = await cargarListaM3U(`https://iptv-org.github.io/iptv/countries/${pais.codigo}.m3u`, pais.nombre);
                    todos = todos.concat(canales);
                } catch (e) {}
            }
            try {
                const deportes = await cargarListaM3U('https://iptv-org.github.io/iptv/categories/sports.m3u', 'Deportes');
                todos = todos.concat(deportes);
            } catch (e) {}
            return todos;
        }

        // ==================== RENDERIZAR PAÍSES ====================
        function renderCountries(canales) {
            const container = document.getElementById('countriesContainer');
            const counts = {};
            canales.forEach(c => { counts[c.pais] = (counts[c.pais] || 0) + 1; });
            let html = '';
            for (const p of PAISES) {
                const count = counts[p.nombre] || 0;
                html += `
                    <div class="country-section">
                        <div class="country-title"><span class="emoji">${p.emoji}</span> ${p.nombre}</div>
                        <div class="country-grid">
                            <div class="country-item" data-pais="${p.nombre}">
                                <span class="flag">${p.emoji}</span>
                                <span>${p.nombre}</span>
                                <span class="channels-count">${count}</span>
                            </div>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;

            document.querySelectorAll('.country-item').forEach(el => {
                el.addEventListener('click', function() {
                    const pais = this.dataset.pais;
                    paisActual = pais;
                    document.querySelectorAll('.country-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                    filtrarPorPais(pais);
                    document.getElementById('sectionTitle').textContent = `📺 ${pais}`;
                });
            });
        }

        // ==================== RENDERIZAR CANALES ====================
        function renderChannels(canales) {
            const grid = document.getElementById('channelsGrid');
            if (canales.length === 0) {
                grid.innerHTML = '<div style="text-align:center;padding:40px;color:rgba(255,255,255,0.2);">No hay canales disponibles</div>';
                return;
            }
            let html = '';
            canales.forEach(c => {
                const logoHtml = c.logo ? `<img src="${c.logo}" onerror="this.outerHTML='<span class=\\'fallback\\'>${c.nombre.charAt(0)}</span>'">` : `<span class="fallback">${c.nombre.charAt(0)}</span>`;
                html += `
                    <div class="channel-card" data-pais="${c.pais}" data-categoria="${c.categoria}" data-url="${c.url.replace(/'/g, "\\'")}" data-nombre="${c.nombre.replace(/'/g, "\\'")}" data-tipo="${c.tipo}">
                        <div class="logo">${logoHtml}</div>
                        <div class="info">
                            <div class="name">${c.nombre}</div>
                            <div class="category">${c.pais} · ${c.categoria}</div>
                        </div>
                        <button class="play-btn" onclick="event.stopPropagation(); abrirModal('${c.url.replace(/'/g, "\\'")}', '${c.nombre.replace(/'/g, "\\'")}', '${c.tipo}')"><i class="fas fa-play"></i></button>
                    </div>
                `;
            });
            grid.innerHTML = html;

            document.querySelectorAll('.channel-card').forEach(el => {
                el.addEventListener('click', function() {
                    const url = this.dataset.url;
                    const nombre = this.dataset.nombre;
                    const tipo = this.dataset.tipo;
                    abrirModal(url, nombre, tipo);
                });
            });
        }

        // ==================== FILTROS ====================
        function filtrarPorPais(pais) {
            const cards = document.querySelectorAll('.channel-card');
            let visible = 0;
            cards.forEach(c => {
                const match = c.dataset.pais === pais;
                c.classList.toggle('hidden', !match);
                if (match) visible++;
            });
            document.getElementById('stats').textContent = `📊 ${visible} canales en ${pais}`;
        }

        function setupFilters() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    categoriaActual = this.dataset.filter;
                    aplicarFiltrosGlobales();
                });
            });
        }

        function aplicarFiltrosGlobales() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.channel-card');
            let visible = 0;
            cards.forEach(c => {
                const nombre = c.dataset.nombre?.toLowerCase() || '';
                const categoria = c.dataset.categoria || 'entretenimiento';
                const matchSearch = nombre.includes(searchTerm);
                const matchCategoria = categoriaActual === 'all' || categoria === categoriaActual;
                const matchPais = !paisActual || c.dataset.pais === paisActual;
                const show = matchSearch && matchCategoria && matchPais;
                c.classList.toggle('hidden', !show);
                if (show) visible++;
            });
            document.getElementById('stats').textContent = `📊 ${visible} canales visibles`;
            document.getElementById('sectionTitle').textContent = paisActual ? `📺 ${paisActual}` : '🌐 Todos los canales';
        }

        // ==================== BUSQUEDA ====================
        function setupSearch() {
            document.getElementById('searchInput').addEventListener('input', function() {
                clearTimeout(timeoutBusqueda);
                timeoutBusqueda = setTimeout(aplicarFiltrosGlobales, 150);
            });
        }

        // ==================== MODAL ====================
        function abrirModal(url, channelName, tipo = 'm3u8') {
            const modal = document.getElementById('playerModal');
            const video = document.getElementById('modalVideo');
            const iframe = document.getElementById('modalIframe');
            const loading = document.getElementById('modalLoading');
            if (currentHls) { currentHls.destroy(); currentHls = null; }
            if (video.src) { video.pause(); video.removeAttribute('src'); video.load(); }
            if (iframe.src) { iframe.src = ''; iframe.style.display = 'none'; }
            video.style.display = 'none';
            iframe.style.display = 'none';
            loading.classList.add('active');
            document.getElementById('modalChannelName').textContent = channelName;
            document.getElementById('modalLiveStatus').textContent = '● CONECTANDO';
            modal.classList.add('active');
            cargarStreamEnModal(url, channelName, tipo);
        }

        function cerrarModal() {
            const modal = document.getElementById('playerModal');
            const video = document.getElementById('modalVideo');
            const iframe = document.getElementById('modalIframe');
            if (currentHls) { currentHls.destroy(); currentHls = null; }
            if (video.src) { video.pause(); video.removeAttribute('src'); video.load(); }
            if (iframe.src) { iframe.src = ''; iframe.style.display = 'none'; }
            modal.classList.remove('active');
        }

        function cargarStreamEnModal(url, channelName, tipo = 'm3u8') {
            const video = document.getElementById('modalVideo');
            const iframe = document.getElementById('modalIframe');
            const loading = document.getElementById('modalLoading');
            const liveStatus = document.getElementById('modalLiveStatus');
            const dmMatch = url.match(/\/video\/([a-z0-9]+)/i);
            if (dmMatch || tipo === 'dailymotion') {
                const videoId = dmMatch ? dmMatch[1] : null;
                if (videoId) {
                    video.style.display = 'none';
                    iframe.style.display = 'block';
                    iframe.src = `https://geo.dailymotion.com/player.html?video=${videoId}&autoplay=1`;
                    loading.classList.remove('active');
                    liveStatus.textContent = '● EN VIVO';
                    return;
                }
            }
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('v=')) videoId = url.split('v=')[1].split('&')[0];
                else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].split('?')[0];
                if (videoId) {
                    video.style.display = 'none';
                    iframe.style.display = 'block';
                    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    loading.classList.remove('active');
                    liveStatus.textContent = '● REPRODUCIENDO';
                    return;
                }
            }
            if (url.includes('.m3u8')) {
                video.style.display = 'block';
                iframe.style.display = 'none';
                if (Hls.isSupported()) {
                    currentHls = new Hls({ debug: false, enableWorker: true });
                    currentHls.loadSource(url);
                    currentHls.attachMedia(video);
                    currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                        loading.classList.remove('active');
                        liveStatus.textContent = '● EN VIVO';
                        video.play().catch(e => console.error(e));
                    });
                    currentHls.on(Hls.Events.ERROR, () => {
                        loading.classList.remove('active');
                        liveStatus.textContent = '❌ ERROR';
                    });
                } else {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => {
                        loading.classList.remove('active');
                        liveStatus.textContent = '● EN VIVO';
                        video.play();
                    }, { once: true });
                }
            } else if (url.startsWith('http')) {
                loading.classList.remove('active');
                liveStatus.textContent = '⚠️ WEB';
                video.style.display = 'none';
                iframe.style.display = 'none';
                window.open(url, '_blank');
            } else {
                loading.classList.remove('active');
                liveStatus.textContent = '❌ ERROR';
                video.style.display = 'none';
                iframe.style.display = 'none';
            }
        }

        // ==================== URL PERSONALIZADA ====================
        function setupCustomUrl() {
            document.getElementById('playCustom').onclick = () => {
                const input = document.getElementById('customUrl').value.trim();
                if (!input) return;
                if (input.match(/^x[a-z0-9]+$/i)) {
                    abrirModal(`https://www.dailymotion.com/video/${input}`, "URL Personalizada", "dailymotion");
                } else {
                    abrirModal(input, "URL Personalizada", "m3u8");
                }
            };
        }

        // ==================== EVENTOS DEL MODAL ====================
        function setupModalEvents() {
            document.getElementById('modalCloseBtn').onclick = cerrarModal;
            document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });
            document.getElementById('playerModal').addEventListener('click', e => { if (e.target === e.currentTarget) cerrarModal(); });
        }

        // ==================== INICIALIZAR ====================
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🎬 Iniciando SpayCine TV...');
            canalesData = await cargarTodosLosCanales();
            renderCountries(canalesData);
            renderChannels(canalesData);
            setupFilters();
            setupSearch();
            setupCustomUrl();
            setupModalEvents();
            document.getElementById('stats').textContent = `📊 ${canalesData.length} canales cargados`;
            console.log(`✅ ${canalesData.length} canales cargados`);
        });
    </script>
</body>
</html>
