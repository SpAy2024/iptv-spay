<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpayCine TV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* =====================================================
           SPAYCINE TV — SISTEMA DE DISEÑO
           Concepto: marquesina de cine / boletería nocturna.
           Paleta:
             --bg        #0a0d16  fondo principal (sala oscura)
             --surface   #12161f  barras y paneles
             --surface-2 #1a1f2c  tarjetas de canal
             --border    rgba(255,255,255,.07)
             --text      #f4f5f8
             --text-dim  #8a92a6
             --text-faint#535c72
             --gold      #ffb703  acento de marquesina (firma visual)
             --gold-dim  rgba(255,183,3,.14)
             --live      #ff3b3b  solo para el punto "en vivo"
           Tipografía:
             Display -> 'Bebas Neue' (letrero de marquesina, condensada)
             Cuerpo  -> 'Inter'
           Firma: cenefa perforada tipo fotograma de película bajo el
           header + insignia "EN VIVO" con forma de boleto (ticket stub).
        ===================================================== */
        :root{
            --bg:#0a0d16;
            --surface:#12161f;
            --surface-2:#1a1f2c;
            --surface-3:#212739;
            --border:rgba(255,255,255,.07);
            --text:#f4f5f8;
            --text-dim:#8a92a6;
            --text-faint:#535c72;
            --gold:#ffb703;
            --gold-dim:rgba(255,183,3,.14);
            --live:#ff3b3b;
            --radius:14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            background-image:
                radial-gradient(1200px 600px at 15% -10%, rgba(255,183,3,.06), transparent 60%),
                radial-gradient(900px 500px at 110% 10%, rgba(255,183,3,.04), transparent 55%);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        ::selection { background: var(--gold-dim); color: var(--gold); }
        :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

        /* Cenefa perforada — motivo de fotograma de película, reutilizable */
        .filmstrip {
            height: 6px;
            flex-shrink: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,.16) 1.6px, transparent 1.7px);
            background-size: 14px 6px;
            background-position: 6px 3px;
            background-color: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        /* ===== LAYOUT PRINCIPAL ===== */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: transparent;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        /* ===== HEADER ===== */
        .app-header {
            padding: 14px 16px;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            min-height: 58px;
            grid-area: header;
        }
        .app-header .logo {
            font-family: 'Bebas Neue', 'Inter', sans-serif;
            font-size: 1.7em;
            font-weight: 400;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 9px;
        }
        .app-header .logo i { font-size: 0.75em; color: var(--gold); }
        .app-header .logo span { color: var(--gold); }
        .app-header .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        /* Insignia "EN VIVO" con forma de boleto (signature element) */
        .header-badge {
            position: relative;
            font-size: 0.62em;
            font-weight: 700;
            letter-spacing: .6px;
            color: #1a1206;
            background: var(--gold);
            padding: 5px 12px 5px 20px;
            border-radius: 3px;
            white-space: nowrap;
        }
        .header-badge::before {
            content: "";
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--live);
            box-shadow: 0 0 0 2px rgba(26,18,6,.25);
            animation: pulse-live 1.8s ease-in-out infinite;
        }
        @keyframes pulse-live {
            0%, 100% { opacity: 1; }
            50% { opacity: .35; }
        }
        .header-actions .search-icon {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text-dim);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s ease;
            font-size: 0.9em;
        }
        .header-actions .search-icon:hover {
            background: var(--gold-dim);
            border-color: rgba(255,183,3,.3);
            color: var(--gold);
        }

        /* ===== ZONA PRINCIPAL (player + panel lateral en desktop) ===== */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            grid-area: main;
        }

        /* ===== REPRODUCTOR ===== */
        .player-wrapper {
            flex: 1;
            background: #000;
            position: relative;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .player-wrapper::before {
            /* viñeta de "sala de cine" cuando no hay contenido reproduciéndose */
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.55) 100%);
            pointer-events: none;
            z-index: 1;
        }
        .player-wrapper video,
        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            background: #000;
            border: none;
            position: relative;
            z-index: 0;
        }
        .player-wrapper iframe { display: none; }

        .player-overlay-info {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(10,13,22,.82);
            backdrop-filter: blur(10px);
            padding: 9px 16px;
            border-radius: 10px;
            border-left: 3px solid var(--gold);
            z-index: 5;
            display: none;
            max-width: 80%;
        }
        .player-overlay-info .overlay-name {
            font-weight: 700;
            font-size: 0.9em;
            color: #fff;
        }
        .player-overlay-info .overlay-status {
            font-size: 0.7em;
            color: var(--live);
            font-weight: 600;
            letter-spacing: .3px;
        }
        .player-overlay-info.active { display: block; }

        .modal-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            text-align: center;
            color: #fff;
            background: rgba(10,13,22,.85);
            padding: 22px 32px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            z-index: 6;
        }
        .modal-loading .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid rgba(255,255,255,.08);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto 10px;
        }
        .modal-loading.active { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== PANEL LATERAL (categorías + lista) =====
           flex:1 es obligatorio aquí: en móvil este panel es hermano
           de .main-area dentro de la misma columna flex, así que sin
           un flex-grow explícito se queda sin alto definido y los
           chips de categorías/países se comprimen o desaparecen. */
        .side-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            background: var(--bg);
            grid-area: sidebar;
        }

        /* ===== CATEGORÍAS + PAÍSES ===== */
        .categories-bar {
            padding: 12px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .categories-bar::-webkit-scrollbar { display: none; }
        .categories-bar .category-chip {
            display: inline-block;
            padding: 6px 14px;
            margin-right: 6px;
            background: var(--surface-2);
            border-radius: 20px;
            font-size: 0.72em;
            font-weight: 600;
            color: var(--text-dim);
            cursor: pointer;
            transition: all .2s ease;
            border: 1px solid transparent;
        }
        .categories-bar .category-chip:hover {
            background: var(--surface-3);
            color: var(--text);
        }
        .categories-bar .category-chip.active {
            background: var(--gold-dim);
            color: var(--gold);
            border-color: rgba(255,183,3,.35);
        }
        .categories-bar .category-chip .count {
            font-size: 0.62em;
            opacity: .55;
            margin-left: 4px;
        }
        .categories-bar .separator {
            display: inline-block;
            color: var(--border);
            padding: 0 6px;
            font-size: 0.8em;
        }

        /* ===== LISTA DE CANALES ===== */
        .channels-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 16px 20px;
            background: var(--bg);
            -webkit-overflow-scrolling: touch;
        }
        .channels-list::-webkit-scrollbar { width: 4px; }
        .channels-list::-webkit-scrollbar-track { background: transparent; }
        .channels-list::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; }

        .channel-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 6px;
            background: var(--surface);
            border-radius: 12px;
            cursor: pointer;
            transition: all .18s ease;
            border: 1px solid var(--border);
        }
        .channel-item:hover {
            background: var(--surface-2);
            border-color: rgba(255,255,255,.12);
        }
        .channel-item:active {
            transform: scale(.99);
        }
        .channel-item.active {
            background: var(--gold-dim);
            border-color: rgba(255,183,3,.35);
        }
        .channel-item .logo {
            width: 38px;
            height: 38px;
            background: var(--surface-3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-right: 12px;
            padding: 2px;
        }
        .channel-item .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .channel-item .logo .fallback {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 15px;
            font-weight: 400;
            color: var(--text-faint);
        }
        .channel-item .info {
            flex: 1;
            min-width: 0;
        }
        .channel-item .info .name {
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-item .info .category {
            font-size: 0.62em;
            color: var(--text-faint);
            margin-top: 2px;
            text-transform: capitalize;
        }
        .channel-item .play-btn {
            background: var(--surface-3);
            border: none;
            color: var(--text-dim);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            transition: all .2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8em;
            flex-shrink: 0;
        }
        .channel-item .play-btn:hover,
        .channel-item .play-btn:active {
            background: var(--gold);
            color: #1a1206;
        }
        .channel-item.hidden { display: none; }

        /* ===== MODAL BÚSQUEDA ===== */
        .search-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6,8,14,.94);
            backdrop-filter: blur(12px);
            z-index: 200;
            display: none;
            padding: 20px;
            flex-direction: column;
        }
        .search-modal.active { display: flex; }
        .search-modal .search-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            max-width: 640px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }
        .search-modal .search-header input {
            flex: 1;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 13px 20px;
            font-size: 1em;
            color: #fff;
        }
        .search-modal .search-header input::placeholder { color: var(--text-faint); }
        .search-modal .search-header input:focus {
            outline: none;
            border-color: var(--gold);
        }
        .search-modal .search-header .close-search {
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.1em;
            cursor: pointer;
            flex-shrink: 0;
        }
        .search-modal .search-header .close-search:hover { background: var(--surface-3); }
        .search-modal .search-results {
            flex: 1;
            overflow-y: auto;
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
        }

        /* =====================================================
           DESKTOP / TABLET (≥ 900px)
           Panel de reproducción a la izquierda, canales a la
           derecha — como una cabina de control, no una app
           móvil estirada.
        ===================================================== */
        @media (min-width: 900px) {
            body { overflow: auto; }
            .app-container {
                max-width: none;
                display: grid;
                grid-template-columns: minmax(0, 1fr) 400px;
                grid-template-rows: auto 1fr;
                grid-template-areas:
                    "header header"
                    "main sidebar";
                height: 100vh;
                max-width: 1440px;
            }
            .filmstrip { grid-column: 1 / -1; }
            .app-header { padding: 16px 28px; }
            .app-header .logo { font-size: 2em; }
            .main-area { grid-area: main; }
            .player-wrapper { min-height: 0; }
            .side-panel {
                grid-area: sidebar;
                border-left: 1px solid var(--border);
            }
            .channel-item { padding: 11px 14px; }
        }
        @media (min-width: 1200px) {
            .app-container { grid-template-columns: minmax(0, 1fr) 440px; }
        }

        /* ===== MÓVIL PEQUEÑO ===== */
        @media (max-width: 480px) {
            .app-header { padding: 10px 14px; min-height: 52px; }
            .app-header .logo { font-size: 1.4em; }
            .header-badge { font-size: 0.56em; padding: 4px 10px 4px 16px; }
            .player-wrapper { min-height: 180px; }
            .categories-bar { padding: 9px 12px; }
            .categories-bar .category-chip { padding: 5px 11px; font-size: 0.66em; }
            .channels-list { padding: 8px 12px 16px; }
            .channel-item { padding: 8px 10px; }
            .channel-item .logo { width: 32px; height: 32px; font-size: 10px; }
            .channel-item .info .name { font-size: 0.76em; }
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- ===== HEADER ===== -->
        <header class="app-header">
            <div class="logo">
                <i class="fas fa-film"></i>
                Spay<span>Tv</span>
            </div>
            <div class="header-actions">
                <span class="header-badge">EN VIVO</span>
                <button class="search-icon" id="headerSearchBtn" aria-label="Buscar canal">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </header>
        <div class="filmstrip"></div>

        <!-- ===== ÁREA PRINCIPAL: REPRODUCTOR ===== -->
        <div class="main-area">
            <div class="player-wrapper" id="playerWrapper">
                <video id="videoPlayer" controls preload="auto"></video>
                <iframe id="iframePlayer" allow="autoplay; fullscreen"></iframe>

                <div class="player-overlay-info" id="playerOverlayInfo">
                    <div class="overlay-name" id="overlayChannelName">Canal</div>
                    <div class="overlay-status">● EN VIVO</div>
                </div>

                <div class="modal-loading" id="modalLoading">
                    <div class="spinner"></div>
                    <span>Cargando...</span>
                </div>
            </div>
        </div>

        <!-- ===== PANEL LATERAL: CATEGORÍAS + CANALES ===== -->
        <div class="side-panel">
            <div class="categories-bar" id="categoriesBar">
                <!-- Se llena con JS -->
            </div>
            <div class="channels-list" id="channelsList"></div>
        </div>

        <!-- ===== MODAL BÚSQUEDA ===== -->
        <div class="search-modal" id="searchModal">
            <div class="search-header">
                <input type="text" id="searchInput" placeholder="Buscar canal...">
                <button class="close-search" id="closeSearch" aria-label="Cerrar búsqueda"><i class="fas fa-times"></i></button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        // ==================== CONFIGURACIÓN ====================
        const PROXY_URL = 'https://iptv-spay.onrender.com/proxy?url=';
        let currentHls = null;
        let canalesData = [];
        let categoriaActual = 'Todos';
        let paisActual = 'Todos';
        let currentChannelName = '';
        let currentChannelLogo = '';

        // ==================== CANALES ====================
        const misCanalesDailymotion = [
            { nombre: "RED UNO LPZ HD", pais: "Bolivia", logo: "https://i.postimg.cc/HWQ1JNbV/RED-UNO-LPZ-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/xa0fwio", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "RED UNO CBBA HD", pais: "Bolivia", logo: "https://i.postimg.cc/NM6C0WZy/RED-UNO-CBBA-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/xa0qka8", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "RED UNO SCZ HD", pais: "Bolivia", logo: "https://i.postimg.cc/6QRYHkWk/RED-UNO-SC-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/x9n2qyk", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "UNITEL BOLIVIA HD", pais: "Bolivia", logo: "https://i.ibb.co/pzVXZcg/UNITEL-BOLIVIA-VLC.jpg", url: "https://www.dailymotion.com/video/x7wzxiw", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "POV UNITEL HD", pais: "Bolivia", logo: "https://i.ibb.co/p3B7tSd/bolivia-hd-04.jpg", url: "https://www.dailymotion.com/video/x8eimg9", tipo: "dailymotion", categoria: "entretenimiento" },
            { nombre: "ATB BOLIVIA HD", pais: "Bolivia", logo: "https://i.postimg.cc/Y06y7NgW/ATB-BOLIVIA-HD.jpg", url: "https://www.dailymotion.com/video/x84eirw", tipo: "dailymotion", categoria: "noticias" },

        ];

        const CATEGORIAS = [
            { id: 'Todos', icon: '🌐' },
            { id: 'noticias', icon: '📰' },
            { id: 'deportes', icon: '⚽' },
            { id: 'entretenimiento', icon: '🎬' },
            { id: 'musica', icon: '🎵' },
            { id: 'cultural', icon: '🎭' }
        ];

        const PAISES = [
            { codigo: 'bo', nombre: 'Bolivia', emoji: '🇧🇴' },
            { codigo: 'ar', nombre: 'Argentina', emoji: '🇦🇷' },
            { codigo: 'br', nombre: 'Brasil', emoji: '🇧🇷' },
            { codigo: 'cl', nombre: 'Chile', emoji: '🇨🇱' },
            { codigo: 'co', nombre: 'Colombia', emoji: '🇨🇴' },
            { codigo: 'ec', nombre: 'Ecuador', emoji: '🇪🇨' },
            { codigo: 'py', nombre: 'Paraguay', emoji: '🇵🇾' },
            { codigo: 'pe', nombre: 'Perú', emoji: '🇵🇪' },
            { codigo: 'uy', nombre: 'Uruguay', emoji: '🇺🇾' },
            { codigo: 've', nombre: 'Venezuela', emoji: '🇻🇪' },
            { codigo: 'cr', nombre: 'Costa Rica', emoji: '🇨🇷' },
            { codigo: 'sv', nombre: 'El Salvador', emoji: '🇸🇻' },
            { codigo: 'gt', nombre: 'Guatemala', emoji: '🇬🇹' },
            { codigo: 'hn', nombre: 'Honduras', emoji: '🇭🇳' },
            { codigo: 'ni', nombre: 'Nicaragua', emoji: '🇳🇮' },
            { codigo: 'pa', nombre: 'Panamá', emoji: '🇵🇦' },
            { codigo: 'do', nombre: 'República Dominicana', emoji: '🇩🇴' },
            { codigo: 'pr', nombre: 'Puerto Rico', emoji: '🇵🇷' },
            { codigo: 'es', nombre: 'España', emoji: '🇪🇸' },
            { codigo: 'mx', nombre: 'México', emoji: '🇲🇽' }
        ];

        // ==================== CARGAR LISTA M3U ====================
        async function cargarListaM3U(url, paisOrigen) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const m3uContent = await response.text();
                return parsearM3U(m3uContent, paisOrigen);
            } catch (error) {
                return [];
            }
        }

        function parsearM3U(content, paisOrigen) {
            const lines = content.split('\n');
            const canales = [];
            let currentChannel = null;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    const lastComma = line.lastIndexOf(',');
                    const nombre = lastComma !== -1 ? line.substring(lastComma + 1).trim() : 'Canal sin nombre';
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const logo = logoMatch ? logoMatch[1] : '';
                    const idMatch = line.match(/tvg-id="([^"]*)"/);
                    const id = idMatch ? idMatch[1] : '';
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    const grupo = groupMatch ? groupMatch[1] : '';

                    let categoria = detectarCategoria(nombre, grupo);
                    if (grupo && (grupo.toLowerCase().includes('sport') || grupo.toLowerCase().includes('deporte'))) {
                        categoria = 'deportes';
                    }

                    currentChannel = {
                        id: id || nombre.replace(/\s/g, ''),
                        nombre: nombre,
                        pais: paisOrigen,
                        logo: logo,
                        url: '',
                        tipo: 'm3u8',
                        categoria: categoria,
                        grupo: grupo
                    };
                } else if (line && !line.startsWith('#') && currentChannel) {
                    currentChannel.url = line;
                    if (currentChannel.url.startsWith('http')) {
                        canales.push(currentChannel);
                    }
                    currentChannel = null;
                }
            }
            return canales;
        }

        function detectarCategoria(nombre, grupo) {
            const texto = (nombre + ' ' + grupo).toLowerCase();
            const claves = {
                'noticias': ['noticia', 'news', 'informe', 'actualidad', 'cnn', 'bbc', 'telefe noticias', 'el trece', 'tvn', 'canal 13', 'red uno', 'unitel', 'atb', 'telesur'],
                'deportes': ['deporte', 'sport', 'fútbol', 'futbol', 'gol', 'espn', 'tyc', 'fox sports', 'goal', 'racing', 'boca', 'river', 'liga', 'champions', 'uefa', 'libertadores', 'sudamericana', 'nfl', 'nba', 'mlb', 'tennis', 'tenis', 'motogp', 'formula', 'f1'],
                'entretenimiento': ['entretenimiento', 'series', 'películas', 'pelicula', 'cine', 'telefe', 'el trece', 'entreten', 'show', 'telenovela'],
                'musica': ['música', 'musica', 'music', 'mtv', 'viva', 'radio'],
                'cultural': ['cultural', 'educativo', 'educación', 'documental', 'history', 'discovery']
            };
            for (const [categoria, palabras] of Object.entries(claves)) {
                for (const palabra of palabras) {
                    if (texto.includes(palabra)) return categoria;
                }
            }
            return 'entretenimiento';
        }

        // ==================== CARGAR TODOS LOS CANALES ====================
        async function cargarTodosLosCanales() {
            let todos = [...misCanalesDailymotion];
            console.log('📡 Cargando canales...');

            for (const pais of PAISES) {
                try {
                    const canales = await cargarListaM3U(`https://iptv-org.github.io/iptv/countries/${pais.codigo}.m3u`, pais.nombre);
                    console.log(`${pais.emoji} ${pais.nombre}: ${canales.length} canales`);
                    todos = todos.concat(canales);
                } catch (e) {}
            }

            try {
                const deportes = await cargarListaM3U('https://iptv-org.github.io/iptv/categories/sports.m3u', 'Deportes');
                console.log(`⚽ Deportes (iptv-org): ${deportes.length} canales`);
                deportes.forEach(c => c.categoria = 'deportes');
                todos = todos.concat(deportes);
            } catch (e) {
                console.error('Error cargando deportes iptv-org:', e);
            }

            try {
                const deportesArg = await cargarListaM3U('https://raw.githubusercontent.com/Kewsito/lista-deportes-argentina/refs/heads/main/lista.m3u8', 'Argentina');
                console.log(`⚽ Deportes Argentina (Kewsito): ${deportesArg.length} canales`);
                deportesArg.forEach(c => {
                    c.categoria = 'deportes';
                    c.pais = 'Argentina';
                });
                todos = todos.concat(deportesArg);
            } catch (e) {
                console.error('Error cargando deportes Argentina:', e);
            }

            try {
                const misCanales = await cargarListaM3U('https://raw.githubusercontent.com/SpAy2024/MisCanalesTV/refs/heads/main/mis_canales_tv.m3u', 'Internacional');
                console.log(`📺 Mis Canales TV: ${misCanales.length} canales`);
                misCanales.forEach(c => {
                    const nombreLower = c.nombre.toLowerCase();
                    if (nombreLower.includes('deporte') || nombreLower.includes('sport') || nombreLower.includes('espn') || nombreLower.includes('fox') || nombreLower.includes('tyc')) {
                        c.categoria = 'deportes';
                    } else if (nombreLower.includes('noticia') || nombreLower.includes('news') || nombreLower.includes('cnn') || nombreLower.includes('bbc')) {
                        c.categoria = 'noticias';
                    } else if (nombreLower.includes('cine') || nombreLower.includes('movie') || nombreLower.includes('film') || nombreLower.includes('series') || nombreLower.includes('hbo')) {
                        c.categoria = 'entretenimiento';
                    } else {
                        c.categoria = 'entretenimiento';
                    }
                    c.pais = 'Internacional';
                });
                todos = todos.concat(misCanales);
            } catch (e) {
                console.error('Error cargando Mis Canales TV:', e);
            }

            console.log(`✅ Total canales: ${todos.length}`);
            return todos;
        }

        // ==================== RENDERIZAR CATEGORÍAS + PAÍSES ====================
        function renderCategories(canales) {
            const bar = document.getElementById('categoriesBar');
            const counts = {};
            canales.forEach(c => {
                counts[c.categoria] = (counts[c.categoria] || 0) + 1;
                counts[c.pais] = (counts[c.pais] || 0) + 1;
            });

            // ===== 1. CATEGORÍAS =====
            let html = `<span class="category-chip active" data-categoria="Todos">🌐 Todos <span class="count">${canales.length}</span></span>`;

            for (const cat of CATEGORIAS) {
                if (cat.id === 'Todos') continue;
                const count = counts[cat.id] || 0;
                if (count > 0) {
                    html += `<span class="category-chip" data-categoria="${cat.id}">${cat.icon} ${cat.id.charAt(0).toUpperCase() + cat.id.slice(1)} <span class="count">${count}</span></span>`;
                }
            }

            // ===== 2. SEPARADOR =====
            html += `<span class="separator">|</span>`;

            // ===== 3. PAÍSES =====
            let paisesMostrados = 0;
            for (const p of PAISES) {
                const count = counts[p.nombre] || 0;
                if (count > 0) {
                    html += `<span class="category-chip" data-pais="${p.nombre}">${p.emoji} ${p.nombre} <span class="count">${count}</span></span>`;
                    paisesMostrados++;
                }
            }

            // Si no hay países con canales, mostrar mensaje
            if (paisesMostrados === 0) {
                html += `<span style="color:rgba(255,255,255,0.2);font-size:0.7em;padding:4px;">Sin países disponibles</span>`;
            }

            bar.innerHTML = html;

            // ===== EVENTOS =====
            bar.querySelectorAll('.category-chip').forEach(el => {
                el.addEventListener('click', function() {
                    bar.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');

                    // Limpiar filtros
                    categoriaActual = 'Todos';
                    paisActual = 'Todos';

                    if (this.dataset.pais) {
                        paisActual = this.dataset.pais;
                    } else if (this.dataset.categoria) {
                        categoriaActual = this.dataset.categoria;
                    }

                    filtrarCanales();
                });
            });
        }

        // ==================== RENDERIZAR CANALES ====================
        function renderChannels(canales) {
            const list = document.getElementById('channelsList');
            if (canales.length === 0) {
                list.innerHTML = '<div style="text-align:center;padding:30px;color:rgba(255,255,255,0.2);">No hay canales disponibles</div>';
                return;
            }
            let html = '';
            canales.forEach(c => {
                const logoHtml = c.logo ? `<img src="${c.logo}" onerror="this.outerHTML='<span class=\\'fallback\\'>${c.nombre.charAt(0)}</span>'">` : `<span class="fallback">${c.nombre.charAt(0)}</span>`;
                html += `
                    <div class="channel-item" data-pais="${c.pais}" data-url="${c.url.replace(/'/g, "\\'")}" data-nombre="${c.nombre.replace(/'/g, "\\'")}" data-tipo="${c.tipo}" data-logo="${c.logo || ''}" data-categoria="${c.categoria}">
                        <div class="logo">${logoHtml}</div>
                        <div class="info">
                            <div class="name">${c.nombre}</div>
                            <div class="category">${c.pais} · ${c.categoria}</div>
                        </div>
                        <button class="play-btn" onclick="event.stopPropagation(); reproducirCanal('${c.url.replace(/'/g, "\\'")}', '${c.nombre.replace(/'/g, "\\'")}', '${c.tipo}', '${c.logo || ''}')"><i class="fas fa-play"></i></button>
                    </div>
                `;
            });
            list.innerHTML = html;

            document.querySelectorAll('.channel-item').forEach(el => {
                el.addEventListener('click', function() {
                    const url = this.dataset.url;
                    const nombre = this.dataset.nombre;
                    const tipo = this.dataset.tipo;
                    const logo = this.dataset.logo;
                    reproducirCanal(url, nombre, tipo, logo);
                });
            });

            filtrarCanales();
        }

        // ==================== FILTRAR CANALES ====================
        function filtrarCanales() {
            const items = document.querySelectorAll('.channel-item');
            let visible = 0;
            items.forEach(item => {
                let matchCategoria = categoriaActual === 'Todos' || item.dataset.categoria === categoriaActual;
                let matchPais = paisActual === 'Todos' || item.dataset.pais === paisActual;
                const match = matchCategoria && matchPais;
                item.classList.toggle('hidden', !match);
                if (match) visible++;
            });
        }

        // ==================== REPRODUCIR CANAL ====================
        function reproducirCanal(url, channelName, tipo = 'm3u8', logo = '') {
            const video = document.getElementById('videoPlayer');
            const iframe = document.getElementById('iframePlayer');
            const loading = document.getElementById('modalLoading');
            const overlay = document.getElementById('playerOverlayInfo');

            if (currentHls) { currentHls.destroy(); currentHls = null; }
            if (video.src) { video.pause(); video.removeAttribute('src'); video.load(); }
            if (iframe.src) { iframe.src = ''; iframe.style.display = 'none'; }

            video.style.display = 'none';
            iframe.style.display = 'none';
            loading.classList.add('active');
            overlay.classList.remove('active');

            currentChannelName = channelName;
            currentChannelLogo = logo;

            document.getElementById('overlayChannelName').textContent = channelName;

            cargarStream(url, channelName, tipo);
        }

        function cargarStream(url, channelName, tipo = 'm3u8') {
            const video = document.getElementById('videoPlayer');
            const iframe = document.getElementById('iframePlayer');
            const loading = document.getElementById('modalLoading');
            const overlay = document.getElementById('playerOverlayInfo');
            const overlayName = document.getElementById('overlayChannelName');

            const dmMatch = url.match(/\/video\/([a-z0-9]+)/i);
            if (dmMatch || tipo === 'dailymotion') {
                const videoId = dmMatch ? dmMatch[1] : null;
                if (videoId) {
                    video.style.display = 'none';
                    iframe.style.display = 'block';
                    iframe.src = `https://geo.dailymotion.com/player.html?video=${videoId}&autoplay=1`;
                    loading.classList.remove('active');
                    overlayName.textContent = channelName;
                    overlay.classList.add('active');
                    return;
                }
            }
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('v=')) videoId = url.split('v=')[1].split('&')[0];
                else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].split('?')[0];
                if (videoId) {
                    video.style.display = 'none';
                    iframe.style.display = 'block';
                    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    loading.classList.remove('active');
                    overlayName.textContent = channelName;
                    overlay.classList.add('active');
                    return;
                }
            }
            if (url.includes('.m3u8')) {
                video.style.display = 'block';
                iframe.style.display = 'none';
                if (Hls.isSupported()) {
                    currentHls = new Hls({ debug: false, enableWorker: true });
                    currentHls.loadSource(url);
                    currentHls.attachMedia(video);
                    currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                        loading.classList.remove('active');
                        overlayName.textContent = channelName;
                        overlay.classList.add('active');
                        video.play().catch(e => console.error(e));
                    });
                    currentHls.on(Hls.Events.ERROR, () => {
                        loading.classList.remove('active');
                        overlay.classList.remove('active');
                    });
                } else {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => {
                        loading.classList.remove('active');
                        overlayName.textContent = channelName;
                        overlay.classList.add('active');
                        video.play();
                    }, { once: true });
                }
            } else if (url.startsWith('http')) {
                loading.classList.remove('active');
                overlay.classList.remove('active');
                video.style.display = 'none';
                iframe.style.display = 'none';
                window.open(url, '_blank');
            } else {
                loading.classList.remove('active');
                overlay.classList.remove('active');
                video.style.display = 'none';
                iframe.style.display = 'none';
            }
        }

        // ==================== BÚSQUEDA ====================
        function setupSearch() {
            const modal = document.getElementById('searchModal');
            const closeBtn = document.getElementById('closeSearch');
            const input = document.getElementById('searchInput');
            const results = document.getElementById('searchResults');
            const headerSearchBtn = document.getElementById('headerSearchBtn');
            let searchTimeout;

            function abrirModal() {
                modal.classList.add('active');
                input.focus();
                mostrarResultados(input.value);
            }

            function cerrarModal() {
                modal.classList.remove('active');
            }

            headerSearchBtn.onclick = (e) => {
                e.stopPropagation();
                abrirModal();
            };

            closeBtn.onclick = (e) => {
                e.stopPropagation();
                cerrarModal();
            };

            modal.onclick = (e) => {
                if (e.target === modal) {
                    cerrarModal();
                }
            };

            input.oninput = function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    mostrarResultados(this.value);
                }, 150);
            };

            function mostrarResultados(termino) {
                const term = termino.toLowerCase().trim();
                const items = document.querySelectorAll('.channel-item:not(.hidden)');
                let html = '';
                let count = 0;

                if (!term) {
                    items.forEach(item => {
                        if (!item.classList.contains('hidden')) {
                            html += item.outerHTML;
                            count++;
                        }
                    });
                } else {
                    items.forEach(item => {
                        const nombre = item.dataset.nombre?.toLowerCase() || '';
                        if (nombre.includes(term)) {
                            html += item.outerHTML;
                            count++;
                        }
                    });
                }

                results.innerHTML = html || `<div style="text-align:center;padding:30px;color:rgba(255,255,255,0.2);">No se encontraron resultados para "${termino}"</div>`;

                results.querySelectorAll('.channel-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const url = this.dataset.url;
                        const nombre = this.dataset.nombre;
                        const tipo = this.dataset.tipo;
                        const logo = this.dataset.logo;
                        reproducirCanal(url, nombre, tipo, logo);
                        cerrarModal();
                    });
                });
            }
        }

        // ==================== INICIALIZAR ====================
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🎬 Iniciando SpayCine TV...');
            canalesData = await cargarTodosLosCanales();
            renderCategories(canalesData);
            renderChannels(canalesData);
            setupSearch();
            console.log(`✅ ${canalesData.length} canales cargados`);
        });
    </script>
