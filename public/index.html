<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SpayCine TV - Canales en vivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET Y BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0e27;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        
        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        /* ===== SIDEBAR ===== */
        .sidebar {
            background: #0f1328;
            height: 100vh;
            overflow-y: auto;
            padding: 20px 16px;
            border-right: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
        }
        
        /* ===== LOGO ===== */
        .logo {
            font-size: 1.4em;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo span { color: #e50914; }
        .logo i { font-size: 1.2em; color: #e50914; }

        /* ===== NAVEGACIÓN ===== */
        .nav-tabs-custom {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .nav-tab {
            background: rgba(255,255,255,0.06);
            border: none;
            color: rgba(255,255,255,0.6);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.8em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
            min-width: 60px;
            letter-spacing: 0.3px;
        }
        .nav-tab:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .nav-tab.active { 
            background: #e50914; 
            color: #fff; 
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
        }

        /* ===== BÚSQUEDA ===== */
        #searchInput {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 30px;
            padding: 10px 18px;
            font-size: 0.85em;
            width: 100%;
            color: #fff;
            transition: all 0.3s;
            margin-bottom: 14px;
        }
        #searchInput::placeholder { color: rgba(255,255,255,0.35); }
        #searchInput:focus { 
            outline: none; 
            border-color: #e50914;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.15);
        }

        /* ===== PAÍSES ===== */
        .country-group {
            margin-bottom: 18px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.04);
            transition: all 0.3s;
        }
        .country-group:hover { background: rgba(255,255,255,0.06); }
        .country-title {
            font-size: 1em;
            font-weight: 700;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid rgba(229, 9, 20, 0.3);
            color: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.2px;
        }
        .country-title::before {
            content: "📺";
            font-size: 0.9em;
        }

        /* ===== CANALES (tarjetas estilo Netflix) ===== */
        .channel-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            margin: 6px 0;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            gap: 12px;
            border: 1px solid transparent;
        }
        .channel-item:hover {
            background: rgba(255,255,255,0.09);
            transform: translateX(4px);
            border-color: rgba(255,255,255,0.08);
        }
        .channel-item.active {
            background: rgba(229, 9, 20, 0.15);
            border-color: rgba(229, 9, 20, 0.3);
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.05);
        }
        .channel-item.hidden { display: none; }

        .channel-logo {
            width: 38px;
            height: 38px;
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .channel-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .channel-logo .fallback {
            font-size: 16px;
            font-weight: 700;
            color: rgba(255,255,255,0.3);
        }

        .channel-name {
            flex: 1;
            font-size: 0.8em;
            font-weight: 500;
            line-height: 1.2;
            color: rgba(255,255,255,0.85);
            letter-spacing: -0.1px;
        }

        .btn-play {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 5px 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 0.7em;
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.3px;
        }
        .btn-play:hover {
            background: #e50914;
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
        }
        .btn-play i { font-size: 0.7em; }

        /* ===== ÁREA DEL REPRODUCTOR ===== */
        .player-area {
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .player-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }
        #videoPlayer {
            width: 100%;
            height: 100%;
            background: #000;
        }
        #dmIframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        /* ===== INFORMACIÓN DEL CANAL ACTUAL ===== */
        .current-channel {
            position: absolute;
            bottom: 60px;
            left: 30px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.85em;
            z-index: 10;
            border-left: 3px solid #e50914;
            pointer-events: none;
            max-width: 70%;
            transition: all 0.3s;
        }
        .current-channel .name {
            font-weight: 700;
            font-size: 1.1em;
            display: block;
        }
        .current-channel .status {
            font-size: 0.75em;
            color: rgba(255,255,255,0.5);
        }
        .current-channel .status .live {
            color: #e50914;
            font-weight: 600;
        }

        /* ===== LOADING ===== */
        .loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 20px 35px;
            border-radius: 12px;
            z-index: 20;
            display: none;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .loading-message .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== ESTADÍSTICAS ===== */
        .stats {
            text-align: center;
            margin-top: 12px;
            padding: 8px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            font-size: 0.7em;
            color: rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.04);
        }

        /* ===== URL PERSONALIZADA ===== */
        .custom-url-section {
            margin-top: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .custom-url-section input {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 30px;
            padding: 8px 14px;
            width: 100%;
            margin-bottom: 6px;
            font-size: 0.75em;
            color: #fff;
        }
        .custom-url-section input::placeholder { color: rgba(255,255,255,0.3); }
        .custom-url-section input:focus {
            outline: none;
            border-color: #e50914;
        }
        .custom-url-section button {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 100%;
            padding: 6px;
            border-radius: 30px;
            font-size: 0.75em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .custom-url-section button:hover {
            background: #e50914;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar { height: 45vh; padding: 14px 12px; }
            .player-area { height: 55vh; }
            .channel-logo { width: 32px; height: 32px; font-size: 12px; }
            .channel-name { font-size: 0.7em; }
            .btn-play { padding: 4px 10px; font-size: 0.6em; }
            .nav-tab { font-size: 0.65em; padding: 6px 12px; }
            .logo { font-size: 1.1em; }
            .current-channel { bottom: 30px; left: 15px; padding: 8px 14px; font-size: 0.75em; max-width: 85%; }
            .current-channel .name { font-size: 0.95em; }
        }

        /* ===== LOADING INICIAL ===== */
        .initial-load {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex-direction: column;
            gap: 12px;
            color: rgba(255,255,255,0.3);
        }
        .initial-load .spinner {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- ===== SIDEBAR ===== -->
            <div class="col-md-4 col-lg-3 sidebar">
                <!-- Logo -->
                <div class="logo">
                    <i class="fas fa-play-circle"></i>
                    Spay<span>Cine</span>
                </div>

                <!-- Navegación -->
                <div class="nav-tabs-custom">
                    <button class="nav-tab active" data-section="tv">📺 TV</button>
                </div>

                <!-- Búsqueda -->
                <input type="text" id="searchInput" placeholder="🔍 Buscar canal...">

                <!-- Lista de canales -->
                <div id="channelsList">
                    <div class="initial-load">
                        <div class="spinner"></div>
                        <span>Cargando canales...</span>
                    </div>
                </div>

                <!-- Estadísticas -->
                <div class="stats" id="stats">📊 Cargando...</div>

                <!-- URL Personalizada -->
                <div class="custom-url-section">
                    <input type="text" id="customUrl" placeholder="🔗 URL M3U8 o ID Dailymotion">
                    <button id="playCustom">▶ Probar URL</button>
                </div>
            </div>

            <!-- ===== REPRODUCTOR ===== -->
            <div class="col-md-8 col-lg-9 player-area">
                <div class="player-container">
                    <video id="videoPlayer" controls preload="auto" style="display: block;"></video>
                    <iframe id="dmIframe" allow="autoplay; fullscreen"></iframe>
                    
                    <div id="currentChannel" class="current-channel">
                        <span class="name">⚡ Sin selección</span>
                        <span class="status">Selecciona un canal para comenzar</span>
                    </div>
                    
                    <div id="loadingMessage" class="loading-message">
                        <div class="spinner"></div>
                        <span>Cargando stream...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        // ==================== CONFIGURACIÓN ====================
        const PROXY_URL = 'https://iptv-spay.onrender.com/proxy?url=';

        // ==================== VARIABLES GLOBALES ====================
        let currentHls = null;
        let canalesData = [];
        let timeoutBusqueda = null;
        let canalesFiltrados = [];

        // ==================== MIS CANALES DE DAILYMOTION ====================
        const misCanalesDailymotion = [
            { nombre: "RED UNO LPZ HD", pais: "Bolivia", logo: "https://i.postimg.cc/HWQ1JNbV/RED-UNO-LPZ-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/xa0fwio", tipo: "dailymotion" },
            { nombre: "RED UNO CBBA HD", pais: "Bolivia", logo: "https://i.postimg.cc/NM6C0WZy/RED-UNO-CBBA-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/xa0qka8", tipo: "dailymotion" },
            { nombre: "RED UNO SCZ HD", pais: "Bolivia", logo: "https://i.postimg.cc/6QRYHkWk/RED-UNO-SC-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/x9n2qyk", tipo: "dailymotion" },
            { nombre: "UNITEL BOLIVIA HD", pais: "Bolivia", logo: "https://i.ibb.co/pzVXZcg/UNITEL-BOLIVIA-VLC.jpg", url: "https://www.dailymotion.com/video/x7wzxiw", tipo: "dailymotion" },
            { nombre: "POV UNITEL HD", pais: "Bolivia", logo: "https://i.ibb.co/p3B7tSd/bolivia-hd-04.jpg", url: "https://www.dailymotion.com/video/x8eimg9", tipo: "dailymotion" },
            { nombre: "ATB BOLIVIA HD", pais: "Bolivia", logo: "https://i.postimg.cc/Y06y7NgW/ATB-BOLIVIA-HD.jpg", url: "https://www.dailymotion.com/video/x84eirw", tipo: "dailymotion" },
            { nombre: "TELESUR HD", pais: "Bolivia", logo: "https://i.postimg.cc/QxmZpWDL/T-sr-Vlc08.jpg", url: "https://www.dailymotion.com/video/x82ug5r", tipo: "dailymotion" }
        ];

        // ==================== CARGAR LISTA M3U ====================
        async function cargarListaM3U(url, paisOrigen) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const m3uContent = await response.text();
                return parsearM3U(m3uContent, paisOrigen);
            } catch (error) {
                console.error(`Error cargando ${url}:`, error);
                return [];
            }
        }

        function parsearM3U(content, paisOrigen) {
            const lines = content.split('\n');
            const canales = [];
            let currentChannel = null;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    const lastComma = line.lastIndexOf(',');
                    const nombre = lastComma !== -1 ? line.substring(lastComma + 1).trim() : 'Canal sin nombre';
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const logo = logoMatch ? logoMatch[1] : '';
                    const idMatch = line.match(/tvg-id="([^"]*)"/);
                    const id = idMatch ? idMatch[1] : '';
                    
                    currentChannel = {
                        id: id,
                        nombre: nombre,
                        pais: paisOrigen,
                        logo: logo,
                        url: '',
                        tipo: 'm3u8'
                    };
                } else if (line && !line.startsWith('#') && currentChannel) {
                    currentChannel.url = line;
                    if (currentChannel.url.startsWith('http')) {
                        canales.push(currentChannel);
                    }
                    currentChannel = null;
                }
            }
            return canales;
        }

        // ==================== CARGAR TODOS LOS CANALES ====================
        async function cargarTodosLosCanales() {
            let todosLosCanales = [...misCanalesDailymotion];
            
            const paises = ['bo', 'ar', 'br', 'cl', 'co', 'ec', 'py', 'pe', 'uy', 've', 'cr', 'sv', 'gt', 'hn', 'ni', 'pa', 'do', 'pr', 'es', 'mx'];
            const nombres = {
                'bo': 'Bolivia', 'ar': 'Argentina', 'br': 'Brasil', 'cl': 'Chile',
                'co': 'Colombia', 'ec': 'Ecuador', 'py': 'Paraguay', 'pe': 'Perú',
                'uy': 'Uruguay', 've': 'Venezuela', 'cr': 'Costa Rica', 'sv': 'El Salvador',
                'gt': 'Guatemala', 'hn': 'Honduras', 'ni': 'Nicaragua', 'pa': 'Panamá',
                'do': 'República Dominicana', 'pr': 'Puerto Rico', 'es': 'España', 'mx': 'México'
            };
            
            for (const codigo of paises) {
                try {
                    const canales = await cargarListaM3U(`https://iptv-org.github.io/iptv/countries/${codigo}.m3u`, nombres[codigo]);
                    todosLosCanales = todosLosCanales.concat(canales);
                } catch (error) {
                    console.error(`Error cargando ${codigo}:`, error);
                }
            }
            
            try {
                const deportes = await cargarListaM3U('https://iptv-org.github.io/iptv/categories/sports.m3u', 'Deportes');
                todosLosCanales = todosLosCanales.concat(deportes);
            } catch (error) {
                console.error('Error cargando deportes:', error);
            }
            
            return todosLosCanales;
        }

        // ==================== RENDERIZAR CANALES (Estilo Netflix) ====================
        function renderChannels(canales) {
            canalesFiltrados = canales;
            
            const porPais = {};
            canales.forEach(canal => {
                if (!porPais[canal.pais]) porPais[canal.pais] = [];
                porPais[canal.pais].push(canal);
            });
            
            const paisesOrdenados = Object.keys(porPais).sort();
            let html = '';
            
            for (const pais of paisesOrdenados) {
                html += `<div class="country-group" data-pais="${pais}">
                    <div class="country-title">${pais}</div>`;
                
                porPais[pais].forEach(canal => {
                    const logoHtml = canal.logo ? 
                        `<img src="${canal.logo}" alt="${canal.nombre}" onerror="this.outerHTML='<span class=\\'fallback\\'>${canal.nombre.charAt(0)}</span>'">` : 
                        `<span class="fallback">${canal.nombre.charAt(0)}</span>`;
                    
                    const tipo = canal.tipo || 'm3u8';
                    const nombreSanitizado = canal.nombre.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    const urlSanitizada = canal.url.replace(/'/g, "\\'");
                    
                    html += `
                        <div class="channel-item" data-nombre="${canal.nombre.toLowerCase()}" data-url="${urlSanitizada}" data-nombre-original="${nombreSanitizado}" data-tipo="${tipo}">
                            <div class="channel-logo">${logoHtml}</div>
                            <span class="channel-name">${canal.nombre}</span>
                            <button class="btn-play" onclick="event.stopPropagation(); loadChannel('${urlSanitizada}', '${nombreSanitizado}', '${tipo}')">
                                <i class="fas fa-play"></i> Ver
                            </button>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            
            document.getElementById('channelsList').innerHTML = html;
            actualizarStats();
            
            document.querySelectorAll('.channel-item').forEach(item => {
                item.addEventListener('click', function() {
                    loadChannel(this.dataset.url, this.dataset.nombreOriginal, this.dataset.tipo);
                });
            });
            
            aplicarBusqueda();
        }

        // ==================== ACTUALIZAR ESTADÍSTICAS ====================
        function actualizarStats() {
            const total = document.querySelectorAll('.channel-item:not(.hidden)').length;
            const totalGeneral = document.querySelectorAll('.channel-item').length;
            document.getElementById('stats').innerHTML = `📊 ${total} canales disponibles`;
        }

        // ==================== BUSCAR ====================
        function aplicarBusqueda() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            
            document.querySelectorAll('.channel-item').forEach(item => {
                const nombre = item.dataset.nombre || '';
                const isVisible = !searchTerm || nombre.includes(searchTerm);
                item.classList.toggle('hidden', !isVisible);
            });
            
            document.querySelectorAll('.country-group').forEach(group => {
                const visibleItems = group.querySelectorAll('.channel-item:not(.hidden)');
                group.style.display = visibleItems.length > 0 ? '' : 'none';
            });
            
            actualizarStats();
        }

        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', function() {
                clearTimeout(timeoutBusqueda);
                timeoutBusqueda = setTimeout(aplicarBusqueda, 150);
            });
        }

        // ==================== REPRODUCIR CANAL ====================
        function loadChannel(url, channelName, tipo = 'm3u8') {
            const loadingMsg = document.getElementById('loadingMessage');
            const video = document.getElementById('videoPlayer');
            const iframe = document.getElementById('dmIframe');
            const currentChannel = document.getElementById('currentChannel');
            
            // Limpiar estado anterior
            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }
            if (video.src) {
                video.pause();
                video.removeAttribute('src');
                video.load();
            }
            if (iframe) {
                iframe.src = '';
                iframe.style.display = 'none';
            }
            
            video.style.display = 'block';
            loadingMsg.style.display = 'block';
            currentChannel.innerHTML = `
                <span class="name">${channelName}</span>
                <span class="status">⏳ Conectando...</span>
            `;
            
            // Resaltar activo
            document.querySelectorAll('.channel-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.nombreOriginal === channelName) {
                    item.classList.add('active');
                }
            });
            
            // Detectar Dailymotion
            const dmMatch = url.match(/\/video\/([a-z0-9]+)/i);
            if (dmMatch || tipo === 'dailymotion') {
                const videoId = dmMatch ? dmMatch[1] : null;
                if (videoId) {
                    iframe.style.display = 'block';
                    video.style.display = 'none';
                    iframe.src = `https://geo.dailymotion.com/player.html?video=${videoId}&autoplay=1`;
                    loadingMsg.style.display = 'none';
                    currentChannel.innerHTML = `
                        <span class="name">${channelName}</span>
                        <span class="status"><span class="live">● EN VIVO</span> · Dailymotion</span>
                    `;
                    return;
                }
            }
            
            // M3U8
            if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    currentHls = new Hls({ debug: false, enableWorker: true });
                    currentHls.loadSource(url);
                    currentHls.attachMedia(video);
                    currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                        loadingMsg.style.display = 'none';
                        currentChannel.innerHTML = `
                            <span class="name">${channelName}</span>
                            <span class="status"><span class="live">● EN VIVO</span> · HLS</span>
                        `;
                        video.play().catch(e => console.error('Error:', e));
                    });
                    currentHls.on(Hls.Events.ERROR, () => {
                        loadingMsg.style.display = 'none';
                        currentChannel.innerHTML = `
                            <span class="name">${channelName}</span>
                            <span class="status">❌ Error de stream</span>
                        `;
                    });
                } else {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => {
                        loadingMsg.style.display = 'none';
                        currentChannel.innerHTML = `
                            <span class="name">${channelName}</span>
                            <span class="status"><span class="live">● EN VIVO</span></span>
                        `;
                        video.play();
                    }, { once: true });
                }
            } else if (url.startsWith('http')) {
                loadingMsg.style.display = 'none';
                currentChannel.innerHTML = `
                    <span class="name">${channelName}</span>
                    <span class="status">🔗 <a href="${url}" target="_blank" style="color:#e50914;">Abrir en nueva pestaña</a></span>
                `;
            } else {
                loadingMsg.style.display = 'none';
                currentChannel.innerHTML = `
                    <span class="name">${channelName}</span>
                    <span class="status">❌ Formato no soportado</span>
                `;
            }
        }

        // ==================== URL PERSONALIZADA ====================
        function setupCustomUrl() {
            const customUrl = document.getElementById('customUrl');
            const playCustom = document.getElementById('playCustom');
            
            playCustom.onclick = () => {
                const input = customUrl.value.trim();
                if (!input) return;
                if (input.match(/^x[a-z0-9]+$/i)) {
                    loadChannel(`https://www.dailymotion.com/video/${input}`, "URL Personalizada", "dailymotion");
                } else {
                    loadChannel(input, "URL Personalizada", "m3u8");
                }
            };
            
            customUrl.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const input = customUrl.value.trim();
                    if (!input) return;
                    if (input.match(/^x[a-z0-9]+$/i)) {
                        loadChannel(`https://www.dailymotion.com/video/${input}`, "URL Personalizada", "dailymotion");
                    } else {
                        loadChannel(input, "URL Personalizada", "m3u8");
                    }
                }
            });
        }

        // ==================== INICIALIZAR ====================
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🎬 Iniciando SpayCine TV...');
            
            // Cargar canales
            const canales = await cargarTodosLosCanales();
            canalesData = canales;
            renderChannels(canales);
            setupSearch();
            setupCustomUrl();
            
            console.log(`✅ ${canales.length} canales cargados`);
        });
    </script>
</body>
</html>
