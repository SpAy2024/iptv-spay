<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SpayCine - Canales TV, Películas, Series y Anime</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET Y BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0e27;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        
        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        /* ===== SIDEBAR ===== */
        .sidebar {
            background: #0f1328;
            height: 100vh;
            overflow-y: auto;
            padding: 20px 16px;
            border-right: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
        }
        
        /* ===== LOGO ===== */
        .logo {
            font-size: 1.4em;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo span { color: #e50914; }
        .logo i { font-size: 1.2em; color: #e50914; }

        /* ===== NAVEGACIÓN ===== */
        .nav-tabs-custom {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .nav-tab {
            background: rgba(255,255,255,0.06);
            border: none;
            color: rgba(255,255,255,0.6);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.8em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
            min-width: 60px;
            letter-spacing: 0.3px;
        }
        .nav-tab:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .nav-tab.active { 
            background: #e50914; 
            color: #fff; 
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
        }

        /* ===== BÚSQUEDA ===== */
        #searchInput {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 30px;
            padding: 10px 18px;
            font-size: 0.85em;
            width: 100%;
            color: #fff;
            transition: all 0.3s;
            margin-bottom: 14px;
        }
        #searchInput::placeholder { color: rgba(255,255,255,0.35); }
        #searchInput:focus { 
            outline: none; 
            border-color: #e50914;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.15);
        }

        /* ===== FILTROS ===== */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
        }
        .filter-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: rgba(255,255,255,0.6);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.7em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        .filter-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
        .filter-btn.active { 
            background: #e50914; 
            color: #fff; 
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.2);
        }

        /* ===== PAÍSES ===== */
        .country-group {
            margin-bottom: 18px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.04);
            transition: all 0.3s;
        }
        .country-group:hover { background: rgba(255,255,255,0.06); }
        .country-title {
            font-size: 1em;
            font-weight: 700;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid rgba(229, 9, 20, 0.3);
            color: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.2px;
        }
        .country-title .emoji { font-size: 1.1em; }

        /* ===== CANALES ===== */
        .channel-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            margin: 6px 0;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            gap: 12px;
            border: 1px solid transparent;
        }
        .channel-item:hover {
            background: rgba(255,255,255,0.09);
            transform: translateX(4px);
            border-color: rgba(255,255,255,0.08);
        }
        .channel-item.active {
            background: rgba(229, 9, 20, 0.15);
            border-color: rgba(229, 9, 20, 0.3);
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.05);
        }
        .channel-item.hidden { display: none; }

        .channel-logo {
            width: 38px;
            height: 38px;
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .channel-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .channel-logo .fallback {
            font-size: 16px;
            font-weight: 700;
            color: rgba(255,255,255,0.3);
        }

        .channel-name {
            flex: 1;
            font-size: 0.8em;
            font-weight: 500;
            line-height: 1.2;
            color: rgba(255,255,255,0.85);
            letter-spacing: -0.1px;
        }

        .btn-play {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 5px 14px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 0.7em;
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.3px;
        }
        .btn-play:hover {
            background: #e50914;
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
        }
        .btn-play i { font-size: 0.7em; }

        /* ===== PELÍCULAS/SERIES GRID ===== */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            padding: 5px 0;
            max-height: calc(100vh - 320px);
            overflow-y: auto;
        }
        .movie-grid::-webkit-scrollbar { width: 4px; }
        .movie-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
        
        .movie-card {
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .movie-card:hover { 
            transform: scale(1.04); 
            background: rgba(255,255,255,0.12);
            border-color: #e50914;
            box-shadow: 0 8px 30px rgba(229, 9, 20, 0.15);
        }
        .movie-card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }
        .movie-card .title {
            font-size: 0.7em;
            padding: 8px 6px 4px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: rgba(255,255,255,0.9);
        }
        .movie-card .year {
            font-size: 0.6em;
            color: rgba(255,255,255,0.4);
            padding-bottom: 8px;
        }

        /* ===== DETALLE ===== */
        .detalle-contenido {
            padding: 10px;
        }
        .detalle-contenido h4 {
            color: #fff;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 1.1em;
        }
        .detalle-contenido .sub {
            color: rgba(255,255,255,0.4);
            font-size: 0.8em;
        }
        .servidores-lista {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .servidor-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.7em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .servidor-btn:hover {
            background: #e50914;
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
        }
        .episodio-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            margin: 4px 0;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            gap: 12px;
        }
        .episodio-item:hover { background: rgba(255,255,255,0.08); }
        .episodio-item .num { 
            font-weight: 700; 
            color: #e50914;
            min-width: 30px;
            font-size: 0.85em;
        }
        .episodio-item .ep-titulo { flex: 1; font-size: 0.8em; }

        /* ===== REPRODUCTOR ===== */
        .player-area {
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .player-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }
        #videoPlayer {
            width: 100%;
            height: 100%;
            background: #000;
        }
        #dmIframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        /* ===== INFO CANAL ACTUAL ===== */
        .current-channel {
            position: absolute;
            bottom: 60px;
            left: 30px;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.85em;
            z-index: 10;
            border-left: 3px solid #e50914;
            pointer-events: none;
            max-width: 70%;
            transition: all 0.3s;
        }
        .current-channel .name {
            font-weight: 700;
            font-size: 1.1em;
            display: block;
        }
        .current-channel .status {
            font-size: 0.75em;
            color: rgba(255,255,255,0.5);
        }
        .current-channel .status .live {
            color: #e50914;
            font-weight: 600;
        }

        /* ===== LOADING ===== */
        .loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            color: #fff;
            padding: 20px 35px;
            border-radius: 12px;
            z-index: 20;
            display: none;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .loading-message .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== ESTADÍSTICAS ===== */
        .stats {
            text-align: center;
            margin-top: 12px;
            padding: 8px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            font-size: 0.7em;
            color: rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.04);
        }

        /* ===== URL PERSONALIZADA ===== */
        .custom-url-section {
            margin-top: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .custom-url-section input {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 30px;
            padding: 8px 14px;
            width: 100%;
            margin-bottom: 6px;
            font-size: 0.75em;
            color: #fff;
        }
        .custom-url-section input::placeholder { color: rgba(255,255,255,0.3); }
        .custom-url-section input:focus {
            outline: none;
            border-color: #e50914;
        }
        .custom-url-section button {
            background: rgba(255,255,255,0.08);
            border: none;
            color: #fff;
            width: 100%;
            padding: 6px;
            border-radius: 30px;
            font-size: 0.75em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .custom-url-section button:hover {
            background: #e50914;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.3);
        }

        /* ===== LOADING INICIAL ===== */
        .initial-load {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex-direction: column;
            gap: 12px;
            color: rgba(255,255,255,0.3);
        }
        .initial-load .spinner {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar { height: 45vh; padding: 14px 12px; }
            .player-area { height: 55vh; }
            .channel-logo { width: 32px; height: 32px; font-size: 12px; }
            .channel-name { font-size: 0.7em; }
            .btn-play { padding: 4px 10px; font-size: 0.6em; }
            .nav-tab { font-size: 0.65em; padding: 6px 12px; }
            .logo { font-size: 1.1em; }
            .current-channel { bottom: 30px; left: 15px; padding: 8px 14px; font-size: 0.75em; max-width: 85%; }
            .current-channel .name { font-size: 0.95em; }
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
            .movie-card img { height: 120px; }
            .movie-card .title { font-size: 0.6em; }
            .filter-btn { font-size: 0.6em; padding: 3px 10px; }
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- ===== SIDEBAR ===== -->
            <div class="col-md-4 col-lg-3 sidebar">
                <!-- Logo -->
                <div class="logo">
                    <i class="fas fa-play-circle"></i>
                    Spay<span>Cine</span>
                </div>

                <!-- Navegación -->
                <div class="nav-tabs-custom">
                    <button class="nav-tab active" data-section="tv">📺 TV</button>
                    <button class="nav-tab" data-section="peliculas">🎥 Películas</button>
                    <button class="nav-tab" data-section="series">📺 Series</button>
                    <button class="nav-tab" data-section="anime">🎌 Anime</button>
                </div>

                <!-- Búsqueda -->
                <input type="text" id="searchInput" placeholder="🔍 Buscar canal, película o serie...">

                <!-- Filtros (solo para TV) -->
                <div class="filters" id="filterContainer">
                    <button class="filter-btn active" data-filter="all">🌐 Todos</button>
                    <button class="filter-btn" data-filter="noticias">📰 Noticias</button>
                    <button class="filter-btn" data-filter="deportes">⚽ Deportes</button>
                    <button class="filter-btn" data-filter="entretenimiento">🎬 Entretenimiento</button>
                    <button class="filter-btn" data-filter="musica">🎵 Música</button>
                    <button class="filter-btn" data-filter="cultural">🎭 Cultural</button>
                </div>

                <!-- Contenedor de contenido -->
                <div id="contentContainer">
                    <div id="channelsList">
                        <div class="initial-load">
                            <div class="spinner"></div>
                            <span>Cargando canales...</span>
                        </div>
                    </div>
                </div>

                <!-- Estadísticas -->
                <div class="stats" id="stats">📊 Cargando...</div>

                <!-- URL Personalizada -->
                <div class="custom-url-section">
                    <input type="text" id="customUrl" placeholder="🔗 URL M3U8 o ID Dailymotion (ej: x84eirw)">
                    <button id="playCustom">▶ Probar URL</button>
                </div>
            </div>

            <!-- ===== REPRODUCTOR ===== -->
            <div class="col-md-8 col-lg-9 player-area">
                <div class="player-container">
                    <video id="videoPlayer" controls preload="auto" style="display: block;"></video>
                    <iframe id="dmIframe" allow="autoplay; fullscreen"></iframe>
                    
                    <div id="currentChannel" class="current-channel">
                        <span class="name">⚡ Sin selección</span>
                        <span class="status">Selecciona un canal para comenzar</span>
                    </div>
                    
                    <div id="loadingMessage" class="loading-message">
                        <div class="spinner"></div>
                        <span>Cargando stream...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        // ==================== CONFIGURACIÓN ====================
        const TMDB_API_KEY = '55c0bb848e296dd8d81046079236067d';
        const TMDB_BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_BASE = 'https://image.tmdb.org/t/p/w200';
        const API_BASE = 'https://spaycine.xyz/api';
        const PROXY_URL = 'https://iptv-spay.onrender.com/proxy?url=';

        // ==================== VARIABLES GLOBALES ====================
        let currentHls = null;
        let canalesData = [];
        let seccionActual = 'tv';
        let categoriaActual = 'all';
        let timeoutBusqueda = null;
        let contenidoActual = null;

        // ==================== PAÍSES ====================
        const PAISES = [
            { codigo: 'bo', nombre: 'Bolivia', emoji: '🇧🇴' },

            { codigo: 'ec', nombre: 'Ecuador', emoji: '🇪🇨' },
            { codigo: 'py', nombre: 'Paraguay', emoji: '🇵🇾' },

            { codigo: 'uy', nombre: 'Uruguay', emoji: '🇺🇾' },
            { codigo: 've', nombre: 'Venezuela', emoji: '🇻🇪' },
            { codigo: 'cr', nombre: 'Costa Rica', emoji: '🇨🇷' },

            { codigo: 'es', nombre: 'España', emoji: '🇪🇸' },

        // ==================== MIS CANALES DE DAILYMOTION ====================
        const misCanalesDailymotion = [

            { nombre: "RED UNO CBBA HD", pais: "Bolivia", logo: "https://i.postimg.cc/NM6C0WZy/RED-UNO-CBBA-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/xa0qka8", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "RED UNO SCZ HD", pais: "Bolivia", logo: "https://i.postimg.cc/6QRYHkWk/RED-UNO-SC-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/x9n2qyk", tipo: "dailymotion", categoria: "noticias" },

        ];

        // ==================== FUNCIONES DE API (SpayCine) ====================
        async function obtenerPeliculas() {
            try {
                const response = await fetch(`${API_BASE}/listar_contenido.php?tipo=pelicula`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('Error cargando películas:', error);
                return [];
            }
        }

        async function obtenerSeries() {
            try {
                const response = await fetch(`${API_BASE}/listar_contenido.php?tipo=serie`);

        async function extraerM3U8DesdeServidor(urlServidor) {
            try {
                console.log('🔍 Extrayendo M3U8 desde:', urlServidor);
                const proxyUrl = `${PROXY_URL}${encodeURIComponent(urlServidor)}`;
                const response = await fetch(proxyUrl);
                const html = await response.text();
                
                const patrones = [
                    /https?:\/\/[^\s"']+\.m3u8[^\s"']*/i,
                    /"file":"([^"]+\.m3u8[^"]*)"/i,
                    /'file':'([^']+\.m3u8[^']*)'/i,
                    /src=["']([^"']+\.m3u8[^"']*)["']/i,
                    /url=["']([^"']+\.m3u8[^"']*)["']/i,
                    /source=["']([^"']+\.m3u8[^"']*)["']/i
                ];
                
                for (const patron of patrones) {
                    const match = html.match(patron);
                    if (match) {
                        const url = match[1] || match[0];
                        if (url && url.includes('.m3u8')) {
                            console.log('✅ M3U8 encontrado:', url);
                            return url;
                        }
                    }
                }
                
                console.log('⚠️ No se encontró M3U8 en la página');
                return null;
            } catch (error) {
                console.error('Error extrayendo M3U8:', error);
                return null;
            }
        }

        // ==================== CARGAR LISTA M3U ====================
        async function cargarListaM3U(url, paisOrigen) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const m3uContent = await response.text();
                return parsearM3U(m3uContent, paisOrigen);
            } catch (error) {
                console.error(`Error cargando ${url}:`, error);
                return [];
            }
        }

        function parsearM3U(content, paisOrigen) {
            const lines = content.split('\n');
            const canales = [];
            let currentChannel = null;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    const lastComma = line.lastIndexOf(',');
                    const nombre = lastComma !== -1 ? line.substring(lastComma + 1).trim() : 'Canal sin nombre';
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const logo = logoMatch ? logoMatch[1] : '';
                    const idMatch = line.match(/tvg-id="([^"]*)"/);
                    const id = idMatch ? idMatch[1] : '';
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    const grupo = groupMatch ? groupMatch[1] : '';
                    let categoria = detectarCategoria(nombre, grupo);
                    
                    currentChannel = {
                        id: id,
                        nombre: nombre,
                        pais: paisOrigen,
                        logo: logo,
                        url: '',
                        tipo: 'm3u8',
                        categoria: categoria,
                        grupo: grupo
                    };
                } else if (line && !line.startsWith('#') && currentChannel) {
                    currentChannel.url = line;
                    if (currentChannel.url.startsWith('http')) {
                        canales.push(currentChannel);
                    }
                    currentChannel = null;
                }
            }
            return canales;
        }

        function detectarCategoria(nombre, grupo) {
            const texto = (nombre + ' ' + grupo).toLowerCase();
            const palabrasClave = {
                'noticias': ['noticia', 'news', 'informe', 'actualidad', 'cnn', 'bbc', 'telefe noticias', 'el trece', 'tvn', 'canal 13', 'red uno', 'unitel', 'atb', 'telesur'],
                'deportes': ['deporte', 'sport', 'fútbol', 'futbol', 'gol', 'espn', 'tyc', 'fox sports', 'goal', 'racing', 'boca', 'river', 'liga', 'champions', 'uefa', 'libertadores', 'sudamericana', 'nfl', 'nba', 'mlb', 'tennis', 'tenis', 'motogp', 'formula', 'f1', 'automovilismo', 'boxeo', 'ufc', 'wwe', 'lucha', 'baseball', 'beisbol', 'basketball', 'baloncesto', 'deportes', 'sports', 'dazn'],
                'entretenimiento': ['entretenimiento', 'series', 'películas', 'pelicula', 'cine', 'telefe', 'el trece', 'entreten', 'show', 'telenovela'],
                'musica': ['música', 'musica', 'music', 'mtv', 'viva', 'radio', 'sound'],
                'cultural': ['cultural', 'educativo', 'educación', 'documental', 'history', 'discovery', 'cultura']
            };
            for (const [categoria, palabras] of Object.entries(palabrasClave)) {
                for (const palabra of palabras) {
                    if (texto.includes(palabra)) return categoria;
                }
            }
            return 'entretenimiento';
        }

        // ==================== REPRODUCIR DESDE SERVIDOR ====================
        async function reproducirDesdeServidor(servidor, titulo) {
            const loadingMsg = document.getElementById('loadingMessage');
            loadingMsg.style.display = 'block';
            document.getElementById('currentChannel').innerHTML = `<span class="name">${titulo}</span><span class="status">⏳ Extrayendo stream...</span>`;
            
            const m3u8Url = await extraerM3U8DesdeServidor(servidor.url);
            
            if (m3u8Url) {
                const video = document.getElementById('videoPlayer');
                const iframe = document.getElementById('dmIframe');
                iframe.style.display = 'none';
                video.style.display = 'block';
                
                if (currentHls) { currentHls.destroy(); currentHls = null; }
                if (video.src) { video.pause(); video.removeAttribute('src'); video.load(); }
                
                if (Hls.isSupported()) {
                    currentHls = new Hls({ debug: false, enableWorker: true });
                    currentHls.loadSource(m3u8Url);
                    currentHls.attachMedia(video);
                    currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                        loadingMsg.style.display = 'none';
                        document.getElementById('currentChannel').innerHTML = `<span class="name">${titulo}</span><span class="status"><span class="live">● EN VIVO</span> · ${servidor.server}</span>`;
                        video.play().catch(e => console.error(e));
                    });
                    currentHls.on(Hls.Events.ERROR, () => {
                        loadingMsg.style.display = 'none';
                        document.getElementById('currentChannel').innerHTML = `<span class="name">${titulo}</span><span class="status">❌ Error de stream</span>`;
                    });
                } else {
                    video.src = m3u8Url;
                    video.addEventListener('loadedmetadata', () => {
                        loadingMsg.style.display = 'none';
                        document.getElementById('currentChannel').innerHTML = `<span class="name">${titulo}</span><span class="status"><span class="live">● REPRODUCIENDO</span></span>`;
                        video.play();
                    }, { once: true });
                }
            } else {
                loadingMsg.style.display = 'none';
                document.getElementById('currentChannel').innerHTML = `<span class="name">${titulo}</span><span class="status">❌ No se pudo obtener el stream</span>`;
            }
        }

        // ==================== BUSQUEDA TMDB ====================
        async function buscarTMDB(query, tipo) {
            if (!query.trim()) return [];
            let endpoint = '';
            if (tipo === 'peliculas') endpoint = 'search/movie';
            else if (tipo === 'series') endpoint = 'search/tv';
            else if (tipo === 'anime') {
                const url = `${TMDB_BASE_URL}/search/tv?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&with_genres=16`;
                return buscarGenerico(url);
            }
            const url = `${TMDB_BASE_URL}/${endpoint}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&language=es`;
            return buscarGenerico(url);
        }

        async function buscarTrending(tipo) {
            let endpoint = '';
            if (tipo === 'peliculas') endpoint = 'trending/movie/week';
            else if (tipo === 'series') endpoint = 'trending/tv/week';
            else if (tipo === 'anime') endpoint = 'discover/tv?with_genres=16&sort_by=popularity.desc';
            const url = `${TMDB_BASE_URL}/${endpoint}?api_key=${TMDB_API_KEY}&language=es`;
            return buscarGenerico(url);
        }

        async function buscarGenerico(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                return data.results || [];
            } catch (error) {
                console.error('Error buscando en TMDB:', error);
                return [];
            }
        }

        // ==================== CARGAR SECCIÓN ====================
        async function cargarSeccion(seccion) {
            seccionActual = seccion;
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.section === seccion);
            });
            
            const searchInput = document.getElementById('searchInput');
            const filterContainer = document.getElementById('filterContainer');
            
            if (seccion === 'tv') {
                filterContainer.style.display = 'flex';
                searchInput.placeholder = '🔍 Buscar canal...';
                searchInput.value = '';
                renderTV(canalesData);
                return;
            } else {
                filterContainer.style.display = 'none';
                searchInput.placeholder = seccion === 'peliculas' ? '🔍 Buscar película...' : seccion === 'series' ? '🔍 Buscar serie...' : '🔍 Buscar anime...';
                searchInput.value = '';
            }
            
            document.getElementById('contentContainer').innerHTML = `<div class="initial-load"><div class="spinner"></div><span>Cargando ${seccion}...</span></div>`;
            
            // Primero intentar con la API de SpayCine
            if (seccion === 'peliculas') {
                const peliculas = await obtenerPeliculas();
                if (peliculas && peliculas.length > 0) {
                    renderContenido(peliculas, seccion);
                    return;
                }
            } else if (seccion === 'series' || seccion === 'anime') {
                const series = await obtenerSeries();
                if (series && series.length > 0) {
                    renderContenido(series, seccion);
                    return;
                }
            }
            
            // Fallback a TMDB
            const resultados = await buscarTrending(seccion);
            renderContenido(resultados, seccion);
        }

        // ==================== REPRODUCIR CANAL ====================
        function loadChannel(url, channelName, tipo = 'm3u8') {
            const loadingMsg = document.getElementById('loadingMessage');
            const video = document.getElementById('videoPlayer');
            const iframe = document.getElementById('dmIframe');
            const currentChannel = document.getElementById('currentChannel');
            
            if (currentHls) { currentHls.destroy(); currentHls = null; }
            if (video.src) { video.pause(); video.removeAttribute('src'); video.load(); }
            if (iframe) { iframe.src = ''; iframe.style.display = 'none'; }
            
            video.style.display = 'block';
            loadingMsg.style.display = 'block';
            currentChannel.innerHTML = `<span class="name">${channelName}</span><span class="status">⏳ Conectando...</span>`;
            
            document.querySelectorAll('.channel-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.nombreOriginal === channelName) item.classList.add('active');
            });
            
            // Dailymotion
            const dmMatch = url.match(/\/video\/([a-z0-9]+)/i);
            if (dmMatch || tipo === 'dailymotion') {
                const videoId = dmMatch ? dmMatch[1] : null;
                if (videoId) {
                    iframe.style.display = 'block';
                    video.style.display = 'none';
                    iframe.src = `https://geo.dailymotion.com/player.html?video=${videoId}&autoplay=1`;
                    loadingMsg.style.display = 'none';
                    currentChannel.innerHTML = `<span class="name">${channelName}</span><span class="status"><span class="live">● EN VIVO</span> · Dailymotion</span>`;
                    return;
                }
            }
            
            // YouTube
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('v=')) videoId = url.split('v=')[1].split('&')[0];
                else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].split('?')[0];
                if (videoId) {
                    iframe.style.display = 'block';
                    video.style.display = 'none';
                    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    loadingMsg.style.display = 'none';
                    currentChannel.innerHTML = `<span class="name">${channelName}</span><span class="status"><span class="live">● REPRODUCIENDO</span> · YouTube</span>`;
                    return;
                }
            }
            
            // M3U8
            if (url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    currentHls = new Hls({ debug: false, enableWorker: true });
                    currentHls.loadSource(url);
                    currentHls.attachMedia(video);
                    currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                        loadingMsg.style.display = 'none';
                        currentChannel.innerHTML = `<span class="name">${channelName}</span><span class="status"><span class="live">● EN VIVO</span> · HLS</span>`;
                        video.play().catch(e => console.error('Error:', e));
                    });
                    currentHls.on(Hls.Events.ERROR, () => {
                        loadingMsg.style.display = 'none';
                        currentChannel.innerHTML = `<span class="name">${channelName}</span><span class="status">❌ Error de stream</span>`;
                    });
                } else {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => {
                        loadingMsg.style.display = 'none';
                        currentChannel.innerHTML = `<span class="name">${channelName}</span><span class="status"><span class="live">● EN VIVO</span></span>`;
                        video.play();
                    }, { once: true });
                }
            } else if (url.startsWith('http')) {
                loadingMsg.style.display = 'none';
                currentChannel.innerHTML = `<span class="name">${channelName}</span><span class="status">🔗 <a href="${url}" target="_blank" style="color:#e50914;">Abrir en nueva pestaña</a></span>`;
            } else {
                loadingMsg.style.display = 'none';
                currentChannel.innerHTML = `<span class="name">${channelName}</span><span class="status">❌ Formato no soportado</span>`;
            }
        }

        // ==================== URL PERSONALIZADA ====================
        function setupCustomUrl() {
            const customUrl = document.getElementById('customUrl');
            const playCustom = document.getElementById('playCustom');
            
            playCustom.onclick = () => {
                const input = customUrl.value.trim();
                if (!input) return;
                if (input.match(/^x[a-z0-9]+$/i)) {
                    loadChannel(`https://www.dailymotion.com/video/${input}`, "URL Personalizada", "dailymotion");
                } else {
                    loadChannel(input, "URL Personalizada", "m3u8");
                }
            };
            
            customUrl.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const input = customUrl.value.trim();
                    if (!input) return;
                    if (input.match(/^x[a-z0-9]+$/i)) {
                        loadChannel(`https://www.dailymotion.com/video/${input}`, "URL Personalizada", "dailymotion");
                    } else {
                        loadChannel(input, "URL Personalizada", "m3u8");
                    }
                }
            });
        }

        // ==================== NAVEGACIÓN ====================
        function setupNavigation() {
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    cargarSeccion(this.dataset.section);
                });
            });
        }

        // ==================== INICIALIZAR ====================
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🎬 Iniciando SpayCine...');
            
            canalesData = await cargarTodosLosCanales();
            renderTV(canalesData);
            setupNavigation();
            setupSearch();
            setupFilters();
            setupCustomUrl();
            
            console.log(`✅ ${canalesData.length} canales cargados`);
        });
    </script>
</body>
</html>
