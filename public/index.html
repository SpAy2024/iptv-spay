<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpayCine TV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET Y BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0e27;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        
        /* ===== LAYOUT PRINCIPAL ===== */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #0f1328;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        /* ===== HEADER CON LOGO ===== */
        .app-header {
            padding: 12px 16px;
            background: #0f1328;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            min-height: 56px;
        }
        .app-header .logo {
            font-size: 1.4em;
            font-weight: 900;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-header .logo span { color: #e50914; }
        .app-header .logo i { font-size: 1.1em; color: #e50914; }
        .app-header .header-badge {
            font-size: 0.6em;
            color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.06);
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 500;
        }
        .app-header .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-header .header-actions .search-icon {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.6);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }
        .app-header .header-actions .search-icon:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }
        .app-header .header-actions .search-icon:active {
            background: #e50914;
            color: #fff;
        }

        /* ===== REPRODUCTOR ===== */
        .player-wrapper {
            flex: 1;
            background: #000;
            position: relative;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .player-wrapper video,
        .player-wrapper iframe {
            width: 100%;
            height: 100%;
            background: #000;
            border: none;
        }
        .player-wrapper iframe { display: none; }

        .player-overlay-info {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 10px;
            border-left: 3px solid #e50914;
            z-index: 5;
            display: none;
            max-width: 80%;
        }
        .player-overlay-info .overlay-name {
            font-weight: 700;
            font-size: 0.9em;
            color: #fff;
        }
        .player-overlay-info .overlay-status {
            font-size: 0.7em;
            color: rgba(255,255,255,0.4);
        }
        .player-overlay-info.active { display: block; }

        .modal-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            text-align: center;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 20px 30px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.04);
        }
        .modal-loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.06);
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        .modal-loading.active { display: block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== PAÍSES ===== */
        .countries-bar {
            padding: 10px 16px;
            background: #0f1328;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .countries-bar::-webkit-scrollbar { display: none; }
        .countries-bar .country-chip {
            display: inline-block;
            padding: 6px 16px;
            margin-right: 8px;
            background: rgba(255,255,255,0.06);
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 500;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .countries-bar .country-chip:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }
        .countries-bar .country-chip.active {
            background: #e50914;
            color: #fff;
            border-color: #e50914;
        }
        .countries-bar .country-chip .count {
            font-size: 0.7em;
            opacity: 0.5;
            margin-left: 4px;
        }

        /* ===== LISTA DE CANALES ===== */
        .channels-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
            background: #0f1328;
            -webkit-overflow-scrolling: touch;
        }
        .channels-list::-webkit-scrollbar { width: 3px; }
        .channels-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
        .channels-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }

        .channel-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid transparent;
        }
        .channel-item:active {
            background: rgba(255,255,255,0.08);
            transform: scale(0.98);
        }
        .channel-item.active {
            background: rgba(229, 9, 20, 0.12);
            border-color: rgba(229, 9, 20, 0.2);
        }
        .channel-item .logo {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.04);
            margin-right: 12px;
            padding: 4px;
        }
        .channel-item .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .channel-item .logo .fallback {
            font-size: 14px;
            font-weight: 700;
            color: rgba(255,255,255,0.2);
        }
        .channel-item .info {
            flex: 1;
            min-width: 0;
        }
        .channel-item .info .name {
            font-size: 0.85em;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-item .info .category {
            font-size: 0.6em;
            color: rgba(255,255,255,0.25);
            margin-top: 1px;
        }
        .channel-item .play-btn {
            background: rgba(255,255,255,0.06);
            border: none;
            color: rgba(255,255,255,0.3);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
            flex-shrink: 0;
        }
        .channel-item .play-btn:active {
            background: #e50914;
            color: #fff;
            transform: scale(0.9);
        }
        .channel-item.hidden { display: none; }

        /* ===== MODAL BÚSQUEDA ===== */
        .search-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: none;
            padding: 20px;
            flex-direction: column;
        }
        .search-modal.active { display: flex; }
        .search-modal .search-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .search-modal .search-header input {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 30px;
            padding: 12px 18px;
            font-size: 1em;
            color: #fff;
        }
        .search-modal .search-header input::placeholder { color: rgba(255,255,255,0.3); }
        .search-modal .search-header input:focus {
            outline: none;
            border-color: #e50914;
        }
        .search-modal .search-header .close-search {
            background: rgba(255,255,255,0.06);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.2em;
            cursor: pointer;
        }
        .search-modal .search-results {
            flex: 1;
            overflow-y: auto;
        }

        @media (min-width: 481px) {
            .app-container { max-width: 600px; }
        }
        @media (max-width: 480px) {
            .app-header .logo { font-size: 1.2em; }
            .app-header .header-badge { font-size: 0.5em; padding: 2px 8px; }
            .player-wrapper { min-height: 180px; }
            .countries-bar { padding: 8px 12px; }
            .countries-bar .country-chip { padding: 4px 12px; font-size: 0.7em; }
            .channels-list { padding: 8px 12px; }
            .channel-item { padding: 8px 10px; }
            .channel-item .logo { width: 34px; height: 34px; font-size: 12px; }
            .channel-item .info .name { font-size: 0.8em; }
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- ===== HEADER ===== -->
        <header class="app-header">
            <div class="logo">
                <i class="fas fa-play-circle"></i>
                Spay<span>Cine</span>
            </div>
            <div class="header-actions">
                <span class="header-badge">● EN VIVO</span>
                <button class="search-icon" id="headerSearchBtn">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </header>

        <!-- ===== REPRODUCTOR ===== -->
        <div class="player-wrapper" id="playerWrapper">
            <video id="videoPlayer" controls preload="auto"></video>
            <iframe id="iframePlayer" allow="autoplay; fullscreen"></iframe>
            
            <div class="player-overlay-info" id="playerOverlayInfo">
                <div class="overlay-name" id="overlayChannelName">Canal</div>
                <div class="overlay-status">● EN VIVO</div>
            </div>
            
            <div class="modal-loading" id="modalLoading">
                <div class="spinner"></div>
                <span>Cargando...</span>
            </div>
        </div>

        <!-- ===== PAÍSES ===== -->
        <div class="countries-bar" id="countriesBar"></div>

        <!-- ===== LISTA DE CANALES ===== -->
        <div class="channels-list" id="channelsList"></div>

        <!-- ===== MODAL BÚSQUEDA ===== -->
        <div class="search-modal" id="searchModal">
            <div class="search-header">
                <input type="text" id="searchInput" placeholder="🔍 Buscar canal...">
                <button class="close-search" id="closeSearch"><i class="fas fa-times"></i></button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        // ==================== CONFIGURACIÓN ====================
        const PROXY_URL = 'https://iptv-spay.onrender.com/proxy?url=';
        let currentHls = null;
        let canalesData = [];
        let paisActual = 'Todos';
        let currentChannelName = '';
        let currentChannelLogo = '';
        let isFullscreen = false;

        // ==================== CANALES ====================
        const misCanalesDailymotion = [
            { nombre: "RED UNO LPZ HD", pais: "Bolivia", logo: "https://i.postimg.cc/HWQ1JNbV/RED-UNO-LPZ-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/xa0fwio", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "RED UNO CBBA HD", pais: "Bolivia", logo: "https://i.postimg.cc/NM6C0WZy/RED-UNO-CBBA-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/xa0qka8", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "RED UNO SCZ HD", pais: "Bolivia", logo: "https://i.postimg.cc/6QRYHkWk/RED-UNO-SC-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/x9n2qyk", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "UNITEL BOLIVIA HD", pais: "Bolivia", logo: "https://i.ibb.co/pzVXZcg/UNITEL-BOLIVIA-VLC.jpg", url: "https://www.dailymotion.com/video/x7wzxiw", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "POV UNITEL HD", pais: "Bolivia", logo: "https://i.ibb.co/p3B7tSd/bolivia-hd-04.jpg", url: "https://www.dailymotion.com/video/x8eimg9", tipo: "dailymotion", categoria: "entretenimiento" },
            { nombre: "ATB BOLIVIA HD", pais: "Bolivia", logo: "https://i.postimg.cc/Y06y7NgW/ATB-BOLIVIA-HD.jpg", url: "https://www.dailymotion.com/video/x84eirw", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "TELESUR HD", pais: "Bolivia", logo: "https://i.postimg.cc/QxmZpWDL/T-sr-Vlc08.jpg", url: "https://www.dailymotion.com/video/x82ug5r", tipo: "dailymotion", categoria: "noticias" }
        ];

        const PAISES = [
            { codigo: 'bo', nombre: 'Bolivia', emoji: '🇧🇴' },
            { codigo: 'ar', nombre: 'Argentina', emoji: '🇦🇷' },
            { codigo: 'br', nombre: 'Brasil', emoji: '🇧🇷' },
            { codigo: 'cl', nombre: 'Chile', emoji: '🇨🇱' },
            { codigo: 'co', nombre: 'Colombia', emoji: '🇨🇴' },
            { codigo: 'ec', nombre: 'Ecuador', emoji: '🇪🇨' },
            { codigo: 'py', nombre: 'Paraguay', emoji: '🇵🇾' },
            { codigo: 'pe', nombre: 'Perú', emoji: '🇵🇪' },
            { codigo: 'uy', nombre: 'Uruguay', emoji: '🇺🇾' },
            { codigo: 've', nombre: 'Venezuela', emoji: '🇻🇪' },
            { codigo: 'cr', nombre: 'Costa Rica', emoji: '🇨🇷' },
            { codigo: 'sv', nombre: 'El Salvador', emoji: '🇸🇻' },
            { codigo: 'gt', nombre: 'Guatemala', emoji: '🇬🇹' },
            { codigo: 'hn', nombre: 'Honduras', emoji: '🇭🇳' },
            { codigo: 'ni', nombre: 'Nicaragua', emoji: '🇳🇮' },
            { codigo: 'pa', nombre: 'Panamá', emoji: '🇵🇦' },
            { codigo: 'do', nombre: 'República Dominicana', emoji: '🇩🇴' },
            { codigo: 'pr', nombre: 'Puerto Rico', emoji: '🇵🇷' },
            { codigo: 'es', nombre: 'España', emoji: '🇪🇸' },
            { codigo: 'mx', nombre: 'México', emoji: '🇲🇽' }
        ];

        // ==================== CARGAR LISTA M3U ====================
        async function cargarListaM3U(url, paisOrigen) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const m3uContent = await response.text();
                return parsearM3U(m3uContent, paisOrigen);
            } catch (error) {
                return [];
            }
        }

        function parsearM3U(content, paisOrigen) {
            const lines = content.split('\n');
            const canales = [];
            let currentChannel = null;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    const lastComma = line.lastIndexOf(',');
                    const nombre = lastComma !== -1 ? line.substring(lastComma + 1).trim() : 'Canal sin nombre';
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const logo = logoMatch ? logoMatch[1] : '';
                    const idMatch = line.match(/tvg-id="([^"]*)"/);
                    const id = idMatch ? idMatch[1] : '';
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    const grupo = groupMatch ? groupMatch[1] : '';
                    
                    let categoria = detectarCategoria(nombre, grupo);
                    if (grupo && (grupo.toLowerCase().includes('sport') || grupo.toLowerCase().includes('deporte'))) {
                        categoria = 'deportes';
                    }
                    
                    currentChannel = {
                        id: id,
                        nombre: nombre,
                        pais: paisOrigen,
                        logo: logo,
                        url: '',
                        tipo: 'm3u8',
                        categoria: categoria,
                        grupo: grupo
                    };
                } else if (line && !line.startsWith('#') && currentChannel) {
                    currentChannel.url = line;
                    if (currentChannel.url.startsWith('http')) {
                        canales.push(currentChannel);
                    }
                    currentChannel = null;
                }
            }
            return canales;
        }

        function detectarCategoria(nombre, grupo) {
            const texto = (nombre + ' ' + grupo).toLowerCase();
            const claves = {
                'noticias': ['noticia', 'news', 'informe', 'actualidad', 'cnn', 'bbc', 'telefe noticias', 'el trece', 'tvn', 'canal 13', 'red uno', 'unitel', 'atb', 'telesur'],
                'deportes': ['deporte', 'sport', 'fútbol', 'futbol', 'gol', 'espn', 'tyc', 'fox sports', 'goal', 'racing', 'boca', 'river', 'liga', 'champions', 'uefa', 'libertadores', 'sudamericana', 'nfl', 'nba', 'mlb', 'tennis', 'tenis', 'motogp', 'formula', 'f1'],
                'entretenimiento': ['entretenimiento', 'series', 'películas', 'pelicula', 'cine', 'telefe', 'el trece', 'entreten', 'show', 'telenovela'],
                'musica': ['música', 'musica', 'music', 'mtv', 'viva', 'radio'],
                'cultural': ['cultural', 'educativo', 'educación', 'documental', 'history', 'discovery']
            };
            for (const [categoria, palabras] of Object.entries(claves)) {
                for (const palabra of palabras) {
                    if (texto.includes(palabra)) return categoria;
                }
            }
            return 'entretenimiento';
        }

        // ==================== CARGAR TODOS LOS CANALES ====================
        async function cargarTodosLosCanales() {
            let todos = [...misCanalesDailymotion];
            console.log('📡 Cargando canales...');
            
            for (const pais of PAISES) {
                try {
                    const canales = await cargarListaM3U(`https://iptv-org.github.io/iptv/countries/${pais.codigo}.m3u`, pais.nombre);
                    console.log(`${pais.emoji} ${pais.nombre}: ${canales.length} canales`);
                    todos = todos.concat(canales);
                } catch (e) {}
            }
            
            try {
                const deportes = await cargarListaM3U('https://iptv-org.github.io/iptv/categories/sports.m3u', 'Deportes');
                console.log(`⚽ Deportes (iptv-org): ${deportes.length} canales`);
                deportes.forEach(c => c.categoria = 'deportes');
                todos = todos.concat(deportes);
            } catch (e) {
                console.error('Error cargando deportes iptv-org:', e);
            }
            
            try {
                const deportesArg = await cargarListaM3U('https://raw.githubusercontent.com/Kewsito/lista-deportes-argentina/refs/heads/main/lista.m3u8', 'Argentina');
                console.log(`⚽ Deportes Argentina (Kewsito): ${deportesArg.length} canales`);
                deportesArg.forEach(c => {
                    c.categoria = 'deportes';
                    c.pais = 'Argentina';
                });
                todos = todos.concat(deportesArg);
            } catch (e) {
                console.error('Error cargando deportes Argentina:', e);
            }
            
            try {
                const misCanales = await cargarListaM3U('https://raw.githubusercontent.com/SpAy2024/MisCanalesTV/refs/heads/main/mis_canales_tv.m3u', 'Internacional');
                console.log(`📺 Mis Canales TV: ${misCanales.length} canales`);
                misCanales.forEach(c => {
                    const nombreLower = c.nombre.toLowerCase();
                    if (nombreLower.includes('deporte') || nombreLower.includes('sport') || nombreLower.includes('espn') || nombreLower.includes('fox') || nombreLower.includes('tyc')) {
                        c.categoria = 'deportes';
                    } else if (nombreLower.includes('noticia') || nombreLower.includes('news') || nombreLower.includes('cnn') || nombreLower.includes('bbc')) {
                        c.categoria = 'noticias';
                    } else if (nombreLower.includes('cine') || nombreLower.includes('movie') || nombreLower.includes('film') || nombreLower.includes('series') || nombreLower.includes('hbo')) {
                        c.categoria = 'entretenimiento';
                    } else {
                        c.categoria = 'entretenimiento';
                    }
                    if (c.grupo) {
                        const grupoLower = c.grupo.toLowerCase();
                        if (grupoLower.includes('argentina')) c.pais = 'Argentina';
                        else if (grupoLower.includes('bolivia')) c.pais = 'Bolivia';
                        else if (grupoLower.includes('brasil')) c.pais = 'Brasil';
                        else if (grupoLower.includes('chile')) c.pais = 'Chile';
                        else if (grupoLower.includes('colombia')) c.pais = 'Colombia';
                        else if (grupoLower.includes('peru')) c.pais = 'Perú';
                        else if (grupoLower.includes('mexico')) c.pais = 'México';
                        else if (grupoLower.includes('espana')) c.pais = 'España';
                        else if (grupoLower.includes('eeuu') || grupoLower.includes('usa')) c.pais = 'EE.UU.';
                        else c.pais = 'Internacional';
                    } else {
                        c.pais = 'Internacional';
                    }
                });
                todos = todos.concat(misCanales);
            } catch (e) {
                console.error('Error cargando Mis Canales TV:', e);
            }
            
            console.log(`✅ Total canales: ${todos.length}`);
            return todos;
        }

        // ==================== RENDERIZAR PAÍSES ====================
        function renderCountries(canales) {
            const bar = document.getElementById('countriesBar');
            const counts = {};
            canales.forEach(c => { counts[c.pais] = (counts[c.pais] || 0) + 1; });
            
            const deportesCount = canales.filter(c => c.categoria === 'deportes').length;
            
            let html = `<span class="country-chip active" data-pais="Todos">🌐 Todos <span class="count">${canales.length}</span></span>`;
            
            if (deportesCount > 0) {
                html += `<span class="country-chip" data-pais="Deportes">⚽ Deportes <span class="count">${deportesCount}</span></span>`;
            }
            
            for (const p of PAISES) {
                const count = counts[p.nombre] || 0;
                if (count > 0) {
                    html += `<span class="country-chip" data-pais="${p.nombre}">${p.emoji} ${p.nombre} <span class="count">${count}</span></span>`;
                }
            }
            bar.innerHTML = html;

            bar.querySelectorAll('.country-chip').forEach(el => {
                el.addEventListener('click', function() {
                    bar.querySelectorAll('.country-chip').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    paisActual = this.dataset.pais;
                    filtrarCanales();
                });
            });
        }

        // ==================== RENDERIZAR CANALES ====================
        function renderChannels(canales) {
            const list = document.getElementById('channelsList');
            if (canales.length === 0) {
                list.innerHTML = '<div style="text-align:center;padding:30px;color:rgba(255,255,255,0.2);">No hay canales disponibles</div>';
                return;
            }
            let html = '';
            canales.forEach(c => {
                const logoHtml = c.logo ? `<img src="${c.logo}" onerror="this.outerHTML='<span class=\\'fallback\\'>${c.nombre.charAt(0)}</span>'">` : `<span class="fallback">${c.nombre.charAt(0)}</span>`;
                html += `
                    <div class="channel-item" data-pais="${c.pais}" data-url="${c.url.replace(/'/g, "\\'")}" data-nombre="${c.nombre.replace(/'/g, "\\'")}" data-tipo="${c.tipo}" data-logo="${c.logo || ''}" data-categoria="${c.categoria}">
                        <div class="logo">${logoHtml}</div>
                        <div class="info">
                            <div class="name">${c.nombre}</div>
                            <div class="category">${c.pais} · ${c.categoria}</div>
                        </div>
                        <button class="play-btn" onclick="event.stopPropagation(); reproducirCanal('${c.url.replace(/'/g, "\\'")}', '${c.nombre.replace(/'/g, "\\'")}', '${c.tipo}', '${c.logo || ''}')"><i class="fas fa-play"></i></button>
                    </div>
                `;
            });
            list.innerHTML = html;

            document.querySelectorAll('.channel-item').forEach(el => {
                el.addEventListener('click', function() {
                    const url = this.dataset.url;
                    const nombre = this.dataset.nombre;
                    const tipo = this.dataset.tipo;
                    const logo = this.dataset.logo;
                    reproducirCanal(url, nombre, tipo, logo);
                });
            });
            
            filtrarCanales();
        }

        // ==================== FILTRAR CANALES ====================
        function filtrarCanales() {
            const items = document.querySelectorAll('.channel-item');
            let visible = 0;
            items.forEach(item => {
                let match = false;
                if (paisActual === 'Todos') {
                    match = true;
                } else if (paisActual === 'Deportes') {
                    match = item.dataset.categoria === 'deportes';
                } else {
                    match = item.dataset.pais === paisActual;
                }
                item.classList.toggle('hidden', !match);
                if (match) visible++;
            });
            document.querySelectorAll('.country-chip').forEach(chip => {
                if (chip.classList.contains('active')) {
                    const count = chip.querySelector('.count');
                    if (count) count.textContent = visible;
                }
            });
        }

        // ==================== REPRODUCIR CANAL ====================
        function reproducirCanal(url, channelName, tipo = 'm3u8', logo = '') {
            const video = document.getElementById('videoPlayer');
            const iframe = document.getElementById('iframePlayer');
            const loading = document.getElementById('modalLoading');
            const overlay = document.getElementById('playerOverlayInfo');
            
            if (currentHls) { currentHls.destroy(); currentHls = null; }
            if (video.src) { video.pause(); video.removeAttribute('src'); video.load(); }
            if (iframe.src) { iframe.src = ''; iframe.style.display = 'none'; }
            
            video.style.display = 'none';
            iframe.style.display = 'none';
            loading.classList.add('active');
            overlay.classList.remove('active');
            
            currentChannelName = channelName;
            currentChannelLogo = logo;
            
            document.getElementById('overlayChannelName').textContent = channelName;
            
            cargarStream(url, channelName, tipo);
        }

        function cargarStream(url, channelName, tipo = 'm3u8') {
            const video = document.getElementById('videoPlayer');
            const iframe = document.getElementById('iframePlayer');
            const loading = document.getElementById('modalLoading');
            const overlay = document.getElementById('playerOverlayInfo');
            const overlayName = document.getElementById('overlayChannelName');
            
            const dmMatch = url.match(/\/video\/([a-z0-9]+)/i);
            if (dmMatch || tipo === 'dailymotion') {
                const videoId = dmMatch ? dmMatch[1] : null;
                if (videoId) {
                    video.style.display = 'none';
                    iframe.style.display = 'block';
                    iframe.src = `https://geo.dailymotion.com/player.html?video=${videoId}&autoplay=1`;
                    loading.classList.remove('active');
                    overlayName.textContent = channelName;
                    overlay.classList.add('active');
                    return;
                }
            }
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('v=')) videoId = url.split('v=')[1].split('&')[0];
                else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].split('?')[0];
                if (videoId) {
                    video.style.display = 'none';
                    iframe.style.display = 'block';
                    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    loading.classList.remove('active');
                    overlayName.textContent = channelName;
                    overlay.classList.add('active');
                    return;
                }
            }
            if (url.includes('.m3u8')) {
                video.style.display = 'block';
                iframe.style.display = 'none';
                if (Hls.isSupported()) {
                    currentHls = new Hls({ debug: false, enableWorker: true });
                    currentHls.loadSource(url);
                    currentHls.attachMedia(video);
                    currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                        loading.classList.remove('active');
                        overlayName.textContent = channelName;
                        overlay.classList.add('active');
                        // NO reproducir automáticamente
                        // video.play().catch(e => console.error(e)); // ← COMENTADO
                    });
                    currentHls.on(Hls.Events.ERROR, () => {
                        loading.classList.remove('active');
                        overlay.classList.remove('active');
                    });
                } else {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => {
                        loading.classList.remove('active');
                        overlayName.textContent = channelName;
                        overlay.classList.add('active');
                        // NO reproducir automáticamente
                        // video.play(); // ← COMENTADO
                    }, { once: true });
                }
            } else if (url.startsWith('http')) {
                loading.classList.remove('active');
                overlay.classList.remove('active');
                video.style.display = 'none';
                iframe.style.display = 'none';
                window.open(url, '_blank');
            } else {
                loading.classList.remove('active');
                overlay.classList.remove('active');
                video.style.display = 'none';
                iframe.style.display = 'none';
            }
        }

        // ==================== BÚSQUEDA ====================
        function setupSearch() {
            const modal = document.getElementById('searchModal');
            const closeBtn = document.getElementById('closeSearch');
            const input = document.getElementById('searchInput');
            const results = document.getElementById('searchResults');
            const headerSearchBtn = document.getElementById('headerSearchBtn');
            let searchTimeout;

            function abrirModal() {
                modal.classList.add('active');
                input.focus();
                mostrarResultados(input.value);
            }

            function cerrarModal() {
                modal.classList.remove('active');
            }

            headerSearchBtn.onclick = (e) => {
                e.stopPropagation();
                abrirModal();
            };

            closeBtn.onclick = (e) => {
                e.stopPropagation();
                cerrarModal();
            };

            modal.onclick = (e) => {
                if (e.target === modal) {
                    cerrarModal();
                }
            };

            input.oninput = function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    mostrarResultados(this.value);
                }, 150);
            };

            function mostrarResultados(termino) {
                const term = termino.toLowerCase().trim();
                const items = document.querySelectorAll('.channel-item:not(.hidden)');
                let html = '';
                let count = 0;
                
                if (!term) {
                    items.forEach(item => {
                        if (!item.classList.contains('hidden')) {
                            html += item.outerHTML;
                            count++;
                        }
                    });
                } else {
                    items.forEach(item => {
                        const nombre = item.dataset.nombre?.toLowerCase() || '';
                        if (nombre.includes(term)) {
                            html += item.outerHTML;
                            count++;
                        }
                    });
                }
                
                results.innerHTML = html || `<div style="text-align:center;padding:30px;color:rgba(255,255,255,0.2);">No se encontraron resultados para "${termino}"</div>`;
                
                results.querySelectorAll('.channel-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const url = this.dataset.url;
                        const nombre = this.dataset.nombre;
                        const tipo = this.dataset.tipo;
                        const logo = this.dataset.logo;
                        reproducirCanal(url, nombre, tipo, logo);
                        cerrarModal();
                    });
                });
            }
        }

        // ==================== INICIALIZAR ====================
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🎬 Iniciando SpayCine TV...');
            canalesData = await cargarTodosLosCanales();
            renderCountries(canalesData);
            renderChannels(canalesData);
            setupSearch();
            console.log(`✅ ${canalesData.length} canales cargados`);
        });
    </script>
