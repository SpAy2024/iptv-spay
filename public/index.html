<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SpayCine TV - Canales en vivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET Y BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0e27;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

        /* ===== SIDEBAR ===== */
        .sidebar {
            background: linear-gradient(180deg, #0f1328 0%, #0a0e27 100%);
            height: 100vh;
            overflow-y: auto;
            padding: 24px 18px;
            border-right: 1px solid rgba(255,255,255,0.04);
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }
        
        /* ===== LOGO ===== */
        .logo {
            font-size: 1.6em;
            font-weight: 900;
            letter-spacing: -0.8px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg, #e50914, #ff0f1f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(229, 9, 20, 0.15);
        }
        .logo i {
            font-size: 1.2em;
            color: #e50914;
            -webkit-text-fill-color: #e50914;
            filter: drop-shadow(0 0 10px rgba(229, 9, 20, 0.3));
        }
        .logo .tv-label {
            font-size: 0.3em;
            font-weight: 600;
            color: rgba(255,255,255,0.25);
            -webkit-text-fill-color: rgba(255,255,255,0.25);
            letter-spacing: 1px;
            margin-left: 4px;
        }

        /* ===== BÚSQUEDA ===== */
        #searchInput {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 30px;
            padding: 11px 18px;
            font-size: 0.85em;
            width: 100%;
            color: #fff;
            transition: all 0.3s ease;
            margin-bottom: 14px;
            font-weight: 400;
            backdrop-filter: blur(4px);
        }
        #searchInput::placeholder { color: rgba(255,255,255,0.3); font-weight: 300; }
        #searchInput:focus { 
            outline: none; 
            border-color: #e50914;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 4px rgba(229, 9, 20, 0.1), inset 0 0 0 1px rgba(229, 9, 20, 0.2);
        }

        /* ===== FILTROS ===== */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
        }
        .filter-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.7em;
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: 500;
            letter-spacing: 0.2px;
        }
        .filter-btn:hover { 
            background: rgba(255,255,255,0.08); 
            color: #fff;
            border-color: rgba(255,255,255,0.1);
        }
        .filter-btn.active { 
            background: #e50914; 
            color: #fff; 
            border-color: #e50914;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.25);
        }

        /* ===== PAÍSES ===== */
        .country-group {
            margin-bottom: 16px;
            background: rgba(255,255,255,0.02);
            border-radius: 14px;
            padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.03);
            transition: all 0.3s ease;
        }
        .country-group:hover { background: rgba(255,255,255,0.04); }
        .country-title {
            font-size: 0.95em;
            font-weight: 700;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid rgba(229, 9, 20, 0.2);
            color: rgba(255,255,255,0.75);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.2px;
        }
        .country-title .emoji { font-size: 1em; }

        /* ===== CANALES ===== */
        .channel-item {
            display: flex;
            align-items: center;
            padding: 7px 12px;
            margin: 5px 0;
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            gap: 12px;
            border: 1px solid transparent;
        }
        .channel-item:hover {
            background: rgba(255,255,255,0.06);
            transform: translateX(6px);
            border-color: rgba(255,255,255,0.06);
        }
        .channel-item.active {
            background: rgba(229, 9, 20, 0.12);
            border-color: rgba(229, 9, 20, 0.2);
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.03);
        }
        .channel-item.hidden { display: none; }

        .channel-logo {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.04);
            transition: all 0.3s ease;
        }
        .channel-item:hover .channel-logo {
            border-color: rgba(255,255,255,0.1);
        }
        .channel-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .channel-logo .fallback {
            font-size: 15px;
            font-weight: 700;
            color: rgba(255,255,255,0.25);
        }

        .channel-name {
            flex: 1;
            font-size: 0.78em;
            font-weight: 500;
            line-height: 1.3;
            color: rgba(255,255,255,0.8);
            letter-spacing: -0.1px;
            transition: color 0.3s ease;
        }
        .channel-item:hover .channel-name {
            color: #fff;
        }

        .btn-play {
            background: rgba(255,255,255,0.06);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 4px 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 0.65em;
            display: flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.2px;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .btn-play:hover {
            background: #e50914;
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.3);
            border-color: #e50914;
        }
        .btn-play i { font-size: 0.7em; }

        /* ===== ESTADÍSTICAS ===== */
        .stats {
            text-align: center;
            margin-top: 14px;
            padding: 8px;
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            font-size: 0.7em;
            color: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.03);
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* ===== URL PERSONALIZADA ===== */
        .custom-url-section {
            margin-top: 14px;
            padding: 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.03);
            transition: all 0.3s ease;
        }
        .custom-url-section:hover {
            background: rgba(255,255,255,0.03);
        }
        .custom-url-section input {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 30px;
            padding: 7px 14px;
            width: 100%;
            margin-bottom: 6px;
            font-size: 0.75em;
            color: #fff;
            transition: all 0.3s ease;
        }
        .custom-url-section input::placeholder { color: rgba(255,255,255,0.25); }
        .custom-url-section input:focus {
            outline: none;
            border-color: #e50914;
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.08);
        }
        .custom-url-section button {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            color: #fff;
            width: 100%;
            padding: 6px;
            border-radius: 30px;
            font-size: 0.75em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.3px;
        }
        .custom-url-section button:hover {
            background: #e50914;
            border-color: #e50914;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.2);
        }

        /* ===== LOADING INICIAL ===== */
        .initial-load {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex-direction: column;
            gap: 14px;
            color: rgba(255,255,255,0.2);
        }
        .initial-load .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(255,255,255,0.06);
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ================================================================
           MODAL DEL REPRODUCTOR (ESTILO PREMIUM)
        ================================================================ */
        .player-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        .player-modal-overlay.active {
            display: flex;
        }

        .player-modal {
            width: 92%;
            max-width: 1100px;
            background: linear-gradient(145deg, #1a1a2e, #0f1328);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255,255,255,0.04);
            animation: slideUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        /* Cabecera del modal */
        .player-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
            backdrop-filter: blur(4px);
        }
        .player-modal-header .title {
            font-weight: 700;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #fff;
            flex-wrap: wrap;
        }
        .player-modal-header .title .live {
            color: #e50914;
            font-size: 0.65em;
            background: rgba(229, 9, 20, 0.15);
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
            border: 1px solid rgba(229, 9, 20, 0.1);
        }
        .player-modal-header .close-btn {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .player-modal-header .close-btn:hover {
            background: #e50914;
            transform: rotate(90deg);
            border-color: #e50914;
            box-shadow: 0 0 30px rgba(229, 9, 20, 0.2);
        }

        /* Cuerpo del modal */
        .player-modal-body {
            flex: 1;
            background: #000;
            position: relative;
            min-height: 55vh;
            max-height: 70vh;
        }
        .player-modal-body video {
            width: 100%;
            height: 100%;
            max-height: 70vh;
            background: #000;
        }
        .player-modal-body iframe {
            width: 100%;
            height: 100%;
            max-height: 70vh;
            border: none;
            display: none;
        }

        /* Loading modal */
        .modal-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
            text-align: center;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 30px 40px;
            border-radius: 16px;
            backdrop-filter: blur(4px);
        }
        .modal-loading .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255,255,255,0.06);
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }
        .modal-loading.active { display: block; }

        /* ===== ANIMACIONES ===== */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { transform: translateY(50px) scale(0.96); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .sidebar { height: 100vh; padding: 16px 12px; }
            .logo { font-size: 1.3em; margin-bottom: 16px; }
            .channel-logo { width: 30px; height: 30px; font-size: 11px; }
            .channel-name { font-size: 0.7em; }
            .btn-play { padding: 3px 10px; font-size: 0.6em; }
            .filter-btn { font-size: 0.6em; padding: 3px 10px; }
            .player-modal { width: 98%; max-height: 95vh; border-radius: 14px; }
            .player-modal-body { min-height: 35vh; max-height: 55vh; }
            .player-modal-header { padding: 12px 16px; }
            .player-modal-header .title { font-size: 0.9em; }
        }

        @media (max-width: 480px) {
            .sidebar { padding: 12px 8px; }
            .logo { font-size: 1.1em; }
            .channel-logo { width: 26px; height: 26px; font-size: 10px; }
            .channel-name { font-size: 0.65em; }
            .btn-play { padding: 2px 8px; font-size: 0.55em; }
            .filter-btn { font-size: 0.55em; padding: 2px 8px; }
            .player-modal-body { min-height: 30vh; max-height: 45vh; }
            .modal-loading { padding: 20px 24px; }
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- ===== SIDEBAR ===== -->
            <div class="col-md-12 col-lg-12 sidebar">
                <!-- Logo -->
                <div class="logo">
                    <i class="fas fa-play-circle"></i>
                    Spay<span style="-webkit-text-fill-color:#fff;color:#fff;">Cine</span>
                    <span class="tv-label">TV</span>
                </div>

                <!-- Búsqueda -->
                <input type="text" id="searchInput" placeholder="🔍 Buscar canal...">

                <!-- Filtros -->
                <div class="filters" id="filterContainer">
                    <button class="filter-btn active" data-filter="all">🌐 Todos</button>
                    <button class="filter-btn" data-filter="noticias">📰 Noticias</button>
                    <button class="filter-btn" data-filter="deportes">⚽ Deportes</button>
                    <button class="filter-btn" data-filter="entretenimiento">🎬 Entretenimiento</button>
                    <button class="filter-btn" data-filter="musica">🎵 Música</button>
                    <button class="filter-btn" data-filter="cultural">🎭 Cultural</button>
                </div>

                <!-- Lista de canales -->
                <div id="channelsList">
                    <div class="initial-load">
                        <div class="spinner"></div>
                        <span>Cargando canales...</span>
                    </div>
                </div>

                <!-- Estadísticas -->
                <div class="stats" id="stats">📊 Cargando...</div>

                <!-- URL Personalizada -->
                <div class="custom-url-section">
                    <input type="text" id="customUrl" placeholder="🔗 URL M3U8 o ID Dailymotion (ej: x84eirw)">
                    <button id="playCustom">▶ Probar URL</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================================================================
    MODAL DEL REPRODUCTOR
    ================================================================ -->
    <div id="playerModal" class="player-modal-overlay">
        <div class="player-modal">
            <!-- Cabecera -->
            <div class="player-modal-header">
                <div class="title" id="modalTitle">
                    <span id="modalChannelName">Canal</span>
                    <span class="live" id="modalLiveStatus">● EN VIVO</span>
                </div>
                <button class="close-btn" id="modalCloseBtn">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Cuerpo -->
            <div class="player-modal-body" id="modalBody">
                <video id="modalVideo" controls preload="auto"></video>
                <iframe id="modalIframe" allow="autoplay; fullscreen"></iframe>
                <div class="modal-loading" id="modalLoading">
                    <div class="spinner"></div>
                    <span>Cargando stream...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        // ==================== CONFIGURACIÓN ====================
        const PROXY_URL = 'https://iptv-spay.onrender.com/proxy?url=';

        // ==================== VARIABLES GLOBALES ====================
        let currentHls = null;
        let canalesData = [];
        let categoriaActual = 'all';
        let timeoutBusqueda = null;
        let modalChannelName = '';

        // ==================== MIS CANALES DE DAILYMOTION ====================
        const misCanalesDailymotion = [
            { nombre: "RED UNO LPZ HD", pais: "Bolivia", logo: "https://i.postimg.cc/HWQ1JNbV/RED-UNO-LPZ-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/xa0fwio", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "RED UNO CBBA HD", pais: "Bolivia", logo: "https://i.postimg.cc/NM6C0WZy/RED-UNO-CBBA-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/xa0qka8", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "RED UNO SCZ HD", pais: "Bolivia", logo: "https://i.postimg.cc/6QRYHkWk/RED-UNO-SC-VLC-HD-02.jpg", url: "https://www.dailymotion.com/video/x9n2qyk", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "UNITEL BOLIVIA HD", pais: "Bolivia", logo: "https://i.ibb.co/pzVXZcg/UNITEL-BOLIVIA-VLC.jpg", url: "https://www.dailymotion.com/video/x7wzxiw", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "POV UNITEL HD", pais: "Bolivia", logo: "https://i.ibb.co/p3B7tSd/bolivia-hd-04.jpg", url: "https://www.dailymotion.com/video/x8eimg9", tipo: "dailymotion", categoria: "entretenimiento" },
            { nombre: "ATB BOLIVIA HD", pais: "Bolivia", logo: "https://i.postimg.cc/Y06y7NgW/ATB-BOLIVIA-HD.jpg", url: "https://www.dailymotion.com/video/x84eirw", tipo: "dailymotion", categoria: "noticias" },
            { nombre: "TELESUR HD", pais: "Bolivia", logo: "https://i.postimg.cc/QxmZpWDL/T-sr-Vlc08.jpg", url: "https://www.dailymotion.com/video/x82ug5r", tipo: "dailymotion", categoria: "noticias" }
        ];

        // ==================== PAÍSES ====================
        const PAISES = [
            { codigo: 'bo', nombre: 'Bolivia', emoji: '🇧🇴' },
            { codigo: 'ar', nombre: 'Argentina', emoji: '🇦🇷' },
            { codigo: 'br', nombre: 'Brasil', emoji: '🇧🇷' },
            { codigo: 'cl', nombre: 'Chile', emoji: '🇨🇱' },
            { codigo: 'co', nombre: 'Colombia', emoji: '🇨🇴' },
            { codigo: 'ec', nombre: 'Ecuador', emoji: '🇪🇨' },
            { codigo: 'py', nombre: 'Paraguay', emoji: '🇵🇾' },
            { codigo: 'pe', nombre: 'Perú', emoji: '🇵🇪' },
            { codigo: 'uy', nombre: 'Uruguay', emoji: '🇺🇾' },
            { codigo: 've', nombre: 'Venezuela', emoji: '🇻🇪' },
            { codigo: 'cr', nombre: 'Costa Rica', emoji: '🇨🇷' },
            { codigo: 'sv', nombre: 'El Salvador', emoji: '🇸🇻' },
            { codigo: 'gt', nombre: 'Guatemala', emoji: '🇬🇹' },
            { codigo: 'hn', nombre: 'Honduras', emoji: '🇭🇳' },
            { codigo: 'ni', nombre: 'Nicaragua', emoji: '🇳🇮' },
            { codigo: 'pa', nombre: 'Panamá', emoji: '🇵🇦' },
            { codigo: 'do', nombre: 'República Dominicana', emoji: '🇩🇴' },
            { codigo: 'pr', nombre: 'Puerto Rico', emoji: '🇵🇷' },
            { codigo: 'es', nombre: 'España', emoji: '🇪🇸' },
            { codigo: 'mx', nombre: 'México', emoji: '🇲🇽' }
        ];

        // ==================== CARGAR LISTA M3U ====================
        async function cargarListaM3U(url, paisOrigen) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const m3uContent = await response.text();
                return parsearM3U(m3uContent, paisOrigen);
            } catch (error) {
                console.error(`Error cargando ${url}:`, error);
                return [];
            }
        }

        function parsearM3U(content, paisOrigen) {
            const lines = content.split('\n');
            const canales = [];
            let currentChannel = null;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    const lastComma = line.lastIndexOf(',');
                    const nombre = lastComma !== -1 ? line.substring(lastComma + 1).trim() : 'Canal sin nombre';
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const logo = logoMatch ? logoMatch[1] : '';
                    const idMatch = line.match(/tvg-id="([^"]*)"/);
                    const id = idMatch ? idMatch[1] : '';
                    const groupMatch = line.match(/group-title="([^"]*)"/);
                    const grupo = groupMatch ? groupMatch[1] : '';
                    let categoria = detectarCategoria(nombre, grupo);
                    
                    currentChannel = {
                        id: id,
                        nombre: nombre,
                        pais: paisOrigen,
                        logo: logo,
                        url: '',
                        tipo: 'm3u8',
                        categoria: categoria,
                        grupo: grupo
                    };
                } else if (line && !line.startsWith('#') && currentChannel) {
                    currentChannel.url = line;
                    if (currentChannel.url.startsWith('http')) {
                        canales.push(currentChannel);
                    }
                    currentChannel = null;
                }
            }
            return canales;
        }

        function detectarCategoria(nombre, grupo) {
            const texto = (nombre + ' ' + grupo).toLowerCase();
            const palabrasClave = {
                'noticias': ['noticia', 'news', 'informe', 'actualidad', 'cnn', 'bbc', 'telefe noticias', 'el trece', 'tvn', 'canal 13', 'red uno', 'unitel', 'atb', 'telesur'],
                'deportes': ['deporte', 'sport', 'fútbol', 'futbol', 'gol', 'espn', 'tyc', 'fox sports', 'goal', 'racing', 'boca', 'river', 'liga', 'champions', 'uefa', 'libertadores', 'sudamericana', 'nfl', 'nba', 'mlb', 'tennis', 'tenis', 'motogp', 'formula', 'f1', 'automovilismo', 'boxeo', 'ufc', 'wwe', 'lucha', 'baseball', 'beisbol', 'basketball', 'baloncesto', 'deportes', 'sports', 'dazn'],
                'entretenimiento': ['entretenimiento', 'series', 'películas', 'pelicula', 'cine', 'telefe', 'el trece', 'entreten', 'show', 'telenovela'],
                'musica': ['música', 'musica', 'music', 'mtv', 'viva', 'radio', 'sound'],
                'cultural': ['cultural', 'educativo', 'educación', 'documental', 'history', 'discovery', 'cultura']
            };
            for (const [categoria, palabras] of Object.entries(palabrasClave)) {
                for (const palabra of palabras) {
                    if (texto.includes(palabra)) return categoria;
                }
            }
            return 'entretenimiento';
        }

        // ==================== CARGAR TODOS LOS CANALES ====================
        async function cargarTodosLosCanales() {
            let todosLosCanales = [...misCanalesDailymotion];
            console.log('📡 Cargando canales desde iptv-org...');
            
            for (const pais of PAISES) {
                try {
                    const canales = await cargarListaM3U(`https://iptv-org.github.io/iptv/countries/${pais.codigo}.m3u`, pais.nombre);
                    console.log(`${pais.emoji} ${pais.nombre}: ${canales.length} canales`);
                    todosLosCanales = todosLosCanales.concat(canales);
                } catch (error) {
                    console.error(`Error cargando ${pais.codigo}:`, error);
                }
            }
            
            try {
                const deportes = await cargarListaM3U('https://iptv-org.github.io/iptv/categories/sports.m3u', 'Deportes');
                console.log(`⚽ Deportes: ${deportes.length} canales`);
                todosLosCanales = todosLosCanales.concat(deportes);
            } catch (error) {
                console.error('Error cargando deportes:', error);
            }
            
            console.log(`✅ Total canales: ${todosLosCanales.length}`);
            return todosLosCanales;
        }

        // ==================== RENDERIZAR CANALES ====================
        function renderChannels(canales) {
            const porPais = {};
            canales.forEach(canal => {
                if (!porPais[canal.pais]) porPais[canal.pais] = [];
                porPais[canal.pais].push(canal);
            });
            
            const paisesOrdenados = Object.keys(porPais).sort();
            let html = '';
            for (const pais of paisesOrdenados) {
                html += `<div class="country-group" data-pais="${pais}"><div class="country-title"><span class="emoji">📺</span> ${pais}</div>`;
                porPais[pais].forEach(canal => {
                    const logoHtml = canal.logo ? 
                        `<img src="${canal.logo}" alt="${canal.nombre}" onerror="this.outerHTML='<span class=\\'fallback\\'>${canal.nombre.charAt(0)}</span>'">` : 
                        `<span class="fallback">${canal.nombre.charAt(0)}</span>`;
                    
                    const nombreSanitizado = canal.nombre.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    const urlSanitizada = canal.url.replace(/'/g, "\\'");
                    const tipo = canal.tipo || 'm3u8';
                    const categoriaAttr = canal.categoria || 'entretenimiento';
                    
                    html += `
                        <div class="channel-item" data-nombre="${canal.nombre.toLowerCase()}" data-url="${urlSanitizada}" data-nombre-original="${nombreSanitizado}" data-tipo="${tipo}" data-categoria="${categoriaAttr}">
                            <div class="channel-logo">${logoHtml}</div>
                            <span class="channel-name">${canal.nombre}</span>
                            <button class="btn-play" onclick="event.stopPropagation(); abrirModal('${urlSanitizada}', '${nombreSanitizado}', '${tipo}')">
                                <i class="fas fa-play"></i>
                            </button>
                        </div>
                    `;
                });
                html += `</div>`;
            }
            
            document.getElementById('channelsList').innerHTML = html;
            document.getElementById('stats').innerHTML = `📊 ${canales.length} canales | ${paisesOrdenados.length} países`;
            
            document.querySelectorAll('.channel-item').forEach(item => {
                item.addEventListener('click', function() {
                    abrirModal(this.dataset.url, this.dataset.nombreOriginal, this.dataset.tipo);
                });
            });
            
            aplicarFiltros();
        }

        // ==================== FILTROS ====================
        function setupFilters() {
            const filters = document.querySelectorAll('.filter-btn');
            filters.forEach(btn => {
                btn.addEventListener('click', function() {
                    filters.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    categoriaActual = this.dataset.filter;
                    aplicarFiltros();
                });
            });
        }

        function aplicarFiltros() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            document.querySelectorAll('.channel-item').forEach(item => {
                const nombre = item.dataset.nombre || '';
                const categoria = item.dataset.categoria || 'entretenimiento';
                const matchSearch = nombre.includes(searchTerm);
                const matchCategoria = categoriaActual === 'all' || categoria === categoriaActual;
                item.classList.toggle('hidden', !(matchSearch && matchCategoria));
            });
            
            document.querySelectorAll('.country-group').forEach(group => {
                const visibleItems = group.querySelectorAll('.channel-item:not(.hidden)');
                group.style.display = visibleItems.length > 0 ? '' : 'none';
            });
            
            const totalVisibles = document.querySelectorAll('.channel-item:not(.hidden)').length;
            document.getElementById('stats').innerHTML = `📊 ${totalVisibles} canales visibles`;
        }

        // ==================== BÚSQUEDA ====================
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', function() {
                clearTimeout(timeoutBusqueda);
                timeoutBusqueda = setTimeout(aplicarFiltros, 150);
            });
        }

        // ==================== MODAL DEL REPRODUCTOR ====================
        function abrirModal(url, channelName, tipo = 'm3u8') {
            const modal = document.getElementById('playerModal');
            const video = document.getElementById('modalVideo');
            const iframe = document.getElementById('modalIframe');
            const loading = document.getElementById('modalLoading');
            
            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }
            if (video.src) {
                video.pause();
                video.removeAttribute('src');
                video.load();
            }
            if (iframe.src) {
                iframe.src = '';
                iframe.style.display = 'none';
            }
            
            video.style.display = 'none';
            iframe.style.display = 'none';
            loading.classList.add('active');
            
            document.getElementById('modalChannelName').textContent = channelName;
            document.getElementById('modalLiveStatus').textContent = '● CONECTANDO';
            modalChannelName = channelName;
            
            modal.classList.add('active');
            cargarStreamEnModal(url, channelName, tipo);
        }

        function cerrarModal() {
            const modal = document.getElementById('playerModal');
            const video = document.getElementById('modalVideo');
            const iframe = document.getElementById('modalIframe');
            
            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }
            if (video.src) {
                video.pause();
                video.removeAttribute('src');
                video.load();
            }
            if (iframe.src) {
                iframe.src = '';
                iframe.style.display = 'none';
            }
            
            modal.classList.remove('active');
        }

        function cargarStreamEnModal(url, channelName, tipo = 'm3u8') {
            const video = document.getElementById('modalVideo');
            const iframe = document.getElementById('modalIframe');
            const loading = document.getElementById('modalLoading');
            const liveStatus = document.getElementById('modalLiveStatus');
            
            const dmMatch = url.match(/\/video\/([a-z0-9]+)/i);
            if (dmMatch || tipo === 'dailymotion') {
                const videoId = dmMatch ? dmMatch[1] : null;
                if (videoId) {
                    video.style.display = 'none';
                    iframe.style.display = 'block';
                    iframe.src = `https://geo.dailymotion.com/player.html?video=${videoId}&autoplay=1`;
                    loading.classList.remove('active');
                    liveStatus.textContent = '● EN VIVO';
                    return;
                }
            }
            
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('v=')) videoId = url.split('v=')[1].split('&')[0];
                else if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].split('?')[0];
                if (videoId) {
                    video.style.display = 'none';
                    iframe.style.display = 'block';
                    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                    loading.classList.remove('active');
                    liveStatus.textContent = '● REPRODUCIENDO';
                    return;
                }
            }
            
            if (url.includes('.m3u8')) {
                video.style.display = 'block';
                iframe.style.display = 'none';
                
                if (Hls.isSupported()) {
                    currentHls = new Hls({ debug: false, enableWorker: true });
                    currentHls.loadSource(url);
                    currentHls.attachMedia(video);
                    currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                        loading.classList.remove('active');
                        liveStatus.textContent = '● EN VIVO';
                        video.play().catch(e => console.error('Error:', e));
                    });
                    currentHls.on(Hls.Events.ERROR, () => {
                        loading.classList.remove('active');
                        liveStatus.textContent = '❌ ERROR';
                    });
                } else {
                    video.src = url;
                    video.addEventListener('loadedmetadata', () => {
                        loading.classList.remove('active');
                        liveStatus.textContent = '● EN VIVO';
                        video.play();
                    }, { once: true });
                }
            } else if (url.startsWith('http')) {
                loading.classList.remove('active');
                liveStatus.textContent = '⚠️ WEB';
                video.style.display = 'none';
                iframe.style.display = 'none';
                window.open(url, '_blank');
            } else {
                loading.classList.remove('active');
                liveStatus.textContent = '❌ ERROR';
                video.style.display = 'none';
                iframe.style.display = 'none';
            }
        }

        // ==================== URL PERSONALIZADA ====================
        function setupCustomUrl() {
            const customUrl = document.getElementById('customUrl');
            const playCustom = document.getElementById('playCustom');
            
            playCustom.onclick = () => {
                const input = customUrl.value.trim();
                if (!input) return;
                if (input.match(/^x[a-z0-9]+$/i)) {
                    abrirModal(`https://www.dailymotion.com/video/${input}`, "URL Personalizada", "dailymotion");
                } else {
                    abrirModal(input, "URL Personalizada", "m3u8");
                }
            };
            
            customUrl.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const input = customUrl.value.trim();
                    if (!input) return;
                    if (input.match(/^x[a-z0-9]+$/i)) {
                        abrirModal(`https://www.dailymotion.com/video/${input}`, "URL Personalizada", "dailymotion");
                    } else {
                        abrirModal(input, "URL Personalizada", "m3u8");
                    }
                }
            });
        }

        // ==================== EVENTOS DEL MODAL ====================
        function setupModalEvents() {
            document.getElementById('modalCloseBtn').addEventListener('click', cerrarModal);
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') cerrarModal();
            });
            
            document.getElementById('playerModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) cerrarModal();
            });
        }

        // ==================== INICIALIZAR ====================
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🎬 Iniciando SpayCine TV...');
            
            canalesData = await cargarTodosLosCanales();
            renderChannels(canalesData);
            
            setupFilters();
            setupSearch();
            setupCustomUrl();
            setupModalEvents();
            
            console.log(`✅ ${canalesData.length} canales cargados`);
        });
    </script>
